<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fee Setup | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">FEE HUB</p><h1>Fee Setup</h1><p id="status" class="muted">Loading published fees…</p><form id="publish" class="card"><label>Academic year<input name="academicYearId" required></label><label>Term<input name="termId" required></label><label>Fee type<input name="feeStructureId" required></label><label>Amount (GH₵)<input name="amount" inputmode="decimal" required></label><label>Target<select name="scope"><option value="ALL_STUDENTS">All students</option><option value="SPECIFIC_CLASS">Specific class</option></select></label><label>Class ID (when specific)<input name="classId"></label><button type="submit">Publish fee</button></form><section id="fees" class="report-grid"></section></main><script>
const status=document.querySelector('#status');const minor=v=>{const m=String(v).trim().match(/^\d+(?:\.\d{1,2})?$/);if(!m)throw Error('Enter a valid amount');const [a,b='']=m[0].split('.');return Number(a)*100+Number((b+'00').slice(0,2))};async function load(){try{const r=await fetch('/api/fees/obligations');const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load fees');document.querySelector('#fees').innerHTML=(j||[]).map(x=>`<article class="card">${x.fee_structure_id||x.feeStructureId||'Published fee'} · ${x.amount_minor??x.amountMinor??''}</article>`).join('')||'<p>No published fees.</p>';status.textContent='Ready';}catch(e){status.textContent=e.message}}document.querySelector('#publish').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const body={scope:f.get('scope'),feeStructureId:f.get('feeStructureId'),academicYearId:f.get('academicYearId'),termId:f.get('termId'),amountMinor:minor(f.get('amount')),classId:f.get('classId')||undefined};const r=await fetch('/api/fees/obligations/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Publication failed');status.textContent=`Published successfully · ${j.created_count??0} created`;await load();}catch(e){status.textContent=e.message}});load();</script></body></html>
