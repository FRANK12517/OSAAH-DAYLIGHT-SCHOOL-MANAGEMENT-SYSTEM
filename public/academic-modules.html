<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Module | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">ACADEMICS</p><h1 id="module-title">Academic Module</h1><p id="module-description" class="muted"></p><section class="card"><form class="student-form"><label>Academic Year<select><option>2026/2027</option></select></label><label>Term<select><option>First Term</option><option>Second Term</option><option>Third Term</option></select></label><label>Class / Level<select id="class-level"><option value="">All classes</option></select></label><button class="primary-button" type="button">Open Selection</button></form></section><section class="card"><p id="module-empty" class="muted"></p></section></main><script type="module">import{SCHOOL_CLASS_CATALOGUE}from'/class-catalogue.js';const key=document.body.dataset.currentModule||location.pathname.split('/').pop(),modules={"academic-years":["Academic Years","Manage the school’s configured academic years."],"academic-terms":["Terms","Manage terms within the selected academic year."],"academic-classes":["Classes","View and manage the school’s configured classes and levels."],"teacher-assignments":["Teacher Assignments","View class and subject assignments for authorized teachers."],curriculum:["Curriculum","Open curriculum records for the selected academic context."],"lesson-plans":["Lesson Plans","Open lesson plans for the selected class and term."],"academic-assignments":["Assignments","Open class assignments without redirecting to an unrelated module."],timetable:["Timetable","Open the class teaching timetable. Examination scheduling is available separately under Exam Timetable."],spreadsheets:["Spreadsheets","Open academic spreadsheets for the selected year, term and class."]},item=modules[key]||["Academic Module","Select an academic context to continue."];document.querySelector('#module-title').textContent=item[0];document.querySelector('#module-description').textContent=item[1];document.querySelector('#module-empty').textContent=`No ${item[0].toLowerCase()} records are available for the current selection.`;document.querySelector('#class-level').insertAdjacentHTML('beforeend',SCHOOL_CLASS_CATALOGUE.map(c=>`<option value="${c.id}">${c.label}</option>`).join(''));</script></body></html>
