<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Leave | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"><style>.leave-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}.leave-grid label{display:flex;flex-direction:column;gap:.35rem}.leave-table{width:100%;border-collapse:collapse}.leave-table th,.leave-table td{padding:.65rem;border-bottom:1px solid #d9e0e7;text-align:left;vertical-align:top}.state{display:inline-block;padding:.2rem .45rem;border-radius:999px;font-size:.78rem;font-weight:700}.state-APPROVED{background:#dff5e8;color:#12633a}.state-PENDING{background:#fff1c9;color:#765000}.state-REJECTED,.state-CANCELLED{background:#fbe0e0;color:#8c1d1d}.actions{display:flex;flex-wrap:wrap;gap:.4rem}.actions button{min-height:34px}.trace{font-size:.82rem;color:#526273}</style></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">STAFF MANAGEMENT</p><h1>Staff Leave</h1><p class="muted">Approved leave is reconciled into staff attendance as <strong>On Leave</strong>. Existing Present, Checked In, and Late records are preserved and flagged as conflicts.</p><section class="card"><form id="leave-form" class="student-form"><div class="leave-grid"><label>Staff ID<input id="staff-id" name="staffId" required placeholder="Your staff/user ID"></label><label>Academic Year<select id="academic-year" name="academicYear"><option value="">Loading academic years…</option></select></label><label>Term<select id="term" name="term"><option value="">Loading terms…</option></select></label><label>Leave type<select name="leaveType"><option value="ANNUAL">Annual</option><option value="SICK">Sick</option><option value="PERMISSION">Permission</option><option value="MATERNITY">Maternity</option></select></label><label>Starts on<input name="startsOn" type="date" required></label><label>Ends on<input name="endsOn" type="date" required></label></div><label>Reason<textarea name="reason" rows="3" placeholder="Reason for leave"></textarea></label><button class="primary-button" type="submit">Submit Leave Request</button></form><p id="leave-status" class="muted" role="status"></p></section><section class="card"><h2>Leave requests</h2><div class="responsive-table"><table class="leave-table"><thead><tr><th>Staff</th><th>Period</th><th>Type</th><th>Status</th><th>Trace</th><th>Actions</th></tr></thead><tbody id="leave-requests"><tr><td colspan="6">Loading leave requests…</td></tr></tbody></table></div></section></main><script>
const form=document.querySelector('#leave-form'),status=document.querySelector('#leave-status'),rows=document.querySelector('#leave-requests'),staffId=document.querySelector('#staff-id'),year=document.querySelector('#academic-year'),term=document.querySelector('#term');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadOptions(){const [sessionResponse,optionsResponse]=await Promise.all([fetch('/api/auth/session'),fetch('/api/attendance/options')]);const session=await sessionResponse.json();const options=await optionsResponse.json();if(session.user?.id)staffId.value=session.user.id;if(optionsResponse.ok){year.innerHTML='<option value="">No academic scope</option>'+options.academicYears.map(x=>`<option value="${esc(x.name??x.id)}">${esc(x.name??x.id)}</option>`).join('');term.innerHTML='<option value="">No term scope</option>'+options.terms.map(x=>`<option value="${esc(x.name??x.id)}">${esc(x.name??x.id)}</option>`).join('')}}
async function loadLeave(){const query=staffId.value?`?staffId=${encodeURIComponent(staffId.value)}`:'';const response=await fetch('/api/staff/leave'+query);const data=await response.json();if(!response.ok){rows.innerHTML=`<tr><td colspan="6">${esc(data.error||'Leave requests could not be loaded.')}</td></tr>`;return}rows.innerHTML=data.leave.length?data.leave.map(item=>`<tr><td>${esc(item.staffId)}</td><td>${esc(item.startsOn)} → ${esc(item.endsOn)}<br><span class="trace">${esc(item.academicYear||'Unscoped')} · ${esc(item.term||'Unscoped')}</span></td><td>${esc(item.leaveType)}</td><td><span class="state state-${esc(item.state)}">${esc(item.state)}</span></td><td><span class="trace">${item.state==='APPROVED'?'Attendance reconciles as On Leave; see staff attendance report.':item.state==='CANCELLED'?'Generated attendance is safely restored.':'No approved-leave attendance generated.'}</span></td><td><div class="actions">${item.state==='PENDING'?`<button type="button" data-decision="APPROVED" data-id="${esc(item.id)}">Approve</button><button type="button" data-decision="REJECTED" data-id="${esc(item.id)}">Reject</button>`:''}${item.state==='APPROVED'?`<button type="button" data-decision="CANCELLED" data-id="${esc(item.id)}">Cancel</button>`:''}</div></td></tr>`).join(''):'<tr><td colspan="6">No leave requests found.</td></tr>'}
form.addEventListener('submit',async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(form));if(!data.staffId){status.textContent='Enter a Staff ID or sign in again.';return}status.textContent='Submitting leave request…';const response=await fetch(`/api/staff/${encodeURIComponent(data.staffId)}/leave`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const result=await response.json();status.textContent=response.ok?'Leave request submitted and awaiting approval.':result.error||'Leave request could not be submitted.';if(response.ok){form.querySelector('[name=startsOn]').value='';form.querySelector('[name=endsOn]').value='';form.querySelector('[name=reason]').value='';await loadLeave()}});
rows.addEventListener('click',async event=>{const button=event.target.closest('[data-decision]');if(!button)return;button.disabled=true;const response=await fetch(`/api/staff/leave/${encodeURIComponent(button.dataset.id)}/decision`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({state:button.dataset.decision})});const result=await response.json();status.textContent=response.ok?`Leave ${button.dataset.decision.toLowerCase()}; attendance reconciliation completed.`:result.error||'Leave decision failed.';await loadLeave()});
loadOptions().then(loadLeave).catch(()=>{status.textContent='Leave workspace is temporarily unavailable.'});
</script></body></html>
