<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parent Fees | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">PARENT PORTAL</p><h1>Parent Fees</h1><p id="status" class="muted">Loading published fees…</p><section id="children" class="report-grid"></section></main><script>fetch('/api/parent/fee-obligations').then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load fees');children.innerHTML=(j.children||j||[]).map(c=>`<article class="card"><h2>${c.student_name||c.studentName||'Child'}</h2><p>${(c.obligations||[]).length?c.obligations.map(o=>`${o.amount_minor??o.amountMinor??''} · Payment allocation unavailable`).join('<br>'):'No published fees for the selected period'}</p></article>`).join('')||'<p>No linked children.</p>';status.textContent='Ready'}).catch(e=>status.textContent=e.message);</script></body></html>
