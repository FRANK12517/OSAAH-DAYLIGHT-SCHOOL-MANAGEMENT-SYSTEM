<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parent Fees | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"><style>.parent-receipts{margin-top:2rem}.receipt-table{width:100%;border-collapse:collapse;background:#fff}.receipt-table th,.receipt-table td{padding:.7rem;border-bottom:1px solid #dfe7ef;text-align:left;vertical-align:top}.receipt-table th{font-size:.8rem;text-transform:uppercase;color:#52606d}.receipt-actions{display:flex;gap:.5rem;flex-wrap:wrap}.receipt-actions a{white-space:nowrap}</style></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">PARENT PORTAL</p><h1>Parent Fees</h1><p id="status" class="muted">Loading published fees…</p><section id="children" class="report-grid"></section><section class="card parent-receipts" aria-labelledby="receipts-heading"><p class="eyebrow">PAYMENT RECEIPTS</p><h2 id="receipts-heading">Payment Receipts</h2><p id="receipt-status" class="muted">Loading payment receipts…</p><div id="receipts"></div></section></main><script type="module">import {renderParentFeeGroups} from "/src/parent-fees-renderer.js";const escapeHtml=(value)=>String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const money=(value)=>`GH₵ ${Number(value??0).toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2})}`;const status=document.getElementById('status');const children=document.getElementById('children');const receiptStatus=document.getElementById('receipt-status');const receipts=document.getElementById('receipts');const receiptTable=(rows)=>rows.length?`<div class="table-scroll"><table class="receipt-table"><thead><tr><th>Receipt Number</th><th>Payment Date</th><th>Student</th><th>Permanent Student ID</th><th>Fee Type</th><th>Academic Year</th><th>Term</th><th>Amount Paid</th><th>Method</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map((row)=>{const number=encodeURIComponent(row.receiptNumber);return `<tr><td>${escapeHtml(row.receiptNumber)}</td><td>${escapeHtml(row.date||row.paymentDate||row.createdAt||'—')}</td><td>${escapeHtml(row.studentName||'—')}</td><td>${escapeHtml(row.permanentStudentId||'—')}</td><td>${escapeHtml(row.description||row.feeType||'School payment')}</td><td>${escapeHtml(row.academicYear||row.academicYearId||'—')}</td><td>${escapeHtml(row.term||row.termId||'—')}</td><td>${money(row.amount)}</td><td>${escapeHtml(row.paymentMethod||row.method||'—')}</td><td>${escapeHtml(row.status||'—')}</td><td><span class="receipt-actions"><a class="text-button" href="/api/fees/receipts/${number}/preview" target="_blank" rel="noopener">View Receipt</a><a class="text-button" href="/api/fees/receipts/${number}/pdf">Download Receipt PDF</a></span></td></tr>`;}).join('')}</tbody></table></div>`:'<p class="muted">No payment receipts available.</p>';Promise.all([fetch('/api/parent/fee-obligations').then(async(r)=>{const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load fees');return j;}),fetch('/api/parent/receipts').then(async(r)=>{const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load payment receipts');return j;})]).then(([feeBody,receiptBody])=>{children.innerHTML=renderParentFeeGroups(feeBody);status.textContent='Ready';receipts.innerHTML=receiptTable(receiptBody.receipts||[]);receiptStatus.textContent='Ready';}).catch((error)=>{status.textContent=error.message;receiptStatus.textContent=error.message;receipts.innerHTML='<p class="muted">No payment receipts available.</p>';});</script></body></html>
