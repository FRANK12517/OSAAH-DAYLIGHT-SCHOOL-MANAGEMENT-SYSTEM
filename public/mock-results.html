<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock Results | Osaah Daylight</title><link rel="stylesheet" href="/styles.css">
<style>
.mock-page{max-width:1180px;margin:0 auto;padding:1.25rem}.mock-page .result-slip{position:relative;max-width:1000px;margin:1.25rem auto;background:#fff;padding:16px;border:4px solid #102a43;box-sizing:border-box}.mock-page .result-slip::before{content:"";position:absolute;inset:7px;border:1px solid #d4af37;pointer-events:none}.mock-page .result-content{position:relative;z-index:1;padding:18px}.mock-page .slip-logo{display:block;max-width:min(100%,720px);height:auto;margin:0 auto 12px}.mock-page .slip-watermark{position:absolute;inset:30% 10%;opacity:.035;max-width:80%;margin:auto;pointer-events:none}.mock-page .student-cards,.mock-page .summary-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.mock-page .student-card,.mock-page .summary-card{border:1px solid #d9e2ec;padding:10px;background:#f8fafc}.mock-page .summary-card b,.mock-page .student-card b{display:block;color:#486581;font-size:.72rem;text-transform:uppercase}.mock-page .table-scroll{overflow-x:auto}.mock-page table{width:100%;min-width:720px;border-collapse:collapse}.mock-page th,.mock-page td{border:1px solid #bcccdc;padding:8px;text-align:left}.mock-page th{background:#102a43;color:#fff}.mock-page h2,.mock-page h3{text-align:center;color:#102a43}.mock-page .section-title{border-bottom:2px solid #d4af37;padding-bottom:5px}.mock-page .assessment-grid,.mock-page .attendance-grid,.mock-page .signature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.mock-page .assessment-item,.mock-page .attendance-item,.mock-page .signature-item{border:1px solid #d9e2ec;padding:10px}.mock-page .signature-grid{margin-top:24px}.mock-page .signature-item{min-height:70px}.mock-page .empty-result{padding:2rem;text-align:center}.mock-page .no-print{position:relative;z-index:2}@media(max-width:700px){.mock-page{padding:.5rem}.mock-page .result-slip{padding:9px;border-width:3px}.mock-page .result-content{padding:12px}.mock-page .student-cards,.mock-page .summary-cards,.mock-page .assessment-grid,.mock-page .attendance-grid,.mock-page .signature-grid{grid-template-columns:1fr}.mock-page .slip-logo{max-height:90px;object-fit:contain}}
@media print{.mock-page{padding:0}.mock-page .result-slip{margin:0;max-width:none;break-inside:avoid;border-color:#102a43!important}.mock-page .result-slip::before{border-color:#d4af37!important}.mock-page .no-print{display:none!important}.mock-page .table-scroll{overflow:visible}.mock-page table{min-width:0;font-size:9pt}}
</style>
</head>
<body><main class="form-page mock-page"><a class="text-button no-print" href="/">← Dashboard</a><p class="eyebrow no-print">EXAMINATIONS &amp; RESULTS</p><h1 class="no-print">Mock Result Slip</h1><p class="no-print"><a class="text-button" href="/mock-broadsheet.html">Open Mock Broadsheet</a></p><section class="card no-print"><form id="result-context"><label>Academic Year<input name="academicYear" value="2026/2027" required></label><label>Term<select name="term"><option>First Term</option><option>Second Term</option><option>Third Term</option></select></label><label>Mock Examination<select name="mockLabel"></select></label><label>Class<select name="classId"></select></label><label>Student<select name="studentId"></select></label><button class="primary-button" type="submit">Generate Mock Result</button></form><p id="status" class="error" role="status"></p></section><article id="result" class="result-slip" hidden></article></main><script src="/mock-result-view.js"></script></body></html>
