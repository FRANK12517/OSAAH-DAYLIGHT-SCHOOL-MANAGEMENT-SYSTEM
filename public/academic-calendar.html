<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Calendar | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"><style>
:root{--navy:#102a43;--blue:#1769aa;--gold:#d4a72c}.calendar-page{max-width:1240px}.calendar-header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:3px solid var(--gold);padding:20px 0}.calendar-controls,.filter-grid,.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.calendar-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0}.calendar-toolbar button.active{background:var(--navy);color:#fff}.calendar-card{background:#fff;border:1px solid #e5dfd2;border-radius:10px;padding:18px;margin:16px 0}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid #e5dfd2;border-left:1px solid #e5dfd2}.calendar-grid>div{min-height:110px;border-right:1px solid #e5dfd2;border-bottom:1px solid #e5dfd2;padding:7px}.day-label{min-height:auto!important;background:#f5f1e8;font-weight:700;color:var(--navy)}.day-muted{background:#fafafa;color:#9aa7b1}.event-chip{display:block;margin:4px 0;padding:5px;border-left:4px solid var(--blue);background:#eef6fb;font-size:12px;cursor:pointer}.event-chip[data-category="Examination"],.event-chip[data-category="Mock Examination"]{border-color:#a33}.event-chip[data-category*="Holiday"],.event-chip[data-category="Closing/Vacation"]{border-color:#c88b00}.event-chip[data-category*="Meeting"]{border-color:#7652a3}.event-chip[data-status="DRAFT"]{opacity:.65;border-style:dashed}.agenda-row{display:grid;grid-template-columns:120px 1fr 150px 140px;gap:12px;padding:12px 0;border-bottom:1px solid #e5dfd2}.status{padding:4px 8px;border-radius:12px;background:#eee;font-size:11px;font-weight:700}.status-PUBLISHED{background:#e4f5e9;color:#176b35}.status-CANCELLED{background:#fde8e8;color:#9b2c2c}.status-DRAFT{background:#fff4d6;color:#735600}.hidden{display:none!important}.message{padding:14px;background:#fff8df;border-radius:8px}.error{background:#fff0f0;color:#9b2c2c}.section-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}@media(max-width:680px){.calendar-header{display:block}.calendar-grid{display:none}.agenda-row{grid-template-columns:1fr}.calendar-page{padding:12px}.calendar-card{padding:12px}}
@media print{body{background:#fff}.no-print,.text-button,form,#status{display:none!important}.calendar-page{max-width:none}.calendar-card{border:0}.calendar-grid{display:grid!important}.agenda-view,.summary-panels{display:none!important}}
</style></head><body><main class="form-page calendar-page"><a class="text-button no-print" href="/">← School workspace</a><header class="calendar-header"><div><p class="eyebrow">OSAAH DAYLIGHT SCHOOL</p><h1>Academic Calendar</h1><p class="muted">Plan, manage and publish academic terms, school activities, examinations, holidays and important dates for OSAAH Daylight School.</p></div><div class="no-print"><button id="print" class="secondary-button">Print Calendar</button><button id="add" class="primary-button">Add Academic Event</button></div></header><p id="status" class="message" role="status">Loading the Academic Calendar…</p><section class="calendar-card no-print"><div class="filter-grid"><label>Academic Year<select id="year"></select></label><label>Term<select id="term"></select></label><label>Category<select id="category"></select></label><label>Status<select id="eventStatus"></select></label><label>Audience<select id="audience"></select></label><label>Search Events<input id="search" placeholder="Title, description or venue"></label><label>From<input id="from" type="date"></label><label>To<input id="to" type="date"></label></div></section><section class="calendar-card no-print"><div class="calendar-toolbar"><button class="secondary-button" id="prev">Previous Month</button><button class="secondary-button" id="today">Today</button><button class="secondary-button" id="next">Next Month</button><strong id="monthLabel"></strong><span class="spacer"></span><button class="secondary-button active" data-view="month">Month View</button><button class="secondary-button" data-view="week">Week View</button><button class="secondary-button" data-view="agenda">Agenda View</button><button class="secondary-button" data-view="term">Term View</button></div><div id="calendarView"></div></section><section class="section-grid summary-panels"><article class="calendar-card"><h2>Upcoming Events</h2><div id="upcoming"></div></article><article class="calendar-card"><h2>Today's Activities</h2><div id="todayActivities"></div></article><article class="calendar-card"><h2>Important Dates</h2><div id="important"></div></article></section></main><dialog id="eventDialog"><form method="dialog" id="eventForm"><h2 id="dialogTitle">Add Academic Event</h2><input type="hidden" name="id"><div class="form-grid"><label>Event Title<input name="title" required></label><label>Event Category<select name="category" required></select></label><label>Specify Event Category<input name="customCategory"></label><label>Academic Year<select name="academicYear" required></select></label><label>Term<select name="term" required></select></label><label>Start Date<input name="startDate" type="date" required></label><label>End Date<input name="endDate" type="date"></label><label>Start Time<input name="startTime" type="time"></label><label>End Time<input name="endTime" type="time"></label><label>Venue<input name="venue"></label><label>Status<select name="status"><option>DRAFT</option><option>PUBLISHED</option><option>CANCELLED</option></select></label><label>Audience<select name="audience" multiple size="4"></select></label><label>Classes for Selected Class<select name="classScope" multiple size="4"></select></label></div><label><input name="allDay" type="checkbox" checked> All-Day Event</label><label>Description<textarea name="description" rows="3"></textarea></label><div class="button-row"><button class="secondary-button" value="cancel">Close</button><button class="secondary-button" id="publishEvent" type="button">Publish</button><button class="secondary-button" id="cancelEvent" type="button">Cancel Event</button><button class="primary-button" id="saveEvent" value="default">Save Event</button></div><p id="dialogError" class="message error hidden"></p></form></dialog><script>
const $=s=>document.querySelector(s), state={options:null,events:[],view:'month',month:new Date(),editing:null}; const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const params=()=>new URLSearchParams(Object.entries({academicYear:$('#year').value,term:$('#term').value,category:$('#category').value,status:$('#eventStatus').value,audience:$('#audience').value,search:$('#search').value,from:$('#from').value,to:$('#to').value}).filter(([,v])=>v));
async function api(url,options){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Academic Calendar request failed.');return d}
function fill(select,rows,empty='All'){select.innerHTML=`<option value="">${empty}</option>`+rows.map(x=>`<option value="${esc(x.id??x)}">${esc(x.name??x)}</option>`).join('')}
async function load(){try{state.options=await api('/api/academic-calendar/options'); fill($('#year'),state.options.academicYears,'All academic years');fill($('#term'),state.options.terms,'All terms');fill($('#category'),state.options.categories,'All categories');fill($('#eventStatus'),state.options.statuses,'All statuses');fill($('#audience'),state.options.audiences,'All audiences');fill($('[name=academicYear]'),state.options.academicYears,'Select year');fill($('[name=term]'),state.options.terms,'Select term');fill($('[name=category]'),state.options.categories,'Select category');fill($('[name=audience]'),state.options.audiences,'');fill($('[name=classScope]'),state.options.classes,''); await refresh(); $('#status').className='';$('#status').textContent='';}catch(e){showError(e.message)}}
async function refresh(){try{state.events=await api('/api/academic-calendar?'+params()); render();}catch(e){showError(e.message)}} function showError(m){$('#status').className='message error';$('#status').innerHTML=`<strong>Unable to load Academic Calendar.</strong> ${esc(m)} <button class="secondary-button" onclick="load()">Retry</button>`}
function render(){const visible=state.events; $('#monthLabel').textContent=state.month.toLocaleString(undefined,{month:'long',year:'numeric'}); if(state.view==='month')renderMonth(visible);else if(state.view==='week')renderWeek(visible);else renderAgenda(visible); renderSummary(visible)}
function chip(e){return `<span class="event-chip" data-category="${esc(e.category)}" data-status="${e.status}" onclick="editEvent('${e.id}')"><strong>${esc(e.title)}</strong><br><small>${esc(e.category==='Other'?e.customCategory:e.category)} · ${e.status}</small></span>`}
function renderMonth(events){const y=state.month.getFullYear(),m=state.month.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=d.toISOString().slice(0,10);cells.push(`<div class="${d.getMonth()!==m?'day-muted':''}"><strong>${d.getDate()}</strong>${events.filter(e=>e.startDate<=iso&&(e.endDate||e.startDate)>=iso).map(chip).join('')}</div>`)}$('#calendarView').innerHTML=`<div class="calendar-grid"><div class="day-label">Sun</div><div class="day-label">Mon</div><div class="day-label">Tue</div><div class="day-label">Wed</div><div class="day-label">Thu</div><div class="day-label">Fri</div><div class="day-label">Sat</div>${cells.join('')}</div>`}
function renderWeek(events){const d=new Date(state.month),start=new Date(d);start.setDate(d.getDate()-d.getDay());const rows=[];for(let i=0;i<7;i++){const day=new Date(start);day.setDate(start.getDate()+i);const iso=day.toISOString().slice(0,10);rows.push(`<div class="calendar-card"><h3>${day.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric',year:'numeric'})}</h3>${events.filter(e=>e.startDate<=iso&&(e.endDate||e.startDate)>=iso).map(chip).join('')||'<p class="muted">No activities scheduled.</p>'}</div>`)}$('#calendarView').innerHTML=rows.join('')}
function renderAgenda(events){$('#calendarView').className='agenda-view';$('#calendarView').innerHTML=events.length?events.map(e=>`<div class="agenda-row"><strong>${esc(e.startDate)}${e.endDate&&e.endDate!==e.startDate?' – '+esc(e.endDate):''}</strong><span><a href="#" onclick="editEvent('${e.id}');return false">${esc(e.title)}</a><br><small>${esc(e.description||'')}</small></span><span>${esc(e.category==='Other'?e.customCategory:e.category)}</span><span class="status status-${e.status}">${e.status}</span></div>`).join(''):'<p class="message">No academic calendar entries have been created for the selected academic year and term.</p>'}
function renderSummary(events){const today=new Date().toISOString().slice(0,10);const upcoming=events.filter(e=>e.status==='PUBLISHED'&&e.startDate>=today).slice(0,8);$('#upcoming').innerHTML=upcoming.length?upcoming.map(e=>`<p><strong>${esc(e.startDate)}</strong> · ${esc(e.title)}<br><small>${esc(e.category)} · ${esc(e.term)} · ${esc(e.audience.join(', '))}</small></p>`).join(''):'<p class="muted">No upcoming published events.</p>';const todayRows=events.filter(e=>e.status==='PUBLISHED'&&e.startDate<=today&&(e.endDate||e.startDate)>=today);$('#todayActivities').innerHTML=todayRows.length?todayRows.map(chip).join(''):'<p class="muted">No academic activities scheduled for today.</p>';const important=['Reopening','Examination','Mid-Term Break','Public Holiday','Closing/Vacation','Results Publication'];const imp=events.filter(e=>e.status==='PUBLISHED'&&important.some(x=>e.category.includes(x))).slice(0,10);$('#important').innerHTML=imp.length?imp.map(e=>`<p><strong>${esc(e.startDate)}</strong> · ${esc(e.category)}<br>${esc(e.title)}</p>`).join(''):'<p class="muted">No important dates configured.</p>'}
function editEvent(id){const e=state.events.find(x=>x.id===id);if(!e)return;state.editing=e;const f=$('#eventForm');for(const [k,v] of Object.entries(e)){const el=f.elements[k];if(!el)continue;if(el.multiple)Array.from(el.options).forEach(o=>o.selected=(v||[]).includes(o.value));else if(el.type==='checkbox')el.checked=Boolean(v);else el.value=v??''}$('#dialogTitle').textContent='Edit Event';$('#eventDialog').showModal()}
$('#add').onclick=()=>{$('#eventForm').reset();$('#eventForm').elements.status.value='DRAFT';$('#eventForm').elements.allDay.checked=true;$('#dialogTitle').textContent='Add Academic Event';state.editing=null;$('#eventDialog').showModal()};$('#eventForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),body=Object.fromEntries(f.entries());body.audience=Array.from(e.target.elements.audience.selectedOptions).map(o=>o.value);body.classScope=Array.from(e.target.elements.classScope.selectedOptions).map(o=>o.value);body.allDay=e.target.elements.allDay.checked;try{const id=state.editing?.id;if(id)await api('/api/academic-calendar/'+id,{method:'PATCH',body:JSON.stringify(body)});else await api('/api/academic-calendar',{method:'POST',body:JSON.stringify(body)});$('#eventDialog').close();await refresh()}catch(err){$('#dialogError').className='message error';$('#dialogError').textContent=err.message}};
$('#publishEvent').onclick=async()=>{if(!state.editing)return;try{await api('/api/academic-calendar/'+state.editing.id+'/publish',{method:'POST'});$('#eventDialog').close();await refresh()}catch(e){$('#dialogError').className='message error';$('#dialogError').textContent=e.message}};$('#cancelEvent').onclick=async()=>{if(!state.editing)return;try{await api('/api/academic-calendar/'+state.editing.id+'/cancel',{method:'POST'});$('#eventDialog').close();await refresh()}catch(e){$('#dialogError').className='message error';$('#dialogError').textContent=e.message}};$('#print').onclick=()=>window.print();$('#prev').onclick=()=>{state.month.setMonth(state.month.getMonth()-1);render()};$('#next').onclick=()=>{state.month.setMonth(state.month.getMonth()+1);render()};$('#today').onclick=()=>{state.month=new Date();render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()});['year','term','category','eventStatus','audience','search','from','to'].forEach(id=>$('#'+id).addEventListener('change',refresh));$('#search').addEventListener('input',refresh);load();
</script></body></html>
