<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Examination Timetable | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">EXAMINATIONS &amp; RESULTS</p><h1>Examination Timetable</h1><p class="muted">Create and publish conflict-checked examination schedules. Proprietors and parents see published entries only.</p><section id="editor" class="card" hidden><form id="timetable-form" class="student-form"><input name="id" type="hidden"><label>Academic Year<input name="academicYearId" placeholder="2026/2027" required></label><label>Term<select name="termId"><option>First Term</option><option>Second Term</option><option>Third Term</option></select></label><label>Class / Level<input name="classId" placeholder="Primary 4" required></label><label>Examination<input name="examination" placeholder="End of Term Examination" required></label><label>Subject<input name="subjectId" required></label><label>Date<input name="date" type="date" required></label><label>Start Time<input name="startTime" type="time" required></label><label>End Time<input name="endTime" type="time" required></label><label>Venue / Room<input name="venue"></label><label>Invigilator<input name="invigilator"></label><div class="button-row"><button class="primary-button" type="submit">Save Draft</button><button class="text-button" type="reset">New Entry</button></div></form></section><p id="status" class="error" role="status"></p><section class="card"><div class="table-scroll"><table><thead><tr><th>Year / Term</th><th>Class</th><th>Examination</th><th>Subject</th><th>Date</th><th>Time</th><th>Venue</th><th>Status</th><th>Action</th></tr></thead><tbody id="timetables"><tr><td colspan="9">Loading…</td></tr></tbody></table></div></section></main><script src="/exam-timetable.js"></script></body></html>
