<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrative Module | OsaaH Daylight</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="form-page">
    <a class="text-button" href="/">← Dashboard</a>
    <p class="eyebrow">ADMINISTRATIVE</p>
    <h1 id="module-title">Administrative Module</h1>
    <p id="module-description" class="muted"></p>
    <section class="card">
      <h2 id="module-action-title">Administrative workspace</h2>
      <p id="module-action" class="muted"></p>
    </section>
  </main>
  <script>
    const key = document.body.dataset.currentModule
      || new URLSearchParams(location.search).get('module')
      || location.pathname.split('/').pop();

    // Older route maps may still resolve this generic shell for School Profile.
    // Always send that legacy entry point to the canonical, data-backed page.
    if (key === 'school-profile') {
      const target = new URL('/settings/profile', location.origin);
      target.search = location.search;
      location.replace(target.href);
    } else {
      const modules = {
        settings: ['School Settings', 'Review the authorized school configuration and operational settings.', 'School configuration is available to authorized school administrators.'],
        users: ['Users & Roles', 'Review authorized user and role management options.', 'Use Administrator Management to assign the active School Administrator.'],
        'academic-calendar': ['Academic Calendar', 'Review the school calendar and scheduled academic activities.', 'Calendar entries are managed through the existing Communication module.']
      };
      const item = modules[key] || ['Administrative Module', 'Open an administrative workspace.', 'Select an administrative item from the sidebar.'];
      document.querySelector('#module-title').textContent = item[0];
      document.querySelector('#module-description').textContent = item[1];
      document.querySelector('#module-action').textContent = item[2];
    }
  </script>
</body>
</html>
