<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial Reports | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/reports.html">← Reports</a><p class="eyebrow">REPORTS &amp; ANALYTICS</p><h1>FINANCIAL REPORTS</h1><form id="filters" class="student-form"><label>Academic Year<input name="academicYear" placeholder="2026/2027"></label><label>Term<select name="term"><option>1st Term</option><option>2nd Term</option><option>3rd Term</option></select></label><label>Report Type<select name="reportType"><option>FINANCIAL_SUMMARY</option><option>INCOME_REPORT</option><option>EXPENSE_REPORT</option><option>INCOME_VS_EXPENSES</option><option>FEE_COLLECTION_REPORT</option><option>OUTSTANDING_FEES_REPORT</option></select></label><label>Start Date<input name="dateFrom" type="date"></label><label>End Date<input name="dateTo" type="date"></label><button class="primary-button" type="submit">Generate Report</button></form><section id="output" class="card"><p class="muted">Generate a report to preview financial metrics.</p></section><script>document.querySelector('#filters').addEventListener('submit',async(e)=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const qs=new URLSearchParams(data);const r=await fetch(`/api/reports/financial?${qs}`);const j=await r.json();document.querySelector('#output').innerHTML=r.ok?`<h2>${j.title}</h2><p>${j.academicYear||''} ${j.term||''}</p><div class=\"ops-grid\"><article class=\"card\"><strong>${j.summary.totalIncome.toLocaleString('en-GH',{style:'currency',currency:'GHS'})}</strong><span>Total income</span></article><article class=\"card\"><strong>${j.summary.totalExpenses.toLocaleString('en-GH',{style:'currency',currency:'GHS'})}</strong><span>Total expenses</span></article><article class=\"card\"><strong>${j.summary.netSurplusDeficit.toLocaleString('en-GH',{style:'currency',currency:'GHS'})}</strong><span>Net surplus / deficit</span></article><article class=\"card\"><strong>${j.summary.collectionRate}%</strong><span>Collection rate</span></article></div><div class=\"table-scroll\"><table><thead><tr><th>Category</th><th>Total</th></tr></thead><tbody>${(j.incomeByCategory||[]).map((row)=>`<tr><td>${row.category}</td><td>${row.total.toLocaleString('en-GH',{style:'currency',currency:'GHS'})}</td></tr>`).join('')}</tbody></table></div>`:`<p class=\"error\">${j.error||'Unable to load report.'}</p>`;});</script></main></body></html>\n*** End Patch
