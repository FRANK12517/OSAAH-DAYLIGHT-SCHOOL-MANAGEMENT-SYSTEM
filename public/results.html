<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Results | Osaah Daylight</title><link rel="stylesheet" href="/styles.css">
<style>
.result-slip-page{max-width:960px;margin:1rem auto;padding:0 .75rem}.result-slip{position:relative;box-sizing:border-box;width:100%;height:auto;min-height:0;background:#fff;border:2px solid #102a43;padding:1.35rem;overflow:visible;box-shadow:0 4px 18px #102a4318;color:#000}.result-slip::after{content:"";position:absolute;inset:5px;border:2px solid #d4a72c;pointer-events:none}.result-slip::before{content:"";position:absolute;inset:18%;background:url('/assets/osaah-daylight-logo.png') center/contain no-repeat;opacity:.055;pointer-events:none}.result-slip>*{position:relative;z-index:1}.slip-header{text-align:center;border-bottom:2px solid #102a43;padding-bottom:.9rem}.slip-logo{display:block;width:min(100%,420px);height:auto;max-height:110px;margin:0 auto;object-fit:contain}.slip-header h2{margin:.45rem 0;font-size:1.45rem;color:#000}.slip-header p{margin:.25rem 0;color:#000}.slip-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:1rem 0}.slip-meta div{border:1px solid #6b7280;padding:.45rem;color:#000}.slip-meta b{display:block;font-size:.68rem;text-transform:uppercase;color:#000}.slip-table{width:100%;border-collapse:collapse;font-size:.78rem;color:#000}.slip-table th,.slip-table td{border:1px solid #4b5563;padding:.42rem;text-align:left;color:#000}.slip-table th{background:#edf2f7;color:#000}.slip-summary,.slip-assessment,.slip-attendance{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:1rem 0;color:#000}.slip-summary div,.slip-attendance div{border:1px solid #6b7280;padding:.55rem;color:#000}.slip-summary b,.slip-attendance b{display:block;font-size:.68rem;text-transform:uppercase;color:#000}.slip-section-title{margin:1rem 0 .4rem;border-bottom:1px solid #102a43;color:#000;font-size:.95rem}.assessment-card{border:1px solid #6b7280;padding:.55rem;color:#000}.assessment-card label{display:block;font-weight:700;font-size:.78rem;margin-bottom:.25rem;color:#000}.assessment-card select{width:100%;padding:.4rem}.assessment-card .static-value{min-height:2rem;padding:.35rem;background:#f7f9fc;color:#000}.signature-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.25rem;break-inside:avoid;page-break-inside:avoid}.signature-box{text-align:center;border-top:1px solid #102a43;padding-top:.4rem;min-height:100px;color:#000;break-inside:avoid;page-break-inside:avoid}.signature-box img{display:block;max-width:180px;max-height:58px;margin:.4rem auto;object-fit:contain}.signature-name{margin:.25rem 0;color:#000}.signature-missing{margin:.8rem 0;color:#000;font-style:italic}.no-print{margin-bottom:1rem}@media(max-width:600px){.slip-meta,.slip-summary,.slip-assessment,.slip-attendance,.signature-grid{grid-template-columns:1fr}.result-slip{padding:.8rem}.slip-table{font-size:.68rem}.slip-table th,.slip-table td{padding:.3rem}}@media print{body{background:#fff;color:#000}.result-slip-page{margin:0;padding:0;max-width:none}.result-slip{box-shadow:none;break-inside:avoid;min-height:0;border-color:#102a43;color:#000}.result-slip::after{border-color:#d4a72c}.slip-header,.slip-header h2,.slip-header p,.slip-meta,.slip-meta div,.slip-meta b,.slip-table,.slip-table th,.slip-table td,.slip-summary,.slip-summary div,.slip-summary b,.slip-assessment,.assessment-card,.assessment-card label,.assessment-card .static-value,.slip-attendance,.slip-attendance div,.slip-attendance b,.slip-section-title,.signature-box,.signature-name,.signature-missing{color:#000!important}.no-print{display:none!important}@page{size:A4 portrait;margin:10mm}}
</style>
</head>
<body><main class="form-page result-slip-page"><a class="text-button no-print" href="/">← Dashboard</a><p class="eyebrow no-print">EXAMINATIONS &amp; RESULTS</p><h1 class="no-print">Student Result Slip</h1><section class="card no-print"><form id="result-context"><label>Academic Year<input name="academicYear" value="2026/2027" list="result-academic-years" required><datalist id="result-academic-years"></datalist></label><label>Term<select name="term"><option>First Term</option><option>Second Term</option><option>Third Term</option></select></label><label>Class<select name="classId" required disabled><option value="">Loading classes…</option></select></label><label>Student<select name="studentId" required disabled><option value="">Choose a class first</option></select></label><label style="display:flex;align-items:center;gap:.4rem"><input name="sampleMode" type="checkbox" value="true"> Sample Result / Test Mode</label><button class="primary-button" type="submit" disabled>Generate Result</button><button id="retry-options" class="text-button" type="button" hidden>Retry academic options</button></form><p id="status" class="error" role="status"></p></section><article id="result" class="result-header" hidden></article></main><script src="/ges-assessment-libraries.js"></script><script src="/result-pdf.js"></script><script src="/result-view.js"></script></body></html>
