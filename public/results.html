<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Results | Osaah Daylight</title><link rel="stylesheet" href="/styles.css">
<style>
.result-slip-page{max-width:960px;margin:1rem auto;padding:0 .75rem}.result-slip{position:relative;background:#fff;border:4px double #172b4d;padding:1.25rem;overflow:hidden;box-shadow:0 4px 18px #172b4d18}.result-slip::before{content:"";position:absolute;inset:18%;background:url('/assets/osaah-logo.png') center/contain no-repeat;opacity:.055;pointer-events:none}.result-slip>*{position:relative}.slip-header{text-align:center;border-bottom:2px solid #172b4d;padding-bottom:.75rem}.slip-logo{max-height:72px;max-width:180px;object-fit:contain}.slip-header h2{margin:.35rem 0;font-size:1.35rem;color:#172b4d}.slip-header p{margin:.2rem 0;color:#53657e}.slip-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:1rem 0}.slip-meta div{border:1px solid #c7d1df;padding:.45rem}.slip-meta b{display:block;font-size:.68rem;text-transform:uppercase;color:#65758b}.slip-table{width:100%;border-collapse:collapse;font-size:.78rem}.slip-table th,.slip-table td{border:1px solid #9aa9bc;padding:.42rem;text-align:left}.slip-table th{background:#edf2f7;color:#172b4d}.slip-summary,.slip-assessment,.slip-attendance{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:1rem 0}.slip-summary div,.slip-attendance div{border:1px solid #c7d1df;padding:.55rem}.slip-summary b,.slip-attendance b{display:block;font-size:.68rem;text-transform:uppercase;color:#65758b}.slip-section-title{margin:1rem 0 .4rem;border-bottom:1px solid #172b4d;color:#172b4d;font-size:.95rem}.assessment-card{border:1px solid #c7d1df;padding:.55rem}.assessment-card label{display:block;font-weight:700;font-size:.78rem;margin-bottom:.25rem}.assessment-card select{width:100%;padding:.4rem}.assessment-card .static-value{min-height:2rem;padding:.35rem;background:#f7f9fc}.signature-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.25rem}.signature-box{text-align:center;border-top:1px solid #172b4d;padding-top:.4rem;min-height:100px}.signature-box img{display:block;max-width:180px;max-height:58px;margin:.4rem auto;object-fit:contain}.no-print{margin-bottom:1rem}@media(max-width:600px){.slip-meta,.slip-summary,.slip-assessment,.slip-attendance,.signature-grid{grid-template-columns:1fr}.result-slip{padding:.7rem}.slip-table{font-size:.68rem}.slip-table th,.slip-table td{padding:.3rem}}@media print{body{background:#fff}.result-slip-page{margin:0;padding:0}.result-slip{box-shadow:none;min-height:0}.no-print{display:none!important}@page{size:A4;margin:10mm}}
</style>
</head>
<body><main class="form-page result-slip-page"><a class="text-button no-print" href="/">← Dashboard</a><p class="eyebrow no-print">EXAMINATIONS &amp; RESULTS</p><h1 class="no-print">Student Result Slip</h1><section class="card no-print"><form id="result-context"><label>Academic Year<input name="academicYear" value="2026/2027" required></label><label>Term<select name="term"><option>First Term</option><option>Second Term</option><option>Third Term</option></select></label><label>Class<select name="classId"></select></label><label>Student<select name="studentId"></select></label><button class="primary-button" type="submit">Generate Result</button></form><p id="status" class="error" role="status"></p></section><article id="result" class="result-slip result-header" hidden></article></main><script src="/result-view.js"></script></body></html>
