<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Result Signatures | Osaah Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">ADMINISTRATIVE</p><h1>Result Signatures</h1><p class="muted">Upload a signature reference for an authorized result signatory. The active signature is attached dynamically to generated slips.</p><section class="card"><form id="signature-form"><label>Signatory role<select name="signatoryRole"><option>HEADTEACHER</option><option>CLASS_TEACHER</option></select></label><label>MIME type<select name="mimeType"><option>image/png</option><option>image/jpeg</option><option>image/svg+xml</option></select></label><label>File size in bytes<input name="size" type="number" min="0" required></label><label>Secure storage reference<input name="storageKey" required></label><button class="primary-button">Save Signature</button><p id="status" class="error" role="status"></p></form></section><section class="card"><h2>Configured signatures</h2><div class="table-scroll"><table><thead><tr><th>Role</th><th>Type</th><th>Storage Reference</th><th>Active</th></tr></thead><tbody id="signatures"><tr><td colspan="4">Loading…</td></tr></tbody></table></div></section></main><script>const form=document.querySelector('#signature-form'),host=document.querySelector('#signatures'),status=document.querySelector('#status');const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(u,o){const r=await fetch(u,o),b=await r.json().catch(()=>({error:'Request failed.'}));if(!r.ok)throw Error(b.error||'Request failed.');return b;}async function load(){const b=await api('/api/result-signatures');host.innerHTML=b.signatures.map(s=>`<tr><td>${esc(s.signatoryRole)}</td><td>${esc(s.mimeType)}</td><td>${esc(s.storageKey)}</td><td>${s.active?'ACTIVE':'INACTIVE'}</td></tr>`).join('')||'<tr><td colspan="4">No signatures configured.</td></tr>';}form.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/result-signatures',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});await load();form.reset();}catch(e){status.textContent=e.message;}});load().catch(e=>status.textContent=e.message);</script></body></html>
