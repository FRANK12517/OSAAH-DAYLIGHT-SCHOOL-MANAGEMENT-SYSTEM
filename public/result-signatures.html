<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Result Signatures | Osaah Daylight</title><link rel="stylesheet" href="/styles.css">
  <style>
    .signature-form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end}
    .signature-preview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
    .signature-preview figure{margin:0;padding:12px;border:1px solid #d5dfeb;border-radius:8px;background:#f8fafc}
    .signature-preview img{display:block;width:100%;height:120px;object-fit:contain;background:repeating-conic-gradient(#fff 0% 25%,#edf2f7 0% 50%) 50%/16px 16px}
    .signature-thumb{max-width:140px;max-height:54px;object-fit:contain}
    @media(max-width:600px){.signature-preview{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="form-page"><p class="eyebrow">ADMINISTRATIVE</p><h1>Result Signatures</h1>
  <p class="muted">Upload a handwritten signature photo or scan. The paper background is removed and the processed signature appears on official result slips.</p>
  <section class="card"><form id="signature-form">
    <div class="signature-form-grid">
      <label>Signatory role<select name="signatoryRole"><option value="HEADTEACHER">Headteacher Signature (school-wide)</option><option value="CLASS_TEACHER">Class Teacher Signature</option></select></label>
      <div id="mapping-fields" class="signature-form-grid" hidden>
        <label>Academic Year<input name="academicYear" value="2026/2027"></label>
        <label>Term<select name="term"><option>First Term</option><option>Second Term</option><option>Third Term</option></select></label>
        <label>Class<select name="classId"></select></label>
        <label>Class Teacher<select name="teacherId"></select></label>
      </div>
      <label>Full Name<input name="fullName" autocomplete="name" required></label>
      <label>Phone Number<input name="phone" type="tel" autocomplete="tel" placeholder="024 123 4567" required></label>
      <label>Upload Signature<input name="signatureFile" type="file" accept="image/*,.heic,.heif,.bmp,.webp" required></label>
    </div>
    <div id="preview" class="signature-preview" hidden>
      <figure><figcaption>Original image</figcaption><img id="before-preview" alt="Original signature preview"></figure>
      <figure><figcaption>Processed transparent signature</figcaption><img id="after-preview" alt="Processed signature preview"></figure>
    </div>
    <button class="primary-button" type="submit">SAVE SIGNATURE PROFILE</button>
    <p id="status" class="error" role="status" aria-live="polite"></p>
  </form></section>
  <section class="card"><h2>Configured signatures</h2><div class="table-scroll"><table><thead><tr><th>Role</th><th>Name</th><th>Phone</th><th>Scope</th><th>Signature</th><th>Active</th></tr></thead><tbody id="signatures"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section>
</main><script type="module" src="/result-signatures.js"></script></body></html>
