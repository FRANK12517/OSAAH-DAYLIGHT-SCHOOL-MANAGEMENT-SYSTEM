<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Result Signatures | Osaah Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">ADMINISTRATIVE</p><h1>Result Signatures</h1><p class="muted">Configure class-teacher signatures for one class and academic context, or maintain the school-wide headteacher signature.</p><section class="card"><form id="signature-form"><label>Signatory role<select name="signatoryRole"><option value="HEADTEACHER">Headteacher Signature (school-wide)</option><option value="CLASS_TEACHER">Class Teacher Signature</option></select></label><div id="mapping-fields" hidden><label>Academic Year<input name="academicYear" value="2026/2027"></label><label>Term<select name="term"><option>First Term</option><option>Second Term</option><option>Third Term</option></select></label><label>Class<select name="classId" required></select></label><label>Class Teacher<select name="teacherId" required></select></label></div><label>MIME type<select name="mimeType"><option>image/png</option><option>image/jpeg</option><option>image/svg+xml</option></select></label><label>File size in bytes<input name="size" type="number" min="0" required></label><label>Secure storage reference<input name="storageKey" required></label><button class="primary-button">Save/Update Signature</button><p id="status" class="error" role="status"></p></form></section><section class="card"><h2>Configured signatures</h2><div class="table-scroll"><table><thead><tr><th>Role</th><th>Scope</th><th>Teacher</th><th>Type</th><th>Storage Reference</th><th>Active</th></tr></thead><tbody id="signatures"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section></main><script>const form=document.querySelector('#signature-form'),mapping=document.querySelector('#mapping-fields'),host=document.querySelector('#signatures'),status=document.querySelector('#status'),role=form.elements.signatoryRole,classField=form.elements.classId,teacherField=form.elements.teacherId;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let options={classes:[],teachers:[]};async function api(u,o){const r=await fetch(u,o),b=await r.json().catch(()=>({error:'Request failed.'}));if(!r.ok)throw Error(b.error||'Request failed.');return b;}function syncRole(){const mapped=role.value==='CLASS_TEACHER';mapping.hidden=!mapped;form.elements.academicYear.required=mapped;form.elements.term.required=mapped;classField.required=mapped;teacherField.required=mapped;}function fillOptions(){classField.innerHTML=options.classes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');teacherField.innerHTML=options.teachers.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');}async function load(){const b=await api('/api/result-signatures');options=b.options||options;fillOptions();syncRole();host.innerHTML=b.signatures.map(s=>`<tr><td>${esc(s.signatoryRole.replaceAll('_',' '))}</td><td>${esc(s.classId?`${s.classId} · ${s.academicYear||''} · ${s.term||''}`:'School-wide')}</td><td>${esc(s.teacherId||'—')}</td><td>${esc(s.mimeType)}</td><td>${esc(s.storageKey)}</td><td>${s.active?'ACTIVE':'INACTIVE'}</td></tr>`).join('')||'<tr><td colspan="6">No signatures configured.</td></tr>';}role.addEventListener('change',syncRole);form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='';try{await api('/api/result-signatures',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});await load();status.textContent='Signature saved.';}catch(e){status.textContent=e.message;}});load().catch(e=>status.textContent=e.message);</script></body></html>
