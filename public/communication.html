<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Announcements | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">COMMUNICATION HUB</p><h1>Announcements</h1><p id="status" class="muted" role="status" aria-live="polite">Loading…</p><section id="creator" class="card" hidden><h2>Create Announcement</h2><form id="announcement-form"><label>Title<input name="title" required maxlength="160"></label><label>Message<textarea name="message" required rows="6" maxlength="5000"></textarea></label><label>Recipient Category<select name="recipientCategory" id="recipient-category" required><option value="ALL_TEACHERS">All Teachers</option><option value="INDIVIDUAL_TEACHER">Individual Teacher</option><option value="SELECTED_TEACHERS">Selected Teachers</option><option value="ALL_STAFF">All Staff</option><option value="INDIVIDUAL_STAFF">Individual Staff</option><option value="SELECTED_STAFF">Selected Staff</option><option value="ALL_PARENTS">All Parents</option><option value="INDIVIDUAL_PARENT">Individual Parent</option><option value="SELECTED_PARENTS">Selected Parents</option></select></label><label id="recipient-label" hidden>Recipients<select name="recipientIds" id="recipients" multiple size="5"></select></label><label>Priority<select name="priority"><option>NORMAL</option><option>HIGH</option><option>URGENT</option></select></label><div class="site-actions"><button class="secondary-button" type="button" id="save-draft">Save Draft</button><button class="secondary-button" type="button" id="preview">Preview</button><button class="primary-button" type="submit">Publish Now</button><button class="secondary-button" type="button" id="schedule">Schedule Publication</button><button class="text-button" type="button" id="cancel">Cancel</button></div></form><p id="preview-output" class="muted" hidden></p></section><section><h2>My Announcements</h2><div id="announcements" class="report-grid">Loading…</div></section></main><script src="/communication-announcements.js"></script></body></html>
