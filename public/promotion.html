<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promotion | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">EXAMINATIONS &amp; RESULTS</p><h1>Promotion</h1><p class="muted">Record an authorized promotion decision for an enrolled student and academic context. Opening a selector never promotes a student.</p><form id="promotion-form" class="student-form"><fieldset><legend>Promotion decision</legend><label>Academic Year<input id="promotion-year" required value="2026/2027"></label><label>Class<select id="promotion-class" required><option value="">Choose class</option></select></label><label>Term<select id="promotion-term" required><option value="">Choose term</option><option value="First Term">First Term</option><option value="Second Term">Second Term</option><option value="Third Term">Third Term</option></select></label><label>Student<select id="promotion-student" required><option value="">Choose academic year, class, and term first</option></select></label><label>Decision<select id="promotion-decision" required><option value="PROMOTED">Promoted</option><option value="REPEAT">Repeat</option><option value="HOLD">Hold</option><option value="TRANSFER">Transfer</option><option value="GRADUATED">Graduated</option></select></label><label>Comment<textarea id="promotion-comment" maxlength="500" placeholder="Optional decision note"></textarea></label><button class="primary-button" type="submit">Save Promotion Decision</button></fieldset></form><p id="promotion-status" class="muted" role="status" aria-live="polite"></p></main><script>const form=document.querySelector('#promotion-form'),year=document.querySelector('#promotion-year'),classField=document.querySelector('#promotion-class'),term=document.querySelector('#promotion-term'),student=document.querySelector('#promotion-student'),status=document.querySelector('#promotion-status'),esc=(value)=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(url,init){const r=await fetch(url,init),data=await r.json().catch(()=>({error:'Request failed.'}));if(!r.ok)throw Error(data.error||'Request failed.');return data;}async function loadClasses(){const data=await api(`/api/examinations/promotion/options?academicYearId=${encodeURIComponent(year.value)}&termId=First%20Term&classId=`);classField.innerHTML='<option value="">Choose class</option>'+data.classes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');}async function loadStudents(){student.innerHTML='<option value="">Loading eligible students…</option>';if(!year.value||!classField.value||!term.value){student.innerHTML='<option value="">Choose academic year, class, and term first</option>';return;}const data=await api(`/api/examinations/promotion/options?academicYearId=${encodeURIComponent(year.value)}&classId=${encodeURIComponent(classField.value)}&termId=${encodeURIComponent(term.value)}`);student.innerHTML='<option value="">Choose student</option>'+data.students.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} — ${esc(s.permanentStudentId)}</option>`).join('')||'<option value="">No eligible enrolled students</option>';}year.addEventListener('change',loadStudents);classField.addEventListener('change',loadStudents);term.addEventListener('change',loadStudents);form.addEventListener('submit',async(e)=>{e.preventDefault();status.textContent='';try{if(!student.value||!year.value||!classField.value||!term.value)throw Error('Academic year, class, term, and student are required.');const r=await api('/api/examinations/promotion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({studentId:student.value,academicYearId:year.value,classId:classField.value,termId:term.value,decision:document.querySelector('#promotion-decision').value,comment:document.querySelector('#promotion-comment').value})});status.className='success';status.textContent=`Promotion decision saved for ${r.studentId}.`;await loadStudents();}catch(e){status.className='error';status.textContent=e.message;}});loadClasses().catch(e=>status.textContent=e.message);</script></body></html>
