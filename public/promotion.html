<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promotion | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">EXAMINATIONS &amp; RESULTS</p><h1>Promotion</h1><p class="muted">Record an authorized student promotion decision. This is separate from generating a result slip.</p><form id="promotion-form" class="student-form"><fieldset><legend>Promotion decision</legend><label>Academic year<input id="promotion-year" required value="2026/2027"></label><label>Student<select id="promotion-student" required><option value="">Loading students…</option></select></label><label>Decision<select id="promotion-decision" required><option value="PROMOTED">Promoted</option><option value="REPEAT">Repeat</option><option value="HOLD">Hold</option><option value="TRANSFER">Transfer</option><option value="GRADUATED">Graduated</option></select></label><label>Comment<textarea id="promotion-comment" maxlength="500" placeholder="Optional decision note"></textarea></label><button class="primary-button" type="submit">Save Promotion Decision</button></fieldset></form><p id="promotion-status" class="muted" role="status"></p></main><script>const form=document.querySelector('#promotion-form'),student=document.querySelector('#promotion-student'),status=document.querySelector('#promotion-status');const esc=(value)=>{const e=document.createElement('span');e.textContent=value;return e.innerHTML};async function load(){const r=await fetch('/api/academic/options'),data=await r.json();if(!r.ok){status.textContent=data.error??'Students could not be loaded.';return}student.innerHTML='<option value="">Choose a student</option>'+data.students.map(s=>`<option value="${esc(s.id)}">${esc(s.indexNumber)} — ${esc(s.name)} (${esc(s.classId)})${s.isTestRecord?' [SAMPLE]':''}</option>`).join('')}load();form.addEventListener('submit',async(e)=>{e.preventDefault();const r=await fetch('/api/examinations/promotion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({studentId:student.value,academicYearId:document.querySelector('#promotion-year').value,decision:document.querySelector('#promotion-decision').value,comment:document.querySelector('#promotion-comment').value})}),data=await r.json();status.textContent=r.ok?'Promotion decision saved.':data.error??'Promotion decision could not be saved.'})</script></body></html>
