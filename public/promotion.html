<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Promotion | OsaaH Daylight</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="form-page">
    <a class="text-button" href="/">← Dashboard</a>
    <p class="eyebrow">EXAMINATIONS &amp; RESULTS</p>
    <h1>Promotion</h1>
    <p class="muted">Select eligible students for an academic context. No promotion is recorded until you choose “Save Promotion Decision”.</p>
    <form id="promotion-form" class="student-form">
      <fieldset>
        <legend>Promotion decision</legend>
        <label for="promotion-year">Academic Year</label>
        <select id="promotion-year" required><option value="">Loading academic years…</option></select>
        <label for="promotion-class">Class</label>
        <select id="promotion-class" required><option value="">Choose class</option></select>
        <label for="promotion-term">Term</label>
        <select id="promotion-term" required><option value="">Choose term</option></select>
        <fieldset class="promotion-student-fieldset">
          <legend>Students</legend>
          <details id="promotion-student-picker">
            <summary id="promotion-student-summary">Choose academic year, class, and term first</summary>
            <div id="promotion-student-list" class="promotion-student-list">
              <label><input id="promotion-select-all" type="checkbox" disabled> Select All</label>
              <button id="promotion-clear" type="button" class="text-button" disabled>Clear selection</button>
              <div id="promotion-student-options" aria-live="polite"></div>
            </div>
          </details>
        </fieldset>
        <label for="promotion-decision">Decision</label>
        <select id="promotion-decision" required>
          <option value="PROMOTED">Promoted</option>
          <option value="REPEAT">Repeat</option>
          <option value="HOLD">Hold</option>
          <option value="TRANSFER">Transfer</option>
          <option value="GRADUATED">Completed / Archived (JHS 3)</option>
        </select>
        <label for="promotion-comment">Comment</label>
        <textarea id="promotion-comment" maxlength="500" placeholder="Optional decision note"></textarea>
        <button id="promotion-save" class="primary-button" type="submit" disabled>Save Promotion Decision</button>
      </fieldset>
    </form>
    <p id="promotion-status" class="muted" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="/promotion.js"></script>
</body>
</html>
