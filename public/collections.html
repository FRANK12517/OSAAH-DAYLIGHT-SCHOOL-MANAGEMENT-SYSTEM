<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collections | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">FEE HUB</p><h1 id="heading">Collections</h1><p id="status" class="muted">Loading…</p><form id="entry" class="card"><label>Date<input name="collectionDate" type="date" required></label><label>Academic year<select name="academicYearId" id="academicYearId"><option value="">All academic years</option></select></label><label>Term<select name="termId" id="termId"><option value="">All terms</option></select></label><label>Class<select name="classId" id="classId"><option value="">All classes</option></select></label><label>Amount received (GH₵)<input name="amount" inputmode="decimal" required></label><button>Save collection</button></form><section id="records" class="report-grid"></section></main><script>
const type=new URLSearchParams(location.search).get('type')==='CANTEEN'?'CANTEEN':'EXTRA_CLASS';heading.textContent=type==='CANTEEN'?'Canteen Collections':'Extra Classes Collections';const status=document.querySelector('#status'),academicYear=document.querySelector('#academicYearId'),term=document.querySelector('#termId'),classSelect=document.querySelector('#classId');const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const minor=v=>{const m=String(v).trim().match(/^\d+(?:\.\d{1,2})?$/);if(!m)throw Error('Enter a valid amount');const [a,b='']=m[0].split('.');return Number(a)*100+Number((b+'00').slice(0,2))};const fill=(select,items,placeholder)=>{select.innerHTML='<option value="">'+placeholder+'</option>'+items.map(item=>'<option value="'+esc(item.id)+'">'+esc(item.name)+'</option>').join('')};
async function loadOptions(){const r=await fetch('/api/fee-setup/options',{credentials:'same-origin',cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load collection options');fill(academicYear,j.academicYears||[],'All academic years');fill(term,j.terms||[],'All terms');fill(classSelect,j.classes||[],'All classes')}
async function load(){const q=new URLSearchParams({collectionType:type});if(academicYear.value)q.set('academicYearId',academicYear.value);if(term.value)q.set('termId',term.value);if(classSelect.value)q.set('classId',classSelect.value);const r=await fetch('/api/fees/collections?'+q,{credentials:'same-origin',cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load');records.innerHTML=(j||[]).filter(x=>x.collection_type===type).map(x=>'<article class="card">'+esc(x.collection_date)+' · '+esc(x.amount_received_minor)+' · '+esc(x.class_id||'All classes')+'</article>').join('')||'<p>No collections recorded.</p>';status.textContent='Ready'}
entry.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const r=await fetch('/api/fees/collections',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({collectionType:type,collectionDate:f.get('collectionDate'),academicYearId:f.get('academicYearId')||null,termId:f.get('termId')||null,classId:f.get('classId')||null,amountReceivedMinor:minor(f.get('amount'))})});const j=await r.json();if(!r.ok)throw Error(j.error||'Save failed');status.textContent='Saved';await load()}catch(e){status.textContent=e.message}});[academicYear,term,classSelect].forEach(select=>select.addEventListener('change',()=>load().catch(e=>status.textContent=e.message)));Promise.all([loadOptions(),load()]).catch(e=>status.textContent=e.message);
</script></body></html>
