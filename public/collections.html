<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collections | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">FEE HUB</p><h1 id="heading">Collections</h1><p id="status" class="muted">Loading…</p><form id="entry" class="card"><label>Date<input name="collectionDate" type="date" required></label><label>Academic year<input name="academicYearId"></label><label>Term<input name="termId"></label><label>Class ID<input name="classId"></label><label>Amount received (GH₵)<input name="amount" inputmode="decimal" required></label><button>Save collection</button></form><section id="records" class="report-grid"></section></main><script>
const type=new URLSearchParams(location.search).get('type')==='CANTEEN'?'CANTEEN':'EXTRA_CLASS';heading.textContent=type==='CANTEEN'?'Canteen Collections':'Extra Classes Collections';const status=document.querySelector('#status');const minor=v=>{const m=String(v).trim().match(/^\d+(?:\.\d{1,2})?$/);if(!m)throw Error('Enter a valid amount');const [a,b='']=m[0].split('.');return Number(a)*100+Number((b+'00').slice(0,2))};async function load(){const r=await fetch('/api/fees/collections');const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load');records.innerHTML=(j||[]).filter(x=>x.collection_type===type).map(x=>`<article class="card">${x.collection_date} · ${x.amount_received_minor} · ${x.class_id||'All classes'}</article>`).join('')||'<p>No collections recorded.</p>';status.textContent='Ready'}entry.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const r=await fetch('/api/fees/collections',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collectionType:type,collectionDate:f.get('collectionDate'),academicYearId:f.get('academicYearId')||null,termId:f.get('termId')||null,classId:f.get('classId')||null,amountReceivedMinor:minor(f.get('amount'))})});const j=await r.json();if(!r.ok)throw Error(j.error||'Save failed');status.textContent='Saved';await load()}catch(e){status.textContent=e.message}});load().catch(e=>status.textContent=e.message);
</script></body></html>
