<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collections | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">FEE HUB</p><h1 id="heading">Collections</h1><p id="status" class="muted">Loading…</p>
<form id="entry" class="card"><label>Date<input name="collectionDate" type="date" required></label><label>Academic year<select name="academicYearId" id="academicYearId"><option value="">All academic years</option></select></label><label>Select Term<select name="collectionPeriod" id="termId" required></select></label><label>Class<select name="classId" id="classId"><option value="">All classes</option></select></label><label>Amount received (GH₵)<input name="amount" inputmode="decimal" required></label><button>Save collection</button></form>
<section id="records" class="report-grid"></section></main>
<script>
const type = new URLSearchParams(location.search).get('type') === 'CANTEEN' ? 'CANTEEN' : 'EXTRA_CLASS';
const periods = type === 'CANTEEN' ? ['1st Term', '2nd Term', '3rd Term'] : ['1st Term', '2nd Term', '3rd Term', 'Vacation Classes'];
const heading = document.querySelector('#heading'), status = document.querySelector('#status'), academicYear = document.querySelector('#academicYearId'), term = document.querySelector('#termId'), classSelect = document.querySelector('#classId'), form = document.querySelector('#entry'), records = document.querySelector('#records');
heading.textContent = type === 'CANTEEN' ? 'Canteen Collections' : 'Extra Classes Collections';
const esc = value => String(value ?? '').replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
const minor = value => { const match = String(value).trim().match(/^\d+(?:\.\d{1,2})?$/); if (!match) throw Error('Enter a valid amount'); const [whole, decimal = ''] = match[0].split('.'); return Number(whole) * 100 + Number((decimal + '00').slice(0, 2)); };
const fill = (select, items, placeholder) => { select.innerHTML = '<option value="">' + placeholder + '</option>' + items.map(item => '<option value="' + esc(item.id) + '">' + esc(item.name) + '</option>').join(''); };
term.innerHTML = '<option value="">Choose a term</option>' + periods.map(period => '<option value="' + esc(period) + '">' + esc(period) + '</option>').join('');
async function loadOptions() { const response = await fetch('/api/fee-setup/options', { credentials: 'same-origin', cache: 'no-store' }); const result = await response.json(); if (!response.ok) throw Error(result.error || 'Unable to load collection options'); fill(academicYear, result.academicYears || [], 'All academic years'); fill(classSelect, result.classes || [], 'All classes'); }
async function load() { const query = new URLSearchParams({ collectionType: type }); if (academicYear.value) query.set('academicYearId', academicYear.value); if (term.value) query.set('collectionPeriod', term.value); if (classSelect.value) query.set('classId', classSelect.value); const response = await fetch('/api/fees/collections?' + query, { credentials: 'same-origin', cache: 'no-store' }); const result = await response.json(); if (!response.ok) throw Error(result.error || 'Unable to load collections'); records.innerHTML = (result || []).filter(row => row.collection_type === type).map(row => '<article class="card"><strong>' + esc(row.collection_period || row.term_id || 'Unspecified') + '</strong><br>' + esc(row.collection_date) + ' · ' + esc(row.amount_received_minor) + ' · ' + esc(row.class_id || 'All classes') + '</article>').join('') || '<p>No collections recorded.</p>'; status.textContent = 'Ready'; }
form.addEventListener('submit', async event => { event.preventDefault(); const data = new FormData(event.currentTarget); try { const response = await fetch('/api/fees/collections', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ collectionType: type, collectionDate: data.get('collectionDate'), academicYearId: data.get('academicYearId') || null, termId: data.get('collectionPeriod'), collectionPeriod: data.get('collectionPeriod'), classId: data.get('classId') || null, amountReceivedMinor: minor(data.get('amount')) }) }); const result = await response.json(); if (!response.ok) throw Error(result.error || 'Save failed'); status.textContent = 'Saved'; await load(); } catch (error) { status.textContent = error.message; } });
[academicYear, term, classSelect].forEach(select => select.addEventListener('change', () => load().catch(error => { status.textContent = error.message; }))); Promise.all([loadOptions(), load()]).catch(error => { status.textContent = error.message; });
</script></body></html>
