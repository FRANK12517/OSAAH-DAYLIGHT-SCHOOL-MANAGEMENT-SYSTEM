<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><link rel="manifest" href="/manifest.webmanifest"><title>OsaaH Daylight School</title><link rel="stylesheet" href="/styles.css"></head><body><main class="login-page"><div class="login-brand"><div class="logo-frame"><img src="/assets/osaah-daylight-logo.png" alt="OsaaH Daylight School logo"></div><p class="eyebrow">OSAAH DAYLIGHT SCH. COM.</p><h1>Welcome to the school office</h1><p class="muted">BOGOSO · AIM HIGH, ACADEMIC IS OUR CORE VALUE</p></div><section class="portal-grid" aria-label="Choose a portal"><button class="portal-card" data-portal="parent"><span class="portal-icon">⌂</span><span><strong>PARENT PORTAL</strong><small>Stay connected to your children</small></span><span>→</span></button><button class="portal-card" data-portal="school"><span class="portal-icon">▣</span><span><strong>SCHOOL PORTAL</strong><small>For all authorized school employees</small></span><span>→</span></button></section><form id="login-form" class="login-form" hidden><p class="eyebrow" id="portal-label"></p><label>Email or username<input name="username" type="text" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">Sign in securely</button><p id="login-error" class="error" role="alert"></p><button id="back-button" class="text-button" type="button">Choose another portal</button></form><p id="connection-status" class="connection-status" role="status">Checking connection…</p><section id="dashboard" hidden></section></main><script src="/app.js"></script></body></html>
