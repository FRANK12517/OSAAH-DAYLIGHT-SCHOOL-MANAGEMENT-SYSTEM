<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admission Prospectus | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Parent Dashboard</a><p class="eyebrow">PARENT PORTAL</p><h1>Admission Prospectus</h1><p class="muted">Choose a class and academic year to read the latest published prospectus.</p><section class="card"><form id="lookup"><label>Class<select name="classId" required></select></label><label>Academic Year<select name="academicYearId" required></select></label><button class="primary-button" type="submit">Read Prospectus</button><p id="status" class="error" role="status"></p></form></section><article id="result" class="card" hidden></article></main><script>
const lookup=document.querySelector('#lookup'),status=document.querySelector('#status'),result=document.querySelector('#result');const esc=(v)=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(url){const r=await fetch(url);const b=await r.json().catch(()=>({error:'Request failed.'}));if(!r.ok)throw Error(b.error||'Request failed.');return b;}async function load(){const x=await api('/api/admission-prospectus/options');lookup.elements.classId.innerHTML=x.classes.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');lookup.elements.academicYearId.innerHTML=x.academicYears.map(y=>`<option value="${esc(y.id)}">${esc(y.name)}</option>`).join('');}lookup.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Loading…';result.hidden=true;try{const q=new URLSearchParams(new FormData(lookup));const data=await api('/api/admission-prospectus?'+q);const x=data.prospectuses[0];if(!x){status.textContent='No Admission Prospectus has been published for the selected class and academic year.';return;}status.textContent='';result.hidden=false;result.innerHTML=`<p class="eyebrow">${esc(x.className)} · ${esc(x.academicYear)}</p><h2>Admission Prospectus</h2>${x.content?`<div class="prospectus-content">${x.content}</div>`:''}${x.documentUrl?`<p><a class="primary-button" href="${esc(x.documentUrl)}" target="_blank" rel="noopener">View or Download Document</a></p>`:''}<small class="muted">Published ${esc(x.publishedAt||'')}</small>`;}catch(err){status.textContent=err.message;}});load().catch(err=>status.textContent=err.message);
</script></body></html>
