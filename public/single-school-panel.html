<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Single-School Panel | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/single-school-panel.css"></head><body><main class="form-page single-school-panel"><a class="text-button" href="/">← School workspace</a><div id="panel-status" class="panel-status" role="status">Loading the Single-School Panel…</div><div id="panel-content" hidden><header class="panel-header"><img id="school-logo" alt="OSAAH DayLIGHT School logo"><div><p class="eyebrow">OSAAH DAYLIGHT SCHOOL</p><h1>Single-School Panel</h1><p class="muted">Centralized operational overview and management workspace for OSAAH Daylight School.</p><p id="school-meta" class="panel-meta"></p></div></header><section class="overview-section"><h2>School Overview</h2><div id="overview-cards" class="panel-card-grid"></div></section><div id="panel-sections"></div></div></main><script>
const statusEl=document.querySelector('#panel-status'),content=document.querySelector('#panel-content'),esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=(v)=>Number(v??0).toLocaleString(),money=(v)=>`GHS ${Number(v??0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const card=(label,value,detail='')=>`<article class="panel-stat"><span>${esc(label)}</span><strong>${esc(n(value))}</strong>${detail?`<small>${esc(detail)}</small>`:''}</article>`;
const link=(label,route)=>`<a class="secondary-button" href="${esc(route)}" target="_top">${esc(label)}</a>`;
function section(title,body,actions=''){return `<section class="panel-section"><div class="section-heading"><h2>${esc(title)}</h2><div class="button-row">${actions}</div></div>${body}</section>`}
function render(data){const s=data.school||{};document.querySelector('#school-logo').src=s.logoPath||'/assets/osaah-daylight-logo.png';document.querySelector('#school-meta').textContent=[s.name||'OSAAH DAYLIGHT SCHOOL',s.academicYear?`Academic Year: ${s.academicYear}`:'',s.term?`Term: ${s.term}`:'',s.status?`Status: ${s.status}`:''].filter(Boolean).join(' · ');const o=data.overview||{};document.querySelector('#overview-cards').innerHTML=[card('Total Students',o.totalStudents),card('Boys',o.boys),card('Girls',o.girls),card('Total Staff',o.totalStaff),card('Teachers',o.teachers),card('Classes',o.classes),card('Current Academic Year',s.academicYear||0),card('Current Term',s.term||0)].join('');const st=data.students||{};const a=data.admissions;const at=data.attendance||{};const ac=data.academics;const f=data.finance;const hr=data.staff;const c=data.communication;const levelRows=(st.classBreakdown||Object.entries(st.byLevel||{}).map(([name,total])=>({name,total}))).map(row=>`<tr><td>${esc(row.name)}</td><td>${n(row.boys||0)}</td><td>${n(row.girls||0)}</td><td>${n(row.total)}</td></tr>`).join('')||'<tr><td colspan="4">No enrollment data</td></tr>';let html='';if(a)html+=section('Admissions',`<div class="panel-card-grid">${card('Total Admissions',a.total)}${card('Pending Applications',a.pending)}${card('Accepted Admissions',a.accepted)}${card('Rejected Applications',a.rejected)}${card('New Students',a.newStudents)}${card('Transfer Students',a.transferStudents)}</div>`,link('View Admissions','/admissions'));html+=section('Students',`<div class="panel-card-grid">${card('Active Students',st.totalActive)}${card('Boys',st.boys)}${card('Girls',st.girls)}</div><div class="table-wrap"><table><thead><tr><th>Class</th><th>Boys</th><th>Girls</th><th>Total</th></tr></thead><tbody>${levelRows}</tbody></table></div>`,link('View Class Database','/class-database.html'));html+=section('Attendance',`<div class="panel-card-grid">${card('Students Present Today',at.studentsPresent)}${card('Students Absent Today',at.studentsAbsent)}${card('Boys Present',at.boysPresent)}${card('Girls Present',at.girlsPresent)}${card('Staff Present',at.staffPresent)}${card('Staff Absent',at.staffAbsent)}${card('Staff on Approved Leave',at.staffOnLeave)}${card('Attendance Percentage',`${at.percentage}%`)}</div><div class="bar-chart"><span style="width:${Math.min(100,at.percentage||0)}%">Present ${n(at.studentsPresent)}</span><i>Absent ${n(at.studentsAbsent)}</i></div>`,[link('Daily Attendance','/attendance'),link('Weekly Summary','/attendance/reports?period=WEEKLY'),link('Monthly Summary','/attendance/reports?period=MONTHLY'),link('Term Summary','/attendance/reports?period=TERM')].join(''));if(ac)html+=section('Academic Overview',`<div class="panel-card-grid">${card('Results Published',ac.resultsPublished)}${card('Results Pending',ac.resultsPending)}${card('Classes With Results',ac.classesWithResults)}${card('Students With Published Results',ac.studentsWithPublishedResults)}${card('Current Mock Examination',ac.currentMockExaminationStatus||'No mock assessments recorded')}</div><p class="muted">${esc(ac.currentAssessmentStatus)}</p>`,['/examinations/marks','/results','/reports/academic'].map((r,i)=>link(['Score Entry','Results','Academic Reports'][i],r)).join(''));if(f)html+=section('Financial Overview',`<div class="panel-card-grid">${card('Expected Fees',money(f.expectedFees))}${card('Amount Collected',money(f.amountCollected))}${card('Outstanding Fees',money(f.outstandingFees))}${card('Expenses',money(f.expenses))}${card('Net Position',money(f.netPosition))}${card('Payments / Receipts',`${n(f.payments)} / ${n(f.receipts)}`)}</div>`,['/fees/payments','/fees/invoices','/finance/arrears','/finance/expenses','/finance/cashbook','/finance/reports'].map((r,i)=>link(['View Payments','View Receipts','View Arrears','View Expenses','View Cashbook','View Finance Reports'][i],r)).join(''));if(hr)html+=section('Staff & HR',`<div class="panel-card-grid">${card('Total Staff',hr.total)}${card('Teaching Staff',hr.teaching)}${card('Non-Teaching Staff',hr.nonTeaching)}${card('Present Today',hr.presentToday)}${card('Absent Today',hr.absentToday)}${card('Approved Leave',hr.onLeave)}</div>`,link('View Staff & HR','/staff'));const col=data.collections||{};html+=section('Collections Overview',`<div class="panel-card-grid">${card("Today's Extra Classes Collection",money(col.extraClasses?.today))}${card('Term Extra Classes Collection',money(col.extraClasses?.term))}${card("Today's Canteen Collection",money(col.canteen?.today))}${card('Term Canteen Collection',money(col.canteen?.term))}</div><div class="table-wrap"><table><thead><tr><th>Class</th><th>Date</th><th>Collection Type</th><th>Amount</th></tr></thead><tbody>${[...(col.extraClasses?.rows||[]),...(col.canteen?.rows||[])].map(row=>`<tr><td>${esc(row.class||'School')}</td><td>${esc(row.date||'')}</td><td>${esc(row.type||'')}</td><td>${money(row.amount)}</td></tr>`).join('')||'<tr><td colspan="4">No collections recorded.</td></tr>'}</tbody></table></div>`,link('View Collections','/fees/collections/reports'));if(c)html+=section('Communication',`<div class="activity-list">${(c.announcements||[]).concat(c.notifications||[]).slice(0,5).map(x=>`<div><strong>${esc(x.title||x.type||'Notification')}</strong><span>${esc(x.createdAt||'')}</span></div>`).join('')||'<p class="muted">No recent communication.</p>'}</div>`,link('Communication','/communication'));html+=section('Quick Actions',`<div class="quick-actions">${(data.quickActions||[]).map(x=>link(x.label,x.route)).join('')||'<p class="muted">No quick actions are authorized for this account.</p>'}</div>`);html+=section('Recent Activity',`<div class="activity-list">${(data.recentActivity||[]).map(x=>`<div><strong>${esc(x.activity)}</strong><span>${esc(x.module||'')} · ${esc(x.dateTime||'')}</span></div>`).join('')||'<p class="muted">No recent activity is available.</p>'}</div>`);document.querySelector('#panel-sections').innerHTML=html;statusEl.hidden=true;content.hidden=false}
async function load(){statusEl.className='panel-status';statusEl.textContent='Loading the Single-School Panel…';try{const r=await fetch('/api/single-school/overview',{credentials:'same-origin',cache:'no-store'});const body=await r.json();if(!r.ok)throw new Error(body.error||'Unable to load the panel.');render(body)}catch(e){statusEl.className='panel-status error';statusEl.innerHTML=`<strong>Unable to load the Single-School Panel.</strong><p>${esc(e.message)}</p><button class="primary-button" type="button" onclick="load()">Retry</button>`}}load();
</script></body></html>
