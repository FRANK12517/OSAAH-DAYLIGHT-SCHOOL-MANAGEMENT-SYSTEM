<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Reports | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/reports.html">← Reports</a><p class="eyebrow">REPORTS &amp; ANALYTICS</p><h1>ACADEMIC PERFORMANCE REPORTS</h1><form id="filters" class="student-form"><label>Academic Year<input name="academicYear" placeholder="2026/2027"></label><label>Term<select name="term"><option>1st Term</option><option>2nd Term</option><option>3rd Term</option></select></label><label>Scope<select name="scope"><option value="WHOLE_SCHOOL">Whole School</option><option value="KG">KG</option><option value="PRIMARY">Primary</option><option value="JHS">JHS</option><option value="">Specific Class</option></select></label><label>Class ID<input name="classId" placeholder="primary-4"></label><button class="primary-button" type="submit">Generate Report</button><button class="text-button" id="print-report" type="button">Print</button><button class="text-button" id="export-csv" type="button">Export CSV</button><button class="text-button" id="export-pdf" type="button">Export PDF</button></form><section id="output" class="card"><p class="muted">Generate a report to preview academic metrics.</p></section><style>#output .gender-summary{display:flex;gap:1rem;flex-wrap:wrap;margin:1rem 0;font-weight:700}#output .gender-summary span{padding:.55rem .75rem;border:1px solid #d6b15a;border-radius:.35rem;background:#fffdf4}#output .table-scroll{overflow-x:auto}#output table{min-width:980px}@media print{body{background:#fff}.form-page>form,.text-button,#reports-nav{display:none!important}#output{border:0;box-shadow:none}}</style><script>const money=(v)=>new Intl.NumberFormat('en-GH',{style:'currency',currency:'GHS'}).format(v||0);document.querySelector('#filters').addEventListener('submit',async(e)=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const qs=new URLSearchParams(data);const r=await fetch(`/api/reports/academic?${qs}`);const j=await r.json();document.querySelector('#output').innerHTML=r.ok?`<h2>${j.title}</h2><p>${j.academicYear||''} ${j.term||''} ${j.scope||''}</p><div class=\"gender-summary\"><span>TOTAL BOYS IN CLASS: ${j.genderDistribution?.totalBoys ?? j.summary.totalBoys ?? 0}</span><span>TOTAL GIRLS IN CLASS: ${j.genderDistribution?.totalGirls ?? j.summary.totalGirls ?? 0}</span><span>TOTAL STUDENTS IN CLASS: ${j.genderDistribution?.totalStudents ?? j.summary.totalStudents ?? 0}</span></div><div class=\"ops-grid\"><article class=\"card\"><strong>${j.summary.totalStudents}</strong><span>Total students</span></article><article class=\"card\"><strong>${j.summary.totalAssessed}</strong><span>Assessed</span></article><article class=\"card\"><strong>${j.summary.overallAverage??'N/A'}</strong><span>Overall average</span></article><article class=\"card\"><strong>${j.summary.passRate}%</strong><span>Pass rate</span></article></div><div class=\"table-scroll\"><table><thead><tr><th>OSAAH STUDENT INDEX</th><th>STUDENT NAME</th><th>GENDER</th><th>Class</th><th>TOTAL SCORE</th><th>AGGREGATE</th><th>CLASS POSITION</th><th>Average</th><th>Grade</th></tr></thead><tbody>${j.studentPerformance.map((s)=>`<tr><td>${s.permanentStudentId||s.studentIndexNumber||'—'}</td><td>${s.studentName||'—'}</td><td>${s.gender||'Not Recorded'}</td><td>${s.classId||''}</td><td>${s.totalScore??'N/A'}</td><td>${s.aggregate??'N/A'}</td><td>${s.classPosition||s.position||'—'}</td><td>${s.averageScore??'N/A'}</td><td>${s.grade??'N/A'}</td></tr>`).join('')}</tbody></table></div>`:`<p class=\"error\">${j.error||'Unable to load report.'}</p>`;});const exportReport=async(format)=>{const data=Object.fromEntries(new FormData(document.querySelector('#filters')));data.format=format;const r=await fetch(`/api/reports/academic/export?${new URLSearchParams(data)}`);const j=await r.json();if(!r.ok){document.querySelector('#output').innerHTML=`<p class="error">${j.error||'Unable to export report.'}</p>`;return;}const blob=new Blob([j.content],{type:j.mimeType||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=j.filename||`academic-performance.${format}`;a.click();URL.revokeObjectURL(a.href);};document.querySelector('#print-report').addEventListener('click',()=>window.print());document.querySelector('#export-csv').addEventListener('click',()=>exportReport('csv'));document.querySelector('#export-pdf').addEventListener('click',()=>exportReport('pdf'));</script></main></body></html>
