<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Academic Reports | OsaaH Daylight</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    #output .gender-summary{display:flex;gap:1rem;flex-wrap:wrap;margin:1rem 0;font-weight:700}
    #output .gender-summary span{padding:.55rem .75rem;border:1px solid #d6b15a;border-radius:.35rem;background:#fffdf4}
    #output .table-scroll{overflow-x:auto}
    #output table{min-width:980px}
    @media print{body{background:#fff}.form-page>form,.text-button,#reports-nav{display:none!important}#output{border:0;box-shadow:none}}
  </style>
</head>
<body>
  <main class="form-page">
    <a class="text-button" href="/reports.html">← Reports</a>
    <p class="eyebrow">REPORTS &amp; ANALYTICS</p>
    <h1>ACADEMIC PERFORMANCE REPORTS</h1>
    <form id="filters" class="student-form">
      <label>Academic Year<input name="academicYear" placeholder="2026/2027"></label>
      <label>Term<select name="term"><option>1st Term</option><option>2nd Term</option><option>3rd Term</option></select></label>
      <label>Scope<select name="scope"><option value="WHOLE_SCHOOL">Whole School</option><option value="KG">KG</option><option value="PRIMARY">Primary</option><option value="JHS">JHS</option><option value="">Specific Class</option></select></label>
      <label>Class ID<input name="classId" placeholder="Primary 4"></label>
      <button class="primary-button" type="submit">Generate Report</button>
      <button class="text-button" id="print-report" type="button">Print</button>
      <button class="text-button" id="export-csv" type="button">Export CSV</button>
      <button class="text-button" id="export-pdf" type="button">Export PDF</button>
    </form>
    <section id="output" class="card"><p class="muted">Generate a report to preview academic metrics.</p></section>
  </main>
  <script>
    const form = document.querySelector('#filters');
    const output = document.querySelector('#output');
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const filters = () => Object.fromEntries(new FormData(form));
    const render = (j) => {
      const summary = j.genderDistribution ?? { totalBoys: j.summary?.totalBoys ?? 0, totalGirls: j.summary?.totalGirls ?? 0, totalStudents: j.summary?.totalStudents ?? 0 };
      const rows = (j.studentPerformance ?? []).map((student) => `<tr><td>${escapeHtml(student.permanentStudentId || student.studentIndexNumber || '—')}</td><td>${escapeHtml(student.studentName || '—')}</td><td>${escapeHtml(student.gender || 'Not Recorded')}</td><td>${escapeHtml(student.classId || '')}</td><td>${student.totalScore ?? 'N/A'}</td><td>${student.aggregate ?? 'N/A'}</td><td>${escapeHtml(student.classPosition || student.position || '—')}</td><td>${student.averageScore ?? 'N/A'}</td><td>${escapeHtml(student.grade || 'N/A')}</td></tr>`).join('');
      output.innerHTML = `<h2>${escapeHtml(j.title)}</h2><p>${escapeHtml(j.academicYear || '')} ${escapeHtml(j.term || '')} ${escapeHtml(j.scope || '')}</p><div class="gender-summary"><span>TOTAL BOYS IN CLASS: ${summary.totalBoys}</span><span>TOTAL GIRLS IN CLASS: ${summary.totalGirls}</span><span>TOTAL STUDENTS IN CLASS: ${summary.totalStudents}</span></div><div class="ops-grid"><article class="card"><strong>${j.summary.totalStudents}</strong><span>Total students</span></article><article class="card"><strong>${j.summary.totalAssessed}</strong><span>Assessed</span></article><article class="card"><strong>${j.summary.overallAverage ?? 'N/A'}</strong><span>Overall average</span></article><article class="card"><strong>${j.summary.passRate}%</strong><span>Pass rate</span></article></div><div class="table-scroll"><table><thead><tr><th>OSAAH STUDENT INDEX</th><th>STUDENT NAME</th><th>GENDER</th><th>Class</th><th>TOTAL SCORE</th><th>AGGREGATE</th><th>CLASS POSITION</th><th>Average</th><th>Grade</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    };
    form.addEventListener('submit', async (event) => { event.preventDefault(); const response = await fetch(`/api/reports/academic?${new URLSearchParams(filters())}`); const data = await response.json(); if (response.ok) render(data); else output.innerHTML = `<p class="error">${escapeHtml(data.error || 'Unable to load report.')}</p>`; });
    const exportReport = async (format) => { const response = await fetch(`/api/reports/academic/export?${new URLSearchParams({...filters(), format})}`); const data = await response.json(); if (!response.ok) { output.innerHTML = `<p class="error">${escapeHtml(data.error || 'Unable to export report.')}</p>`; return; } const blob = new Blob([data.content], { type: data.mimeType || 'text/plain' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = data.filename || `academic-performance.${format}`; link.click(); URL.revokeObjectURL(link.href); };
    document.querySelector('#print-report').addEventListener('click', () => window.print());
    document.querySelector('#export-csv').addEventListener('click', () => exportReport('csv'));
    document.querySelector('#export-pdf').addEventListener('click', () => exportReport('pdf'));
  </script>
</body>
</html>
