<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Reports | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/reports.html">← Reports</a><p class="eyebrow">REPORTS &amp; ANALYTICS</p><h1>ACADEMIC PERFORMANCE REPORTS</h1><form id="filters" class="student-form"><label>Academic Year<input name="academicYear" placeholder="2026/2027"></label><label>Term<select name="term"><option>1st Term</option><option>2nd Term</option><option>3rd Term</option></select></label><label>Scope<select name="scope"><option value="WHOLE_SCHOOL">Whole School</option><option value="KG">KG</option><option value="PRIMARY">Primary</option><option value="JHS">JHS</option><option value="">Specific Class</option></select></label><label>Class ID<input name="classId" placeholder="primary-4"></label><button class="primary-button" type="submit">Generate Report</button></form><section id="output" class="card"><p class="muted">Generate a report to preview academic metrics.</p></section><script>const money=(v)=>new Intl.NumberFormat('en-GH',{style:'currency',currency:'GHS'}).format(v||0);document.querySelector('#filters').addEventListener('submit',async(e)=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const qs=new URLSearchParams(data);const r=await fetch(`/api/reports/academic?${qs}`);const j=await r.json();document.querySelector('#output').innerHTML=r.ok?`<h2>${j.title}</h2><p>${j.academicYear||''} ${j.term||''} ${j.scope||''}</p><div class=\"ops-grid\"><article class=\"card\"><strong>${j.summary.totalStudents}</strong><span>Total students</span></article><article class=\"card\"><strong>${j.summary.totalAssessed}</strong><span>Assessed</span></article><article class=\"card\"><strong>${j.summary.overallAverage??'N/A'}</strong><span>Overall average</span></article><article class=\"card\"><strong>${j.summary.passRate}%</strong><span>Pass rate</span></article></div><div class=\"table-scroll\"><table><thead><tr><th>Student</th><th>Class</th><th>Average</th><th>Grade</th></tr></thead><tbody>${j.studentPerformance.map((s)=>`<tr><td>${s.studentName}</td><td>${s.classId||''}</td><td>${s.averageScore??'N/A'}</td><td>${s.grade??'N/A'}</td></tr>`).join('')}</tbody></table></div>`:`<p class=\"error\">${j.error||'Unable to load report.'}</p>`;});</script></main></body></html>\n*** End Patch
