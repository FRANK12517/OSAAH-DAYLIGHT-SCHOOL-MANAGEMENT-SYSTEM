<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">ATTENDANCE MANAGEMENT</p><h1>Today's Attendance</h1><p class="muted">Select an assigned class and load its authoritative student register.</p>
<form id="attendance-form" class="student-form"><fieldset><legend>Class</legend><label>Select class<select id="attendance-class" required><option value="">Choose a class</option><option value="Nursery 1">Nursery 1</option><option value="Nursery 2">Nursery 2</option><option value="KG1">KG1</option><option value="KG2">KG2</option><option value="Primary 1">Primary 1</option><option value="Primary 2">Primary 2</option><option value="Primary 3">Primary 3</option><option value="Primary 4">Primary 4</option><option value="Primary 5">Primary 5</option><option value="Primary 6">Primary 6</option><option value="JHS 1">JHS 1</option><option value="JHS 2">JHS 2</option><option value="JHS 3">JHS 3</option></select></label><label>Academic year<select id="attendance-academic-year" required><option value="">Loading academic years…</option></select></label><label>Term<select id="attendance-term" required><option value="">Choose a term</option></select></label><label>Date<input id="attendance-date" type="date" required></label><button class="secondary-button" type="button" id="load-register">Load Register</button></fieldset>
<fieldset><legend>Mark Students</legend><div style="overflow-x:auto"><table><thead><tr><th>No.</th><th>Permanent Student ID</th><th>Student Name</th><th>Status</th><th>Reason</th><th>Arrival / check-in</th><th>Departure / check-out</th></tr></thead><tbody id="attendance-register"><tr><td colspan="7">Load a class register to begin.</td></tr></tbody></table></div></fieldset><button class="primary-button" type="submit">Save Attendance</button></form><p id="attendance-status" class="muted" role="status"></p></main><script src="/attendance-register.js"></script></body></html>
