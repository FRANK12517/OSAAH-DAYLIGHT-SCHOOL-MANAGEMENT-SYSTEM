<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Staff &amp; HR | OsaaH Daylight</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    #remove-dialog{width:min(32rem,calc(100% - 2rem));border:1px solid #cbd5e1;border-radius:.75rem;padding:1.5rem;color:#102a43;box-shadow:0 18px 50px #102a4333}
    #remove-dialog::backdrop{background:#102a4380}
    #remove-dialog h2{margin-top:0}
    #remove-dialog-actions{display:flex;justify-content:flex-end;gap:.75rem;margin-top:1.25rem}
    .danger-outline{border:1px solid #b42318;border-radius:.4rem;background:#fff;color:#b42318;padding:.45rem .75rem;font:inherit;cursor:pointer}
    .danger-outline:hover,.danger-outline:focus-visible{background:#fff1f0}
    .danger-outline:disabled,#continue-remove:disabled{opacity:.6;cursor:wait}
    #remove-status{color:#b42318;min-height:1.25rem}
    .responsive-table{overflow-x:auto}
  </style>
</head>
<body>
  <main class="form-page">
    <p class="eyebrow">STAFF &amp; HR</p>
    <h1 id="title">Staff &amp; HR</h1>
    <p id="summary" class="muted">Loading authorized staff records…</p>
    <p id="staff-action-status" role="status" aria-live="polite"></p>
    <section class="report-grid" id="metrics"></section>
    <section class="card">
      <h2 id="section-title">Records</h2>
      <div class="responsive-table">
        <table>
          <thead><tr><th>Staff member</th><th>Role</th><th>Employment</th><th>Department</th><th id="actions-heading" hidden>Actions</th></tr></thead>
          <tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <dialog id="remove-dialog" aria-labelledby="remove-dialog-title">
    <h2 id="remove-dialog-title">Confirm staff removal</h2>
    <p id="remove-confirmation"></p>
    <p id="remove-status" role="status" aria-live="polite"></p>
    <div id="remove-dialog-actions">
      <button type="button" id="cancel-remove">Cancel</button>
      <button type="button" class="danger-outline" id="continue-remove">Continue</button>
    </div>
  </dialog>
  <script>
    const views={
      '/staff':'Staff Directory','/staff/teachers':'Teachers','/staff/hr':'HR','/staff/qualifications-licences':'Qualifications / Licences','/staff/performance':'Performance','/staff/professional-development':'Professional Development','/staff/qualifications':'Qualifications','/staff/ntc-records':'NTC Records','/staff/appraisal':'Appraisal','/staff/documents':'HR Documents'
    };
    const path=location.pathname,label=views[path]??'Staff & HR';
    const rows=document.querySelector('#rows'),summary=document.querySelector('#summary'),metrics=document.querySelector('#metrics');
    const actionsHeading=document.querySelector('#actions-heading'),dialog=document.querySelector('#remove-dialog'),confirmation=document.querySelector('#remove-confirmation'),dialogStatus=document.querySelector('#remove-status');
    const actionStatus=document.querySelector('#staff-action-status'),continueButton=document.querySelector('#continue-remove');
    document.title=`${label} | OsaaH Daylight`;
    document.querySelector('#title').textContent=label;
    document.querySelector('#section-title').textContent=label+' records';
    const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    let staffRecords=[],canManageStaff=false,pendingStaff=null;
    const isDirectory=path==='/staff';
    function render(){
      const visible=path==='/staff/teachers'?staffRecords.filter(item=>/TEACH|HEAD/i.test(item.roleKey??'')):staffRecords;
      const canRemove=isDirectory&&canManageStaff;
      actionsHeading.hidden=!canRemove;
      const activeCount=visible.filter(item=>String(item.accountStatus??item.employmentStatus??'ACTIVE').toUpperCase()==='ACTIVE').length;
      summary.textContent=`${visible.length} authorized record${visible.length===1?'':'s'} loaded from the school staff service.`;
      metrics.innerHTML=`<article class="card"><strong>${visible.length}</strong><span>${esc(label)} records</span></article><article class="card"><strong>${activeCount}</strong><span>Active staff</span></article>`;
      rows.innerHTML=visible.length?visible.map(item=>{
        const status=String(item.employmentStatus??item.accountStatus??'ACTIVE');
        const removeButton=canRemove&&status.toUpperCase()==='ACTIVE'?`<button type="button" class="danger-outline" data-remove-staff="${esc(item.userId??item.id)}">Remove</button>`:'';
        return `<tr><td>${esc(item.fullName)}</td><td>${esc(item.roleKey||'Staff')}</td><td>${esc(status)}</td><td>${esc(item.departmentId||'Not recorded')}</td>${canRemove?`<td>${removeButton}</td>`:''}</tr>`;
      }).join(''):`<tr><td colspan="${canRemove?5:4}">No records available.</td></tr>`;
    }
    async function load(){
      try{
        const response=await fetch('/api/staff-directory');
        if(!response.ok){summary.textContent='Authorized staff access is required.';rows.innerHTML='<tr><td colspan="4">No records available.</td></tr>';return;}
        const data=await response.json();
        staffRecords=Array.isArray(data.staff)?data.staff:[];
        canManageStaff=data.canManageStaff===true;
        render();
      }catch(error){summary.textContent=error.message||'Unable to load Staff Directory.';rows.innerHTML='<tr><td colspan="4">Unable to load Staff Directory.</td></tr>';}
    }
    rows.addEventListener('click',event=>{
      const button=event.target.closest('[data-remove-staff]');
      if(!button)return;
      const targetId=button.dataset.removeStaff;
      pendingStaff=staffRecords.find(item=>String(item.userId??item.id)===String(targetId));
      if(!pendingStaff)return;
      confirmation.textContent=`Are you sure you want to remove ${pendingStaff.fullName} from the system?`;
      dialogStatus.textContent='';
      dialog.showModal();
    });
    document.querySelector('#cancel-remove').addEventListener('click',()=>{pendingStaff=null;dialog.close();});
    continueButton.addEventListener('click',async()=>{
      if(!pendingStaff)return;
      continueButton.disabled=true;
      dialogStatus.textContent='Removing staff access…';
      try{
        const id=encodeURIComponent(pendingStaff.userId??pendingStaff.id);
        const response=await fetch(`/api/staff-management/${id}/disable`,{method:'POST'});
        const data=await response.json().catch(()=>({}));
        if(!response.ok)throw new Error(data.error||'Unable to remove this staff member.');
        pendingStaff.accountStatus='DISABLED';
        const name=pendingStaff.fullName;
        pendingStaff=null;
        dialog.close();
        actionStatus.textContent=`${name} was removed from active staff access.`;
        render();
      }catch(error){dialogStatus.textContent=error.message||'Unable to remove this staff member.';}
      finally{continueButton.disabled=false;}
    });
    dialog.addEventListener('close',()=>{pendingStaff=null;continueButton.disabled=false;});
    load();
  </script>
</body>
</html>
