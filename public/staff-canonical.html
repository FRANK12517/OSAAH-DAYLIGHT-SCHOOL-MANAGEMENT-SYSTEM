<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff &amp; HR | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">STAFF &amp; HR</p><h1 id="title">Staff &amp; HR</h1><p id="summary" class="muted">Loading authorized staff records…</p><section class="report-grid" id="metrics"></section><section class="card"><h2 id="section-title">Records</h2><div class="responsive-table"><table><thead><tr><th>Staff member</th><th>Role</th><th>Employment</th><th>Department</th></tr></thead><tbody id="rows"><tr><td colspan="4">Loading…</td></tr></tbody></table></div></section></main><script>
const views={
 '/staff':'Staff Directory','/staff/teachers':'Teachers','/staff/hr':'HR','/staff/qualifications-licences':'Qualifications / Licences','/staff/performance':'Performance','/staff/professional-development':'Professional Development','/staff/qualifications':'Qualifications','/staff/ntc-records':'NTC Records','/staff/appraisal':'Appraisal','/staff/documents':'HR Documents'};
const path=location.pathname,label=views[path]??'Staff & HR';document.title=`${label} | OsaaH Daylight`;document.querySelector('#title').textContent=label;document.querySelector('#section-title').textContent=label+' records';
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){const response=await fetch('/api/attendance/staff');if(!response.ok){document.querySelector('#summary').textContent='Authorized staff access is required.';document.querySelector('#rows').innerHTML='<tr><td colspan="4">No records available.</td></tr>';return}const data=await response.json();let staff=data.staff??[];if(path==='/staff/teachers')staff=staff.filter(item=>/TEACH|HEAD/i.test(item.roleKey??''));const counts={total:staff.length,active:staff.filter(item=>item.employmentStatus==='ACTIVE').length};document.querySelector('#summary').textContent=`${counts.total} authorized record${counts.total===1?'':'s'} loaded from the school staff service.`;document.querySelector('#metrics').innerHTML=`<article class="card"><strong>${counts.total}</strong><span>${esc(label)} records</span></article><article class="card"><strong>${counts.active}</strong><span>Active staff</span></article>`;document.querySelector('#rows').innerHTML=staff.length?staff.map(item=>`<tr><td>${esc(item.fullName)}</td><td>${esc(item.roleKey||'Staff')}</td><td>${esc(item.employmentStatus||'ACTIVE')}</td><td>${esc(item.departmentId||'Not recorded')}</td></tr>`).join(''):'<tr><td colspan="4">No records available.</td></tr>'}load();
</script></body></html>
