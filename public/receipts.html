<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipts | Osaah Daylight</title><link rel="stylesheet" href="/styles.css"><style>.receipt-tools{display:flex;gap:.75rem;flex-wrap:wrap}.official-receipt{background:#fff;max-width:820px;margin:1rem auto;box-shadow:0 8px 30px #102a4318}.receipt-header-image{display:block;width:100%;height:auto;object-fit:contain}.receipt-body{position:relative;min-height:620px;padding:1.5rem;overflow:hidden}.receipt-watermark{position:absolute;top:50%;left:50%;width:40%;height:auto;transform:translate(-50%,-50%);opacity:.07;pointer-events:none;user-select:none;z-index:0}.receipt-content{position:relative;z-index:1}.receipt-title-row{display:flex;justify-content:space-between;gap:1rem;align-items:center;border-bottom:2px solid #102a43;padding-bottom:.75rem}.receipt-title-row h1{font-size:1.35rem;margin:0}.receipt-title-row strong{color:#102a43}.receipt-grid{display:grid;grid-template-columns:minmax(130px, .35fr) 1fr;gap:.55rem 1rem}.receipt-grid dt{font-weight:700}.receipt-grid dd{margin:0;border-bottom:1px solid #dfe7ef;padding-bottom:.25rem}@media print{.no-print{display:none!important}.official-receipt{box-shadow:none;margin:0;max-width:none}.receipt-watermark{display:block!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4;margin:10mm}}@media (max-width:600px){.receipt-body{padding:1rem;min-height:540px}.receipt-title-row{align-items:flex-start;flex-direction:column}.receipt-grid{grid-template-columns:1fr}.receipt-grid dt{margin-top:.35rem}}</style></head><body><main class="form-page"><a class="text-button no-print" href="/">← Dashboard</a><p class="eyebrow no-print">FEE HUB</p><h1 class="no-print">Receipt Preview</h1><section class="card no-print"><form id="receipt-form"><label>Receipt Number<input name="receiptNumber" placeholder="RCT-000001" required></label><div class="receipt-tools"><button class="primary-button" type="submit">Preview Receipt</button><button class="text-button" id="print" type="button" disabled>Print Receipt</button><button class="text-button" id="download" type="button" disabled>Download PDF</button></div><p id="status" class="error" role="status"></p></form></section><section id="receipt" aria-live="polite"></section></main><script src="/receipts.js"></script></body></html>
