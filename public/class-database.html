<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Database | Osaah Daylight</title><link rel="stylesheet" href="/styles.css"><style>.class-db{max-width:1180px}.class-db .filters{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:14px;align-items:end}.class-db .table-scroll{overflow-x:auto}.class-db table{min-width:760px}@media(max-width:720px){.class-db .filters{grid-template-columns:1fr}.class-db .filters button{width:100%}}</style></head><body><main class="form-page class-db"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">STUDENTS MANAGEMENT</p><h1>CLASS DATABASE</h1><section class="card"><form id="filters" class="filters"><label>Academic Year<select name="academicYear" id="academicYear"></select></label><label>Class<select name="classId" id="classId" required></select></label><label>Search<input name="search" id="search" placeholder="Search by Student ID, Student Name, Parent or Phone..."></label><button class="primary-button" type="submit">Search</button></form><p id="status" class="muted" role="status">Select a class to view currently enrolled students.</p></section><section class="card"><div class="table-scroll"><table><thead><tr><th>Permanent Student ID</th><th>Name of Student</th><th>Name of Parent/Guardian</th><th>Registered Parent Phone Number</th></tr></thead><tbody id="rows"><tr><td colspan="4">Select a class to view students.</td></tr></tbody></table></div></section></main><script src="/class-database.js"></script></body></html>
