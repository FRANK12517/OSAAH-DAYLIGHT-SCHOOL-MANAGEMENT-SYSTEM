<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">REPORTS &amp; ANALYTICS</p><h1 id="title">Reports &amp; Analytics</h1><p id="summary" class="muted">Loading authorized report data…</p><section class="report-grid" id="metrics"></section><section class="card"><h2>Report view</h2><p id="detail" class="muted">No report data is currently available.</p></section></main><script>
const views={'/reports':'Reports & Analytics','/reports/attendance':'Attendance Reports','/reports/enrollment':'Enrollment Reports','/reports/staff':'Staff Reports','/reports/operations':'Operational Reports','/reports/management':'Management Dashboard'};const path=location.pathname,label=views[path]??'Reports & Analytics';document.title=`${label} | OsaaH Daylight`;document.querySelector('#title').textContent=label;const sources={ '/reports/attendance':'/api/ai/academic-attendance-status','/reports/enrollment':'/api/reports/enrollment','/reports/staff':'/api/ai/admissions-workforce-status','/reports/operations':'/api/ai/operational-status','/reports/management':'/api/ai/executive-brief','/reports':'/api/ai/executive-brief'};async function load(){const response=await fetch(sources[path]??sources['/reports']);let data=response.ok?await response.json():null;document.querySelector('#summary').textContent=response.ok?`${label} is connected to its authorized reporting source.`:`${label} is currently unavailable for this role.`;document.querySelector('#metrics').innerHTML=`<article class="card"><strong>${response.ok?'AVAILABLE':'UNAVAILABLE'}</strong><span>${label}</span></article><article class="card"><strong>${response.ok?'LIVE':'—'}</strong><span>Data quality state</span></article>`;document.querySelector('#detail').textContent=response.ok?`This dashboard uses ${sources[path]??sources['/reports']} and preserves its source quality and authorization response.`:(data?.message??'No report data is currently available.')}load();
</script></body></html>
