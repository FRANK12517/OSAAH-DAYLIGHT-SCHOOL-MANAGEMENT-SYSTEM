<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Settings | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">ADMINISTRATIVE · CANONICAL SCHOOL RECORD</p><h1>School Settings</h1><p class="muted">Manage the existing OSAAH Daylight School configuration. Changes are saved to the authenticated school context.</p><section class="card"><form id="settings-form" class="stack-form"><h2>School information</h2><label>School name<input name="name" required></label><label>Motto<input name="motto" required></label><label>Address / location<input name="address"></label><label>Telephone<input name="telephone" type="tel"></label><label>Email<input name="email" type="email"></label><label>Website<input name="website" type="url"></label><label>Logo path<input name="logoPath"></label><div class="form-grid"><label>Primary colour<input name="primaryColour" type="text"></label><label>Secondary colour<input name="secondaryColour" type="text"></label><label>Accent colour<input name="accentColour" type="text"></label></div><button class="primary-button" type="submit">Save settings</button><p id="status" class="muted" role="status" aria-live="polite">Loading canonical settings…</p></form></section><section class="card"><h2>Academic defaults</h2><p id="academic" class="muted">Loading…</p></section></main><script>
const form=document.querySelector('#settings-form'),status=document.querySelector('#status'),academic=document.querySelector('#academic');const fields=['name','motto','address','telephone','email','website','logoPath','primaryColour','secondaryColour','accentColour'];const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(url,options){const response=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options?.headers||{})},...options});const body=await response.json().catch(()=>({}));if(!response.ok)throw Error(body.error||'Unable to load school settings.');return body}
function render(data){const profile=data.profile||{};for(const field of fields)form.elements[field].value=profile[field]??'';const year=data.academicYears?.find(item=>item.isCurrent)||data.academicYears?.[0];const term=data.terms?.find(item=>item.isCurrent)||data.terms?.[0];academic.innerHTML=`<strong>Current academic year:</strong> ${esc(year?.name||'Not configured')}<br><strong>Current term:</strong> ${esc(term?.name||'Not configured')}`}
async function load(){status.textContent='Loading canonical settings…';try{const data=await api('/api/school-settings');render(data);status.textContent='Settings loaded from the authenticated OSAAH school record.'}catch(error){status.textContent=error.message;status.className='error'}}
form.addEventListener('submit',async event=>{event.preventDefault();status.className='muted';status.textContent='Saving…';const button=form.querySelector('button');button.disabled=true;try{const values=Object.fromEntries(new FormData(form));const saved=await api('/api/school-settings',{method:'PATCH',body:JSON.stringify(values)});render(saved);status.textContent='Saved. Reloading to verify persistence…';await load()}catch(error){status.textContent=error.message;status.className='error'}finally{button.disabled=false}});load();
</script></body></html>
