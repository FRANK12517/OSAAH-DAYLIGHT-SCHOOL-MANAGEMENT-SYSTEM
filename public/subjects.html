<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subject Management | Osaah Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/academics">← Academics</a><p class="eyebrow">ACADEMICS</p><h1>Subject Management</h1><p class="muted">Subjects are deactivated rather than deleted when historical records depend on them.</p><section class="card"><form id="subject-form"><label>Subject name<input name="name" required></label><label>Code<input name="code"></label><button class="primary-button">Add Subject</button><p id="status" class="error" role="status"></p></form></section><section class="card"><div class="table-scroll"><table><thead><tr><th>Code</th><th>Name</th><th>Classes</th><th>Status</th><th>Action</th></tr></thead><tbody id="subjects"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section></main><script>const form=document.querySelector('#subject-form'),host=document.querySelector('#subjects'),status=document.querySelector('#status');const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(u,o){const r=await fetch(u,o),b=await r.json().catch(()=>({error:'Request failed.'}));if(!r.ok)throw Error(b.error||'Request failed.');return b;}async function load(){const b=await api('/api/subjects?includeInactive=true');host.innerHTML=b.subjects.map(s=>`<tr><td>${esc(s.code)}</td><td>${esc(s.name)}</td><td>${esc(s.classIds.join(', '))}</td><td>${s.active?'ACTIVE':'INACTIVE'}</td><td>${s.active?`<button class="text-button" data-id="${esc(s.id)}">Deactivate</button>`:'Archived'}</td></tr>`).join('');}form.addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/subjects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});form.reset();await load();}catch(e){status.textContent=e.message;}});host.addEventListener('click',async e=>{if(!e.target.dataset.id)return;try{await api('/api/subjects/'+e.target.dataset.id+'/deactivate',{method:'POST'});await load();}catch(e){status.textContent=e.message;}});load().catch(e=>status.textContent=e.message);</script></body></html>
