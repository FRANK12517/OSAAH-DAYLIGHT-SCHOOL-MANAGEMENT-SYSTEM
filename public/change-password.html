<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password | OsaaH Daylight</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { margin: 0; background: #f6f4ee; color: #102a43; font-family: Arial, sans-serif; }
    .change-password-page { max-width: 720px; margin: 0 auto; padding: clamp(18px, 5vw, 48px); }
    .change-password-card { background: #fff; border: 1px solid #e9e2d2; border-radius: 8px; padding: clamp(18px, 4vw, 32px); box-shadow: 0 5px 20px #102a4312; }
    h1 { margin-top: 0; font-size: clamp(25px, 5vw, 34px); }
    .intro, .policy { color: #63788a; line-height: 1.55; }
    .policy { padding: 12px 14px; background: #fff8df; border-left: 4px solid #d4a72c; }
    form { display: grid; gap: 16px; margin-top: 22px; }
    label { display: grid; gap: 6px; color: #63788a; font-size: 12px; }
    .password-field { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; min-height: 44px; box-sizing: border-box; border: 1px solid #cbd5df; border-radius: 5px; padding: 11px; font: 16px Arial, sans-serif; color: #102a43; }
    .toggle { min-width: 76px; min-height: 44px; border: 1px solid #102a43; border-radius: 5px; background: #fff; color: #102a43; font-weight: 700; cursor: pointer; }
    .primary-button { min-height: 46px; border: 0; border-radius: 5px; padding: 12px 16px; background: #102a43; color: #fff; font-weight: 700; cursor: pointer; }
    .primary-button:disabled { opacity: .65; cursor: wait; }
    .status { min-height: 22px; margin: 4px 0 0; font-weight: 700; }
    .status.error { color: #a12b2b; }
    .status.success { color: #246b3b; }
    @media (max-width: 420px) { .password-field { display: grid; } .toggle { width: 100%; } }
  </style>
</head>
<body>
  <main class="change-password-page">
    <section class="change-password-card" aria-labelledby="page-title">
      <p class="eyebrow">ACCOUNT SECURITY</p>
      <h1 id="page-title">Change Password</h1>
      <p class="intro">Change the password for the account currently signed in. Your session will end after a successful change and you will sign in again with the new password.</p>
      <p class="policy">Use at least 12 characters with an uppercase letter, a lowercase letter, a number, and a symbol.</p>
      <form id="change-password-form" novalidate>
        <label for="current-password">Current password
          <span class="password-field"><input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required><button class="toggle" type="button" data-toggle="current-password">Show</button></span>
        </label>
        <label for="new-password">New password
          <span class="password-field"><input id="new-password" name="newPassword" type="password" autocomplete="new-password" required minlength="12"><button class="toggle" type="button" data-toggle="new-password">Show</button></span>
        </label>
        <label for="confirm-password">Confirm new password
          <span class="password-field"><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required minlength="12"><button class="toggle" type="button" data-toggle="confirm-password">Show</button></span>
        </label>
        <button id="submit-button" class="primary-button" type="submit">Change password securely</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script>
    const form = document.querySelector('#change-password-form');
    const status = document.querySelector('#status');
    const submit = document.querySelector('#submit-button');
    document.querySelectorAll('[data-toggle]').forEach((button) => button.addEventListener('click', () => {
      const input = document.getElementById(button.dataset.toggle);
      const showing = input.type === 'password';
      input.type = showing ? 'text' : 'password';
      button.textContent = showing ? 'Hide' : 'Show';
      button.setAttribute('aria-pressed', String(showing));
    }));
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.className = 'status';
      status.textContent = '';
      if (!form.reportValidity()) return;
      submit.disabled = true;
      submit.textContent = 'Changing password…';
      try {
        const response = await fetch('/api/auth/change-password', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(form))) });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || 'Password change could not be completed.');
        form.reset();
        status.className = 'status success';
        status.textContent = 'Password changed. Returning to secure sign-in…';
        setTimeout(() => window.top.location.replace('/'), 900);
      } catch (error) {
        status.className = 'status error';
        status.textContent = error.message || 'Password change could not be completed.';
      } finally {
        submit.disabled = false;
        submit.textContent = 'Change password securely';
      }
    });
  </script>
</body>
</html>
