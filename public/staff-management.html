<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Management | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"><style>.staff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.staff-grid label{display:flex;flex-direction:column;gap:5px}.password-row{display:flex;gap:8px}.password-row input{flex:1}.responsive-table{overflow-x:auto}.responsive-table table{min-width:900px}</style></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">STAFF MANAGEMENT</p><h1>Staff Management</h1><p class="muted">Register and manage authorized school staff. Credentials are shown only after a successful action.</p><section class="card"><h2>Register Staff</h2><form id="staff-form" class="stack-form"><div class="staff-grid"><label>Full Name<input name="fullName" required autocomplete="name"></label><label>Staff ID<input name="staffId" required></label><label>Phone Number<input name="phone" type="tel" autocomplete="tel"></label><label>Email Address<input name="email" type="email" autocomplete="email" required></label><label>Username<input name="username" required autocomplete="username"></label><label>Primary Role<select name="primaryRole" required><option value="CLASSROOM_TEACHER">Classroom Teacher</option><option value="HEADTEACHER">Headteacher</option><option value="ASSISTANT_HEADTEACHER">Assistant Headteacher</option><option value="ACCOUNTANT">Accountant</option></select></label><label>Assigned Class<select name="assignedClassId"><option value="">Not assigned</option></select></label><label>Assigned Subject<select name="assignedSubjectId"><option value="">Not assigned</option></select></label></div><label>Password<div class="password-row"><input id="staff-password" name="password" type="password" minlength="12" autocomplete="new-password"><button type="button" class="text-button" id="generate-password">Generate Password</button><button type="button" class="text-button" id="toggle-password">Show</button></div></label><button class="primary-button" type="submit">Register Staff</button><p id="staff-result" class="muted" role="status" aria-live="polite"></p></form></section><section class="card"><h2>Staff Directory</h2><label>Search staff<input id="staff-search" type="search" placeholder="Name, Staff ID, username, email or role"></label><div class="responsive-table"><table><thead><tr><th>Full Name</th><th>Staff ID</th><th>Username</th><th>Email</th><th>Phone</th><th>Role</th><th>Class</th><th>Subject</th><th>Status</th><th>Actions</th></tr></thead><tbody id="staff-rows"><tr><td colspan="10">Loading…</td></tr></tbody></table></div></section></main><script>
const form=document.querySelector('#staff-form'),result=document.querySelector('#staff-result'),rows=document.querySelector('#staff-rows'),password=document.querySelector('#staff-password');const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const role=value=>String(value??'').replaceAll('_',' ');const secureIndex=max=>{const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);return bytes[0]%max};const generated=()=>{const upper='ABCDEFGHJKLMNPQRSTUVWXYZ',lower='abcdefghijkmnopqrstuvwxyz',number='23456789',symbol='!@#$%^&*()-_=+';const all=upper+lower+number+symbol;const values=[upper[secureIndex(upper.length)],lower[secureIndex(lower.length)],number[secureIndex(number.length)],symbol[secureIndex(symbol.length)]];while(values.length<16)values.push(all[secureIndex(all.length)]);for(let i=values.length-1;i>0;i--){const j=secureIndex(i+1);[values[i],values[j]]=[values[j],values[i]]}return values.join('')};document.querySelector('#generate-password').onclick=()=>{password.value=generated();password.type='text'};document.querySelector('#toggle-password').onclick=e=>{password.type=password.type==='password'?'text':'password';e.target.textContent=password.type==='password'?'Show':'Hide'};async function options(){for(const [url,name] of [['/api/classes','assignedClassId'],['/api/subjects','assignedSubjectId']]){try{const r=await fetch(url);if(!r.ok)continue;const data=await r.json();const items=data.classes||data.subjects||[];const select=form.elements[name];items.forEach(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=item.name||item.subjectName||item.code||item.id;select.append(option)})}catch{}}}async function load(){const response=await fetch('/api/staff-management');if(!response.ok){rows.innerHTML='<tr><td colspan="10">Unable to load Staff Directory.</td></tr>';return}const data=await response.json();const render=staff=>rows.innerHTML=staff.filter(item=>{const q=document.querySelector('#staff-search').value.trim().toLowerCase();return !q||[item.fullName,item.staffId,item.username,item.email,item.roleKey].some(value=>String(value??'').toLowerCase().includes(q))}).map(item=>`<tr><td>${esc(item.fullName)}</td><td>${esc(item.staffId)}</td><td>${esc(item.username)}</td><td>${esc(item.email)}</td><td>${esc(item.phone)}</td><td>${esc(role(item.primaryRole))}</td><td>${esc(item.assignedClassIds?.[0])}</td><td>${esc(item.assignedSubjectIds?.[0])}</td><td><span class="badge">${esc(item.accountStatus)}</span></td><td>${item.accountStatus==='ACTIVE'?`<button class="text-button" data-action="reset-credentials" data-id="${esc(item.id)}">Reset Password</button><button class="text-button" data-action="disable" data-id="${esc(item.id)}">Remove</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="10">No staff records yet.</td></tr>';render(Array.isArray(data.staff)?data.staff:[])}form.onsubmit=async event=>{event.preventDefault();const button=form.querySelector('button[type=submit]');button.disabled=true;result.textContent='Creating secure credentials…';try{const response=await fetch('/api/staff-management',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await response.json();result.textContent=response.ok?`Username: ${data.staff.username} · Temporary password: ${data.temporaryPassword} · Share securely.`:(data.error||'Unable to register staff.');if(response.ok){form.reset();await load()}}finally{button.disabled=false}};rows.onclick=async event=>{const id=event.target.dataset.id,action=event.target.dataset.action;if(!id)return;if(!confirm(action==='disable'?'Remove/deactivate this staff account? Existing historical records will be preserved.':'Generate a replacement password for this staff account?'))return;const response=await fetch(`/api/staff-management/${encodeURIComponent(id)}/${action}`,{method:'POST'}),data=await response.json();result.textContent=response.ok?(data.temporaryPassword?`Username: ${data.username} · New password: ${data.temporaryPassword} · Share securely.`:'Staff account updated.'):(data.error||'The staff action failed.');await load()};document.querySelector('#staff-search').oninput=()=>load();options();load();
</script></body></html>
