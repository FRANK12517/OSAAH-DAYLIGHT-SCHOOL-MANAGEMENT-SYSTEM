<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Management | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">STAFF MANAGEMENT</p><h1>Staff Management</h1><p class="muted">Register and manage authorized school staff. Temporary credentials are shown only once.</p><section class="card"><h2>Register Staff</h2><form id="staff-form" class="stack-form"><label>Full Name<input name="fullName" required></label><label>Staff ID<input name="staffId" required></label><label>Phone Number<input name="phone" type="tel"></label><label>Email Address<input name="email" type="email"></label><label>Primary Role<select name="primaryRole" required><option value="CLASSROOM_TEACHER">Classroom Teacher</option><option value="HEADTEACHER">Headteacher</option><option value="ASSISTANT_HEADTEACHER">Assistant Headteacher</option><option value="ACCOUNTANT">Accountant</option></select></label><label>Assigned Class<input name="assignedClassId"></label><label>Assigned Subject<input name="assignedSubjectId"></label><button class="primary-button" type="submit">Register Staff</button><p id="staff-result" class="muted" role="status"></p></form></section><section class="card"><h2>Staff Directory</h2><div class="responsive-table"><table><thead><tr><th>Full Name</th><th>Staff ID</th><th>Username</th><th>Role</th><th>Class</th><th>Subject</th><th>Status</th><th>Actions</th></tr></thead><tbody id="staff-rows"><tr><td colspan="8">Loading…</td></tr></tbody></table></div></section></main><script>
const form=document.querySelector('#staff-form');const result=document.querySelector('#staff-result');const rows=document.querySelector('#staff-rows');const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const role=value=>String(value??'').replaceAll('_',' ');
async function load(){const response=await fetch('/api/staff-management');if(!response.ok){rows.innerHTML='<tr><td colspan="8">School Administrator access is required.</td></tr>';return}const data=await response.json();rows.innerHTML=data.staff.map(item=>`<tr><td>${esc(item.fullName)}</td><td>${esc(item.staffId)}</td><td>${esc(item.username)}</td><td>${esc(role(item.primaryRole))}</td><td>${esc(item.assignedClassIds[0])}</td><td>${esc(item.assignedSubjectIds[0])}</td><td><span class="badge">${esc(item.accountStatus)}</span></td><td>${item.accountStatus==='ACTIVE'?`<button class="text-button" data-action="disable" data-id="${esc(item.id)}">Disable</button><button class="text-button" data-action="revoke" data-id="${esc(item.id)}">Revoke</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="8">No staff records yet.</td></tr>'}form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button[type=submit]');button.disabled=true;result.textContent='Creating secure credentials…';try{const response=await fetch('/api/staff-management',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await response.json();if(!response.ok){result.textContent=data.error??'Unable to register staff.';return}result.textContent=`Username: ${data.staff.username} · Temporary password: ${data.temporaryPassword} · Share securely and require a password change.`;form.reset();await load()}finally{button.disabled=false}});rows.addEventListener('click',async event=>{const id=event.target.dataset.id;const action=event.target.dataset.action;if(!id)return;await fetch(`/api/staff-management/${encodeURIComponent(id)}/${action}`,{method:'POST'});await load()});load();
</script></body></html>
