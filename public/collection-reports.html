<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection Reports | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">FEE HUB</p><h1>Collection Reports</h1><form id="filters" class="card"><label>Period<select name="period"><option>DAILY</option><option>WEEKLY</option><option>MONTHLY</option><option>TERM</option><option>ACADEMIC_YEAR</option></select></label><label>Date<input name="date" type="date"></label><label>Type<select name="collection_type" id="collectionType"><option value="">All types</option><option value="EXTRA_CLASS">Extra Classes</option><option value="CANTEEN">Canteen</option></select></label><label>Collection term/period<select name="collection_period" id="collectionPeriod"><option value="">All periods</option></select></label><button>Run report</button></form><p id="status" class="muted"></p><section id="result" class="report-grid"></section></main>
<script>
const filters = document.querySelector('#filters'), status = document.querySelector('#status'), result = document.querySelector('#result'), type = document.querySelector('#collectionType'), period = document.querySelector('#collectionPeriod');
function periods(value) { return value === 'CANTEEN' ? ['1st Term', '2nd Term', '3rd Term'] : value === 'EXTRA_CLASS' ? ['1st Term', '2nd Term', '3rd Term', 'Vacation Classes'] : ['1st Term', '2nd Term', '3rd Term', 'Vacation Classes']; }
function refreshPeriods() { period.innerHTML = '<option value="">All periods</option>' + periods(type.value).map(value => `<option>${value}</option>`).join(''); }
type.addEventListener('change', refreshPeriods); refreshPeriods();
filters.addEventListener('submit', async event => { event.preventDefault(); const query = new URLSearchParams(new FormData(event.currentTarget)); const response = await fetch('/api/fees/collections/reports?' + query); const data = await response.json(); if (!response.ok) { status.textContent = data.error || 'Unable to load report'; return; } status.textContent = 'Report loaded'; result.innerHTML = `<article class="card"><strong>Received</strong><span>GH₵ ${(Number(data.totalCollectedMinor || 0) / 100).toFixed(2)}</span><small>${data.count || 0} records</small><div>${(data.collection_period_breakdown || []).map(item => `${item.collection_period}: ${item.total_received_minor}`).join(' · ') || 'No period data'}</div></article>`; });
</script></body></html>
