<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection Reports | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"><style>.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;align-items:end}.filters label{min-width:0}.filters select,.filters input{width:100%;box-sizing:border-box}.wide{grid-column:1/-1}.table-wrap{overflow:auto}.report-table{width:100%;border-collapse:collapse}.report-table th,.report-table td{padding:.55rem;text-align:left;border-bottom:1px solid #d9e2ec;white-space:nowrap}.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem;margin-top:1rem}.total{display:flex;flex-direction:column;gap:.25rem}</style></head>
<body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">FEE HUB</p><h1>Collection Reports</h1>
<form id="filters" class="card filters"><label>Period<select name="period"><option value="DAILY">Daily</option><option value="WEEKLY">Weekly</option><option value="MONTHLY">Monthly</option><option value="TERM">Termly</option><option value="ACADEMIC_YEAR">Academic Year</option><option value="CUSTOM">Custom Date Range</option></select></label><label>Date<input name="date" type="date"></label><label>End date<input name="endDate" type="date"></label><label>Academic Year<select name="academic_year_id" id="academicYear"><option value="">All academic years</option></select></label><label>Term/Period<select name="collection_period" id="collectionPeriod"><option value="">All periods</option></select></label><label>Class<select name="class_id" id="classId"><option value="">All classes</option></select></label><label>Collection Type<select name="collection_type" id="collectionType"><option value="">All types</option></select></label><label id="customTypeLabel" hidden>Specify Fee Type<input name="custom_fee_type_name" id="customType" placeholder="e.g. Cultural Festival Levy"></label><button class="wide">Run report</button></form>
<p id="status" class="muted"></p><section id="result"></section></main>
<script>
const filters=document.querySelector('#filters'),status=document.querySelector('#status'),result=document.querySelector('#result'),type=document.querySelector('#collectionType'),period=document.querySelector('#collectionPeriod'),customTypeLabel=document.querySelector('#customTypeLabel');
const periodOptions=['1st Term','2nd Term','3rd Term','Vacation Classes'];
const money=n=>`GH₵ ${(Number(n||0)/100).toFixed(2)}`;
function refreshPeriods(){const vacation=type.value==='VACATION_CLASSES'||type.value==='EXTRA_CLASSES';period.innerHTML='<option value="">All periods</option>'+periodOptions.filter(p=>p!=='Vacation Classes'||vacation).map(p=>`<option value="${p}">${p}</option>`).join('');customTypeLabel.hidden=type.value!=='OTHER';}
async function loadOptions(){try{const [typesResponse,optionsResponse]=await Promise.all([fetch('/api/fees/types'),fetch('/api/fee-setup/options')]);const types=await typesResponse.json();const options=await optionsResponse.json();for(const item of types.feeTypes||[]) type.insertAdjacentHTML('beforeend',`<option value="${item.code}">${item.displayName||item.name}</option>`);for(const item of options.academicYears||[]) academicYear.insertAdjacentHTML('beforeend',`<option value="${item.id}">${item.name||item.id}</option>`);for(const item of options.classes||[]) classId.insertAdjacentHTML('beforeend',`<option value="${item.id}">${item.name}</option>`);refreshPeriods();}catch(error){status.textContent='Unable to load report filters.';}}
type.addEventListener('change',refreshPeriods);filters.period.addEventListener('change',()=>{filters.endDate.hidden=filters.period.value!=='CUSTOM';});filters.endDate.hidden=true;
filters.addEventListener('submit',async event=>{event.preventDefault();const query=new URLSearchParams(new FormData(filters));if(type.value==='OTHER'&&customType.value.trim())query.set('custom_fee_type_name',customType.value.trim());try{const response=await fetch('/api/fees/collections/reports?'+query);const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to load report');const breakdown=data.collection_type_breakdown||[];result.innerHTML=`<section class="card"><h2>Report results</h2><div class="totals"><div class="total"><strong>Grand total</strong><span>${money(data.totalCollectedMinor)}</span><small>${data.count||0} transactions</small></div>${breakdown.map(item=>`<div class="total"><strong>${item.collection_type||'Unspecified'}</strong><span>${money(item.total_received_minor)}</span><small>${item.record_count} transactions</small></div>`).join('')}</div><div class="table-wrap"><table class="report-table"><thead><tr><th>Date</th><th>Reference</th><th>Type</th><th>Class</th><th>Academic Year</th><th>Term</th><th>Amount</th></tr></thead><tbody>${(data.rows||[]).map(row=>`<tr><td>${row.collection_date||''}</td><td>${row.receipt_number||row.payment_reference||row.id||''}</td><td>${row.custom_fee_type_name||row.collection_type||''}</td><td>${row.class_id||''}</td><td>${row.academic_year_id||''}</td><td>${row.collection_period||row.term_id||''}</td><td>${money(row.amount_received_minor??row.amount)}</td></tr>`).join('')||'<tr><td colspan="7">No collections matched the selected filters.</td></tr>'}</tbody></table></div></section>`;status.textContent='Report loaded from the server.';}catch(error){status.textContent=error.message;}});
loadOptions();
</script></body></html>
