<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection Reports | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">FEE HUB</p><h1>Collection Reports</h1><form id="filters" class="card"><label>Period<select name="period"><option>DAILY</option><option>WEEKLY</option><option>MONTHLY</option><option>TERM</option><option>ACADEMIC_YEAR</option></select></label><label>Date<input name="date" type="date"></label><label>Type<select name="collection_type"><option value="">All types</option><option>EXTRA_CLASS</option><option>CANTEEN</option></select></label><button>Run report</button></form><p id="status" class="muted"></p><section id="result" class="report-grid"></section></main><script>filters.addEventListener('submit',async e=>{e.preventDefault();const q=new URLSearchParams(new FormData(e.currentTarget));const r=await fetch('/api/fees/collections/reports?'+q);const j=await r.json();if(!r.ok){status.textContent=j.error||'Unable to load report';return}status.textContent='Report loaded';result.innerHTML=`<article class="card"><strong>Received</strong><span>GH₵ ${(Number(j.totalCollectedMinor||0)/100).toFixed(2)}</span><small>${j.count||0} records</small><div>${(j.collection_type_breakdown||[]).map(x=>`${x.collection_type}: ${x.total_received_minor}`).join(' · ')}</div></article>`});</script></body></html>
