<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System &amp; Information | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">SYSTEM &amp; INFORMATION</p><h1 id="title">System &amp; Information</h1><p id="summary" class="muted">Loading authorized system data…</p><section class="card"><h2>System view</h2><p id="detail" class="muted">No records are currently available.</p></section></main><script>const labels={'/compliance':'Compliance & Regulatory','/documents':'Document Management','/privacy':'Privacy & Data Protection','/compliance/nasia':'NaSIA','/users/roles':'Roles','/compliance/ntc':'NTC','/users/permissions':'Permissions','/compliance/fire-safety':'Fire Safety','/settings/audit-logs':'Audit Logs','/compliance/emis-census':'EMIS / School Census','/settings/sessions':'Sessions','/compliance/inspections':'Inspections','/settings/backups':'Backups','/compliance/calendar':'Compliance Calendar','/documents/repository':'Document Repository'};const label=labels[location.pathname]??'System & Information';document.title=`${label} | OsaaH Daylight`;document.querySelector('#title').textContent=label;fetch('/api/compliance').then(async r=>{const d=await r.json();document.querySelector('#summary').textContent=r.ok?`${label} is connected to authorized compliance and document services.`:'System data is currently unavailable for this role.';document.querySelector('#detail').textContent=r.ok?'Live protected system data is available through existing compliance/document services.':(d.error??'No records are currently available.')}).catch(()=>{document.querySelector('#summary').textContent='System data is currently unavailable.'})</script></body></html>
