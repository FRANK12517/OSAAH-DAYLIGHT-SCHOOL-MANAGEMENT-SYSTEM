<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Alerts | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">ATTENDANCE MANAGEMENT</p><h1>Attendance Alerts</h1><p class="muted">Authoritative absenteeism alerts for enrolled students. Explicit sample records are excluded.</p><section class="card"><div class="responsive-table"><table><thead><tr><th>Date</th><th>Permanent Student ID</th><th>Student</th><th>Class</th><th>Status</th></tr></thead><tbody id="alert-rows"><tr><td colspan="5">Loading attendance alerts…</td></tr></tbody></table></div></section><p id="alert-status" class="muted" role="status"></p></main><script>const rows=document.querySelector('#alert-rows'),status=document.querySelector('#alert-status');const esc=(v)=>{const e=document.createElement('span');e.textContent=v??'';return e.innerHTML};(async()=>{const r=await fetch('/api/attendance/alerts'),data=await r.json();if(!r.ok){status.textContent=data.error??'Attendance alerts could not be loaded.';rows.innerHTML='';return}rows.innerHTML=data.alerts.length?data.alerts.map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.permanentStudentId)}</td><td>${esc(a.studentName)}</td><td>${esc(a.classId)}</td><td>${esc(a.status)}</td></tr>`).join(''):'<tr><td colspan="5">No absenteeism alerts at this time.</td></tr>';status.textContent=`${data.alerts.length} alert${data.alerts.length===1?'':'s'} loaded.`})()</script></body></html>
