<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Score Entry | Osaah Daylight</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="form-page">
    <a class="text-button" href="/">← Dashboard</a>
    <p class="eyebrow">EXAMINATIONS &amp; RESULTS</p>
    <h1>Score Entry</h1>
    <p class="muted">Select the academic context, then enter continuous assessment and examination scores. Saved scores are server-side records.</p>
    <section class="card">
      <form id="score-context" class="score-entry-controls">
        <label>Academic Year<input name="academicYear" value="2026/2027" required></label>
        <label>Term<select name="term" required><option selected>First Term</option><option>Second Term</option><option>Third Term</option></select></label>
        <label>Class<select name="classId" required><option value="">Select Class</option></select></label>
        <label>Subject<select name="subjectId" required disabled><option value="">Select Class First</option></select></label>
        <button class="primary-button" type="submit">Load Students</button>
      </form>
      <p id="status" class="muted" role="status" aria-live="polite"></p>
    </section>
    <section class="card">
      <div class="table-scroll score-grid">
        <table>
          <thead><tr><th>OSAAH STUDENT INDEX</th><th>STUDENT NAME</th><th>CA / 50</th><th>Exam / 50</th><th>TOTAL</th><th>GRADE</th><th>SAVE STATUS</th></tr></thead>
          <tbody id="students"><tr><td colspan="7">Choose a class and subject.</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="/score-entry.js"></script>
</body>
</html>
