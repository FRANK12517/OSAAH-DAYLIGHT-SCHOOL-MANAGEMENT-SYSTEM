<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Score Entry | Osaah Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">EXAMINATIONS &amp; RESULTS</p><h1>Score Entry</h1><p class="muted">Select the academic context, then enter continuous assessment and examination scores. Saved scores are server-side records.</p><section class="card"><form id="score-context"><label>Academic Year<input name="academicYear" value="2026/2027" required></label><label>Term<select name="term"><option>First Term</option><option>Second Term</option><option>Third Term</option></select></label><label>Class<select name="classId" required></select></label><label>Subject<select name="subjectId" required></select></label><button class="primary-button" type="submit">Load Students</button></form><p id="status" class="error" role="status"></p></section><section class="card"><div class="table-scroll score-grid"><table><thead><tr><th>Osaah Index</th><th>Student</th><th>CA / 50</th><th>Exam / 50</th><th>Total</th><th>Save</th></tr></thead><tbody id="students"><tr><td colspan="6">Choose a class and subject.</td></tr></tbody></table></div></section></main><script src="/score-entry.js"></script></body></html>
