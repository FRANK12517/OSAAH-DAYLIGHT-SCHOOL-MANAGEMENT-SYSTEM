<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Attendance | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">STAFF &amp; HR</p><h1>Staff Attendance</h1><p class="muted">Mark attendance for active school employees within the selected academic period.</p><section class="card"><label for="attendance-academic-year">Academic Year</label><select id="attendance-academic-year" required><option value="">Loading academic years…</option></select><label for="attendance-term">Term</label><select id="attendance-term" required><option value="">Choose a term</option><option>1st Term</option><option>2nd Term</option><option>3rd Term</option></select><label for="attendance-date">Date</label><input id="attendance-date" type="date" required><div class="responsive-table"><table><thead><tr><th>Employee ID</th><th>Staff member</th><th>Role</th><th>Attendance</th></tr></thead><tbody id="staff-register"><tr><td colspan="4">Loading staff register…</td></tr></tbody></table></div><button id="save-attendance" type="button">Save staff attendance</button></section><p id="staff-status" class="muted" role="status"></p></main><script>
const host=document.querySelector('#staff-register'),status=document.querySelector('#staff-status'),year=document.querySelector('#attendance-academic-year'),term=document.querySelector('#attendance-term'),date=document.querySelector('#attendance-date'),save=document.querySelector('#save-attendance');date.value=new Date().toISOString().slice(0,10);const esc=v=>{const e=document.createElement('span');e.textContent=v??'';return e.innerHTML};
(async()=>{const options=await fetch('/api/attendance/options'),optionData=await options.json();if(!options.ok){status.textContent=optionData.error??'Attendance options could not be loaded.';save.disabled=true;return}year.innerHTML='<option value="">Choose an academic year</option>'+optionData.academicYears.map(x=>`<option value="${esc(x.name??x.id)}">${esc(x.name??x.id)}</option>`).join('');term.innerHTML='<option value="">Choose a term</option>'+optionData.terms.map(x=>`<option value="${esc(x.name??x.id)}">${esc(x.name??x.id)}</option>`).join('');const r=await fetch('/api/attendance/staff'),data=await r.json();if(!r.ok){status.textContent=data.error??'Staff attendance could not be loaded.';save.disabled=true;return}host.innerHTML=data.staff.length?data.staff.map(s=>`<tr><td>${esc(s.employeeId)}</td><td>${esc(s.fullName)}</td><td>${esc(s.roleKey||'Staff')}</td><td><select data-staff="${esc(s.id)}"><option value="CHECK_IN">Present / check in</option><option value="LATE">Late</option><option value="ABSENT">Absent</option><option value="CHECK_OUT">Check out</option></select></td></tr>`).join(''):'<tr><td colspan="4">No active staff records found.</td></tr>';save.disabled=!data.staff.length;status.textContent=`${data.staff.length} active staff member${data.staff.length===1?'':'s'} loaded.`})();
save.addEventListener('click',async()=>{if(!date.value||!year.value||!term.value){status.textContent='Select an Academic Year, Term, and date.';return}save.disabled=true;const rows=[...host.querySelectorAll('select[data-staff]')];try{const results=await Promise.all(rows.map(async select=>{const r=await fetch('/api/attendance/staff',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({staffId:select.dataset.staff,academicYear:year.value,term:term.value,date:date.value,type:select.value})});const data=await r.json();if(!r.ok)throw new Error(data.error??'Attendance could not be saved.');return data}));status.textContent=`Saved attendance for ${results.length} staff member${results.length===1?'':'s'}.`}catch(error){status.textContent=error.message}finally{save.disabled=!rows.length}})
</script></body></html>
