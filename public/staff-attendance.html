<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Attendance | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">STAFF &amp; HR</p><h1>Staff Attendance</h1><p class="muted">Mark attendance for active school employees. Student registers are managed separately.</p><section class="card"><label for="attendance-date">Date</label><input id="attendance-date" type="date" required><div class="responsive-table"><table><thead><tr><th>Employee ID</th><th>Staff member</th><th>Role</th><th>Attendance</th></tr></thead><tbody id="staff-register"><tr><td colspan="4">Loading staff register…</td></tr></tbody></table></div><button id="save-attendance" type="button">Save staff attendance</button></section><p id="staff-status" class="muted" role="status"></p></main><script>const host=document.querySelector('#staff-register'),status=document.querySelector('#staff-status'),date=document.querySelector('#attendance-date'),save=document.querySelector('#save-attendance');date.value=new Date().toISOString().slice(0,10);const esc=v=>{const e=document.createElement('span');e.textContent=v??'';return e.innerHTML};(async()=>{const r=await fetch('/api/attendance/staff'),data=await r.json();if(!r.ok){status.textContent=data.error??'Staff attendance could not be loaded.';save.disabled=true;return}host.innerHTML=data.staff.length?data.staff.map(s=>`<tr><td>${esc(s.employeeId)}</td><td>${esc(s.fullName)}</td><td>${esc(s.roleKey||'Staff')}</td><td><select data-staff="${esc(s.id)}"><option value="CHECK_IN">Present / check in</option><option value="LATE">Late</option><option value="ABSENT">Absent</option><option value="CHECK_OUT">Check out</option></select></td></tr>`).join(''):'<tr><td colspan="4">No active staff records found.</td></tr>';save.disabled=!data.staff.length;status.textContent=`${data.staff.length} active staff member${data.staff.length===1?'':'s'} loaded.`})();save.addEventListener('click',async()=>{if(!date.value){status.textContent='Select an attendance date.';return}save.disabled=true;const rows=[...host.querySelectorAll('select[data-staff]')];try{const results=await Promise.all(rows.map(async select=>{const r=await fetch('/api/attendance/staff',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({staffId:select.dataset.staff,date:date.value,type:select.value})});const data=await r.json();if(!r.ok)throw new Error(data.error??'Attendance could not be saved.');return data}));status.textContent=`Saved attendance for ${results.length} staff member${results.length===1?'':'s'}.`}catch(error){status.textContent=error.message}finally{save.disabled=!rows.length}})</script></body></html>
