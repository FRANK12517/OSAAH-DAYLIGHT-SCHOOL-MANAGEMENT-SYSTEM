<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mock Score Entry | Osaah Daylight</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<main class="form-page">
  <a class="text-button" href="/">← Dashboard</a>
  <p class="eyebrow">EXAMINATIONS &amp; RESULTS</p>
  <h1>Mock Score Entry</h1>
  <p class="muted">Mock examinations are available only for JHS 1, JHS 2, and JHS 3. Enter one Total Score / 100; terminal score components do not apply.</p>
  <section class="card">
    <form id="mock-context">
      <label>Academic Year<select name="academicYear" required></select></label>
      <label>Term<select name="term" required></select></label>
      <label>Mock Examination<select name="mockLabel" required></select></label>
      <label>Class<select name="classId" required></select></label>
      <label>Subject<select name="subjectId" required></select></label>
      <label><input name="sampleMode" type="checkbox" value="true"> Sample / Test Mode</label>
      <button class="primary-button" type="submit">Load Students</button>
    </form>
    <p id="status" class="error" role="status"></p>
  </section>
  <section class="card"><div class="table-scroll mock-score-grid"><table><thead><tr><th>OSAAH STUDENT INDEX</th><th>STUDENT NAME</th><th>TOTAL SCORE / 100</th><th>GRADE</th><th>SAVE STATUS</th></tr></thead><tbody id="students"><tr><td colspan="5">Choose a JHS mock context.</td></tr></tbody></table></div></section>
</main>
<script src="/mock-score-entry.js"></script>
</body>
</html>
