<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admission Prospectus Management | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="form-page"><a class="text-button" href="/admissions">← Admissions</a><p class="eyebrow">ADMISSIONS</p><h1>Admission Prospectus Management</h1><p class="muted">Create a draft for a class and academic year, review it, then publish it for parents.</p>
<section class="card"><form id="prospectus-form"><input type="hidden" name="id"><label>Academic Year<select name="academicYearId" required></select></label><label>Class<select name="classId" required></select></label><label>Prospectus content <small>HTML formatting is sanitized before storage.</small><textarea name="content" rows="16" required></textarea></label><fieldset><legend>Optional uploaded document</legend><label>File name<input name="documentName" placeholder="prospectus.pdf"></label><label>MIME type<input name="documentType" placeholder="application/pdf"></label><label>File size in bytes<input name="documentSize" type="number" min="0"></label><label>Secure file URL or storage reference<input name="documentUrl"></label></fieldset><div class="button-row"><button class="primary-button" type="submit">Save Draft</button><button class="text-button" id="template" type="button">Use PDF starter template</button><button class="text-button" id="upload" type="button">Upload / Replace Document</button></div><p id="status" class="error" role="status"></p></form></section>
<section class="card"><h2>Prospectuses</h2><div class="table-scroll"><table><thead><tr><th>Class</th><th>Academic Year</th><th>Status</th><th>Document</th><th>Updated</th><th>Actions</th></tr></thead><tbody id="records"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section></main>
<script>
const form=document.querySelector('#prospectus-form'),status=document.querySelector('#status'),records=document.querySelector('#records');let template='';const esc=(v)=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(url,options){const r=await fetch(url,options);const b=await r.json().catch(()=>({error:'Request failed.'}));if(!r.ok)throw Error(b.error||'Request failed.');return b;}async function load(){const o=await api('/api/admission-prospectus/options');form.elements.classId.innerHTML=o.classes.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');form.elements.academicYearId.innerHTML=o.academicYears.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')||'<option value="">Enter a configured academic year below when saving</option>';template=(await api('/api/admission-prospectus/template')).template;await list();}async function list(){const d=await api('/api/admission-prospectus');records.innerHTML=d.prospectuses.map(x=>`<tr><td>${esc(x.className)}</td><td>${esc(x.academicYear)}</td><td>${esc(x.status)}</td><td>${esc(x.documentName||'Rich text')}</td><td>${esc(x.updatedAt)}</td><td><button class="text-button" data-edit="${esc(x.id)}">Edit</button> ${x.status==='PUBLISHED'?`<button class="text-button" data-unpublish="${esc(x.id)}">Unpublish</button>`:`<button class="text-button" data-publish="${esc(x.id)}">Publish</button>`}</td></tr>`).join('')||'<tr><td colspan="6">No prospectuses created yet.</td></tr>';}form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Saving…';try{const d=Object.fromEntries(new FormData(form));const id=d.id;delete d.id;const saved=await api(id?`/api/admission-prospectus/${id}`:'/api/admission-prospectus',{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({classId:d.classId,academicYearId:d.academicYearId,content:d.content})});if(!id)form.elements.id.value=saved.id;status.textContent='Draft saved.';await list();}catch(err){status.textContent=err.message;}});document.querySelector('#template').addEventListener('click',()=>{form.elements.content.value=template;});document.querySelector('#upload').addEventListener('click',async()=>{const id=form.elements.id.value;if(!id){status.textContent='Save the draft before uploading a document.';return;}try{await api(`/api/admission-prospectus/${id}/${form.elements.documentName.value?'replace':'document'}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({documentName:form.elements.documentName.value,documentType:form.elements.documentType.value,documentSize:form.elements.documentSize.value,documentUrl:form.elements.documentUrl.value})});status.textContent='Document saved.';await list();}catch(err){status.textContent=err.message;}});records.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.edit){const x=(await api('/api/admission-prospectus/'+b.dataset.edit)).prospectus;form.elements.id.value=x.id;form.elements.classId.value=x.classId;form.elements.academicYearId.value=x.academicYearId;form.elements.content.value=x.content||'';form.elements.documentName.value=x.documentName||'';form.elements.documentType.value=x.documentType||'';form.elements.documentSize.value=x.documentSize||'';form.elements.documentUrl.value=x.documentUrl||'';status.textContent='Loaded prospectus for editing.';}if(b.dataset.publish||b.dataset.unpublish){const action=b.dataset.publish?'publish':'unpublish';await api(`/api/admission-prospectus/${b.dataset[action]}/${action}`,{method:'POST'});await list();status.textContent=`Prospectus ${action}ed.`;}}catch(err){status.textContent=err.message;}});load().catch(err=>status.textContent=err.message);
</script></body></html>
