<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Profile | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">STUDENTS MANAGEMENT</p><h1>New Student Profile</h1><p class="muted">Student ID is generated once and remains unchanged throughout the school history.</p><form class="student-form"><fieldset><legend>Identity</legend><label>First name<input name="firstName" required></label><label>Middle name<input name="middleName"></label><label>Surname<input name="surname" required></label><label>Preferred name<input name="preferredName"></label><label>Gender<select name="gender"><option></option><option>Female</option><option>Male</option></select></label><label>Date of birth<input type="date" name="dateOfBirth"></label></fieldset><fieldset><legend>School Placement</legend><label>Class<select name="class"><option>KG1</option><option>KG2</option><option>Primary 1</option><option>Primary 2</option><option>Primary 3</option><option>Primary 4</option><option>Primary 5</option><option>Primary 6</option><option>JHS 1</option><option>JHS 2</option><option>JHS 3</option></select></label><label>Stream<input name="stream"></label><label>House<input name="house"></label><label>Admission type<input name="admissionType"></label></fieldset><fieldset><legend>Family Contacts</legend><label>Father telephone<input type="tel" name="fatherPhone"></label><label>Mother telephone<input type="tel" name="motherPhone"></label><label>Guardian relationship<input name="relationship"></label><label>Emergency telephone<input type="tel" name="emergencyPhone"></label><label>Address<textarea name="address"></textarea></label></fieldset><fieldset><legend>Restricted Health</legend><p class="muted">Visible only to authorized health personnel.</p><label>Allergies<textarea name="allergies"></textarea></label><label>Medical notes<textarea name="healthNotes"></textarea></label></fieldset><button class="primary-button" type="submit">Create Student Profile</button></form></main></body></html>
