<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Management | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">STUDENT MANAGEMENT</p><h1 id="title">Student Management</h1><p id="summary" class="muted">Loading authorized records…</p><section class="report-grid" id="metrics"></section><section class="card"><h2 id="section-title">Records</h2><div class="responsive-table"><table><thead><tr><th>Record</th><th>Status</th><th>Permanent Student ID</th><th>Class</th></tr></thead><tbody id="rows"><tr><td colspan="4">Loading…</td></tr></tbody></table></div></section></main><script>
const views={'/students':'Student Profiles','/students/search':'Student Search','/students/directory':'Student Directory','/admissions/enquiries':'Enquiries','/students/ids':'Student IDs','/admissions/applications':'Applications','/students/transfers':'Transfers','/admissions/review':'Application Review','/students/alumni':'Alumni','/admissions/offers':'Admission Offers','/admissions/enrollment':'Enrollment'};const path=location.pathname,label=views[path]??'Student Management';document.title=`${label} | OsaaH Daylight`;document.querySelector('#title').textContent=label;document.querySelector('#section-title').textContent=label+' records';const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){let endpoint=path.startsWith('/admissions/')?'/api/admission-applications':'/api/students/search?q=';let response=await fetch(endpoint);let data=response.ok?await response.json():{};let records=data.applications??data.students??[];document.querySelector('#summary').textContent=response.ok?`${records.length} authorized ${label.toLowerCase()} record${records.length===1?'':'s'} available.`:'Authorized student management access is required.';document.querySelector('#metrics').innerHTML=`<article class="card"><strong>${records.length}</strong><span>${esc(label)} records</span></article>`;document.querySelector('#rows').innerHTML=records.length?records.map(item=>`<tr><td>${esc(item.applicationNumber||item.fullName||item.name||item.id)}</td><td>${esc(item.status||item.state||'ACTIVE')}</td><td>${esc(item.permanentStudentId||item.permanent_student_id||'Not recorded')}</td><td>${esc(item.classId||item.classAssigned||'Not recorded')}</td></tr>`).join(''):'<tr><td colspan="4">No records are currently available.</td></tr>'}load();
</script></body></html>
