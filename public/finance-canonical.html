<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Finance | OsaaH Daylight</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .finance-toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:18px 0}.finance-toolbar label{min-width:220px;flex:1}.finance-toolbar input,.finance-toolbar select{width:100%}.finance-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}.finance-kpi{padding:16px;border:1px solid #d7dee7;border-radius:8px;background:#fff}.finance-kpi strong{display:block;font-size:1.35rem;color:#102a43}.finance-kpi span{display:block;margin-top:5px;color:#52606d;font-size:.85rem}.finance-table{width:100%;border-collapse:collapse;background:#fff}.finance-table th,.finance-table td{padding:10px 12px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}.finance-table th{color:#334e68;background:#f5f7fa;font-size:.82rem;text-transform:uppercase;letter-spacing:.03em}.finance-table td.num{text-align:right;white-space:nowrap}.finance-table td small{display:block;color:#627d98}.finance-table-wrap{overflow:auto;border:1px solid #d7dee7;border-radius:8px}.finance-state{padding:18px;border:1px solid #d7dee7;border-radius:8px;background:#fff}.finance-state.error{border-color:#c05640;background:#fff7f5}.finance-state.deferred{border-color:#d4a72c;background:#fffaf0}.finance-actions{display:flex;gap:8px;flex-wrap:wrap}.finance-actions a{display:inline-block}.finance-actions button{font:inherit}.finance-filter-note{margin:0 0 12px;color:#627d98;font-size:.9rem}
  </style>
</head>
<body>
<main class="form-page" id="finance-canonical">
  <a class="text-button" href="/">← Dashboard</a>
  <p class="eyebrow">FEE HUB · FINANCE</p>
  <h1 id="title">Finance</h1>
  <p id="description" class="muted">Loading authorized financial data…</p>
  <section id="view" aria-live="polite"></section>
</main>
<script>
(() => {
  const views = {
    '/fees': { name:'Fees', description:'Fee obligations, invoices, payments, and balances', id:'fees-overview', loader:'overview' },
    '/finance': { name:'Finance', description:'Verified financial position from server-calculated records', id:'finance-overview', loader:'overview' },
    '/fees/invoices': { name:'Invoices & Receipts', description:'Persisted invoice and receipt register', id:'invoices-receipts', loader:'invoices' },
    '/finance/reports': { name:'Finance Reports', description:'Financial reporting and reconciliation', id:'finance-reports', loader:'report' },
    '/fees/structure': { name:'Fee Structure', description:'Published fee structures from the canonical fee service', id:'fee-structure', loader:'structures' },
    '/fees/scholarships': { name:'Scholarships', description:'Scholarship awards and concessions', id:'scholarships', loader:'deferred' },
    '/fees/admission-structures': { name:'Admission Fee Structures', description:'Admission fee structures', id:'admission-fee-structures', loader:'admission' },
    '/fees/students': { name:'Student Fees', description:'Student invoices, payments, and outstanding balances', id:'student-fees', loader:'studentFees' },
    '/finance/income': { name:'Income', description:'Durable general/non-fee income register', id:'income', loader:'income' },
    '/fees/payments': { name:'Payments', description:'Persisted payment transactions and collection status', id:'payments', loader:'payments' },
    '/finance/expenses': { name:'Expenses', description:'Durable school expenditure register linked to approved budgets', id:'expenses', loader:'expenses' },
    '/fees/receipts': { name:'Receipts', description:'Canonical receipt register and official receipt actions', id:'receipts', loader:'receipts' },
    '/finance/receipts': { name:'Receipts', description:'Canonical receipt register and official receipt actions', id:'receipts', loader:'receipts' },
    '/finance/cashbook': { name:'Cashbook', description:'Read-only server-derived financial ledger and reconciliation', id:'cashbook', loader:'cashbook' },
    '/fees/arrears': { name:'Arrears', description:'Outstanding balances calculated from server-side invoices', id:'arrears', loader:'arrears' },
    '/finance/budgets': { name:'Budgets', description:'Server-backed budget register and allocation planning', id:'budgets', loader:'budgets' },
    '/fees/discounts': { name:'Discounts', description:'Discounts and concessions', id:'discounts', loader:'deferred' },
    '/fees/statements': { name:'Fee Statements', description:'Student fee statements from the canonical statement service', id:'fee-statements', loader:'statements' }
  };
  const route = new URLSearchParams(location.search).get('route') || location.pathname;
  const config = views[route];
  const title = document.querySelector('#title');
  const description = document.querySelector('#description');
  const view = document.querySelector('#view');
  const root = document.querySelector('#finance-canonical');
  const query = new URLSearchParams(location.search);
  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const money = (value) => `GHS ${Number(value ?? 0).toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  const text = (value, fallback = '—') => value === null || value === undefined || value === '' ? fallback : escapeHtml(value);
  const date = (value) => value ? escapeHtml(String(value).slice(0,19).replace('T',' ')) : '—';
  const state = (message, type = '') => `<div class="finance-state ${type}" data-state="${type || 'info'}">${escapeHtml(message)}</div>`;
  const table = (columns, rows, emptyMessage = 'No records found.') => {
    if (!rows.length) return state(emptyMessage, 'empty');
    return `<div class="finance-table-wrap"><table class="finance-table"><thead><tr>${columns.map((column) => `<th>${escapeHtml(column.label)}</th>`).join('')}</tr></thead><tbody>${rows.map((row) => `<tr>${columns.map((column) => `<td class="${column.numeric ? 'num' : ''}">${column.render(row)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  };
  async function fetchJson(url, options = {}) {
    const response = await fetch(url, { credentials:'same-origin', headers:{ Accept:'application/json', ...(options.headers || {}) }, cache:'no-store', ...options });
    let body = null;
    try { body = await response.json(); } catch { body = {}; }
    if (!response.ok) throw new Error(body.error || `Unable to load financial data (${response.status}).`);
    return body;
  }
  function renderShell(content) { view.innerHTML = content; }
  function renderKpis(items) { return `<section class="finance-kpis">${items.map((item) => `<article class="finance-kpi"><strong>${item.value}</strong><span>${escapeHtml(item.label)}</span></article>`).join('')}</section>`; }
  function reportSummary(report) {
    const summary = report.summary || {};
    return renderKpis([
      { label:'Expected fees', value:money(summary.totalExpectedFees) },
      { label:'Fees collected', value:money(summary.totalFeesCollected) },
      { label:'Outstanding fees', value:money(summary.totalOutstandingFees) },
      { label:'Total income', value:money(summary.totalIncome) },
      { label:'Total expenses', value:money(summary.totalExpenses) },
      { label:'Collection rate', value:`${Number(summary.collectionRate ?? 0).toFixed(2)}%` }
    ]);
  }
  const invoiceColumns = [
    { label:'Invoice', render:(row) => `<strong>${text(row.invoiceNumber)}</strong><small>${date(row.createdAt)}</small>` },
    { label:'Student', render:(row) => `${text(row.permanentStudentId || row.studentId)}<small>${text(row.classId)}</small>` },
    { label:'Fee / category', render:(row) => text((row.lineItems || []).map((item) => item.type).join(', ')) },
    { label:'Amount', numeric:true, render:(row) => money(row.total) },
    { label:'Paid', numeric:true, render:(row) => money(row.paid) },
    { label:'Balance', numeric:true, render:(row) => money(row.balance) },
    { label:'Status', render:(row) => text(row.status) }
  ];
  const paymentColumns = [
    { label:'Receipt / payment', render:(row) => `<strong>${text(row.receiptNumber)}</strong><small>${text(row.id)}</small>` },
    { label:'Student', render:(row) => `${text(row.permanentStudentId || row.studentId)}<small>${text(row.classId)}</small>` },
    { label:'Invoice', render:(row) => text(row.invoiceNumber) },
    { label:'Amount', numeric:true, render:(row) => money(row.amount) },
    { label:'Method', render:(row) => text(row.method) },
    { label:'Date', render:(row) => date(row.createdAt) },
    { label:'Status', render:(row) => text(row.status) }
  ];
  function searchBar(label, name, value = '') { return `<form class="finance-toolbar" data-finance-search><label>${escapeHtml(label)}<input name="${escapeHtml(name)}" value="${escapeHtml(value)}" placeholder="Enter Permanent Student ID" required></label><button class="button" type="submit">Load</button></form>`; }
  function bindSearch(loader) { document.querySelector('[data-finance-search]')?.addEventListener('submit', (event) => { event.preventDefault(); const value = new FormData(event.currentTarget).get('studentId'); loader(String(value || '').trim()); }); }
  function receiptActions(receiptNumber, { view = true } = {}) { if (!receiptNumber) return ''; const encoded = encodeURIComponent(receiptNumber); return `<span class="finance-actions">${view ? `<a class="text-button" href="/api/fees/receipts/${encoded}/preview" target="_blank" rel="noopener">View Receipt</a>` : ''}<button class="text-button" type="button" data-print-receipt="${escapeHtml(receiptNumber)}">Print Receipt</button><a class="text-button" href="/api/fees/receipts/${encoded}/pdf">Export to PDF</a></span>`; }
  async function printReceipt(receiptNumber) {
    const response = await fetch(`/api/fees/receipts/${encodeURIComponent(receiptNumber)}/preview`, { credentials:'same-origin', headers:{ Accept:'text/html' }, cache:'no-store' });
    if (!response.ok) throw new Error('Receipt is unavailable for printing.');
    const markup = await response.text();
    const printWindow = window.open('', '_blank', 'noopener,noreferrer');
    if (!printWindow) throw new Error('Allow pop-ups to print the receipt.');
    printWindow.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${escapeHtml(receiptNumber)} — Official Receipt</title><style>@page{size:A4;margin:10mm}body{margin:0;background:#fff;color:#102a43;font-family:Arial,sans-serif}.official-receipt{max-width:820px;margin:0 auto}.receipt-header-image{display:block;width:100%;height:auto}.receipt-body{position:relative;min-height:620px;padding:1.5rem;overflow:hidden}.receipt-watermark{position:absolute;top:50%;left:50%;width:40%;transform:translate(-50%,-50%);opacity:.07}.receipt-content{position:relative;z-index:1}.receipt-title-row{display:flex;justify-content:space-between;gap:1rem;align-items:center;border-bottom:2px solid #102a43;padding-bottom:.75rem}.receipt-grid{display:grid;grid-template-columns:minmax(130px,.35fr) 1fr;gap:.55rem 1rem}.receipt-grid dt{font-weight:700}.receipt-grid dd{margin:0;border-bottom:1px solid #dfe7ef;padding-bottom:.25rem}</style></head><body>${markup}</body></html>`);
    printWindow.document.close(); printWindow.focus(); printWindow.onload = () => printWindow.print();
  }
  function bindReceiptActions() { document.querySelectorAll('[data-print-receipt]').forEach((button) => button.addEventListener('click', async () => { button.disabled = true; try { await printReceipt(button.dataset.printReceipt); } catch (error) { showError(error); } finally { button.disabled = false; } })); }
  async function loadReport() { const report = await fetchJson('/api/reports/financial?reportType=FINANCIAL_SUMMARY'); renderShell(`<article class="card" data-functional-module="finance-reports"><h2>Financial summary</h2>${reportSummary(report)}<p class="finance-filter-note">Generated ${date(report.generatedAt)} by ${text(report.generatedByName || report.generatedByRole)}</p>${table([{label:'Income category',render:(row)=>text(row.category)},{label:'Total',numeric:true,render:(row)=>money(row.total)},{label:'Transactions',numeric:true,render:(row)=>text(row.count)}], report.incomeByCategory || [], 'No income categories recorded.')}</article>`); }
  async function loadOverview() { const [report, invoiceBody, paymentBody] = await Promise.all([fetchJson('/api/reports/financial?reportType=FINANCIAL_SUMMARY'), fetchJson('/api/fees/invoices'), fetchJson('/api/fees/payments')]); const invoices = invoiceBody.invoices || []; const payments = paymentBody.payments || []; renderShell(`<article class="card" data-functional-module="${escapeHtml(config.id)}"><h2>${escapeHtml(config.name)} overview</h2>${reportSummary(report)}<h3>Recent invoices</h3>${table(invoiceColumns, invoices.slice(-10).reverse(), 'No invoices found for the authenticated school.')}<h3>Recent payments</h3>${table(paymentColumns, payments.slice(-10).reverse(), 'No payments found for the authenticated school.')}</article>`); }
  async function loadInvoices() { const [invoiceBody, receiptBody] = await Promise.all([fetchJson('/api/fees/invoices'), fetchJson('/api/fees/receipts')]); const receipts = receiptBody.receipts || []; renderShell(`<article class="card" data-functional-module="invoices-receipts"><h2>Invoices</h2>${table(invoiceColumns, invoiceBody.invoices || [], 'No invoices found.')}<h2>Receipts</h2>${table(paymentColumns.concat([{label:'Actions',render:(row) => `${receiptActions(row.receiptNumber, { view: true })}`}]), receipts, 'No receipts found.')}</article>`); }
  function receivePaymentForm(metadata = {}) { const years = metadata.academicYears || []; const terms = metadata.terms || []; const feeTypes = metadata.feeTypes || []; return `<article class="card" data-functional-module="receive-payments"><h2>Receive Payment</h2><p class="finance-filter-note">Record one canonical payment and generate its official receipt. The authenticated user is recorded automatically.</p><form data-receive-payment><div class="finance-toolbar"><label>Payment Date<input type="date" name="paymentDate" value="${new Date().toISOString().slice(0,10)}" required></label><label>Academic Year<select name="academicYearId" required><option value="">Select academic year</option>${years.map((x)=>`<option value="${escapeHtml(x.id)}">${escapeHtml(x.name || x.id)}</option>`).join('')}</select></label><label>Term<select name="termId" required><option value="">Select term</option>${terms.map((x)=>`<option value="${escapeHtml(x.id)}">${escapeHtml(x.name || x.id)}</option>`).join('')}</select></label></div><div class="finance-toolbar"><label>Student Search<input name="studentQuery" data-student-query placeholder="Permanent ID, name, or parent phone" autocomplete="off" required></label><button class="button" type="button" data-student-search>Find student</button><select name="studentId" data-student-select required disabled><option value="">Select a student</option></select></div><div data-student-summary class="finance-filter-note">No student selected.</div><input type="hidden" name="permanentStudentId"><div class="finance-toolbar"><label>Fee Type<select name="feeType" required><option value="">Select fee type</option>${feeTypes.map((x)=>`<option value="${escapeHtml(x.id || x.name || x.feeType)}">${escapeHtml(x.name || x.feeType || x.id)}</option>`).join('')}<option value="OTHER">Other</option></select></label><label>Amount Due<input name="amountDue" data-amount-due readonly></label><label>Previously Paid<input name="previouslyPaid" data-previously-paid readonly></label><label>Outstanding Balance<input name="outstandingBalance" data-outstanding readonly></label><label>Amount Received (GHS)<input name="amountReceived" inputmode="decimal" required></label></div><div class="finance-toolbar"><label>Payment Method<select name="paymentMethod" required><option value="">Select method</option>${optionList(['CASH','MOBILE_MONEY','BANK_TRANSFER','BANK_DEPOSIT','CHEQUE','CARD_POS','ONLINE_PAYMENT','OTHER'])}</select></label><label>Payment Reference<input name="paymentReference" placeholder="Required for non-cash methods where applicable"></label><label>Received From<input name="receivedFrom" placeholder="Parent / guardian name"></label></div><label>Notes<textarea name="notes" rows="2"></textarea><div class="finance-actions"><button class="button" type="submit">Record Payment & Generate Receipt</button></div><p data-payment-status class="finance-filter-note"></p></form></article>`; }
  function bindReceivePayment(metadata) { const form = document.querySelector('[data-receive-payment]'); if (!form) return; const select = form.querySelector('[data-student-select]'); const summary = form.querySelector('[data-student-summary]'); form.querySelector('[data-student-search]').addEventListener('click', async () => { const q = form.querySelector('[data-student-query]').value.trim(); if (!q) return; try { const body = await fetchJson(`/api/students/search?q=${encodeURIComponent(q)}`); const students = body.students || []; select.innerHTML = '<option value="">Select a student</option>' + students.map((x)=>`<option value="${escapeHtml(x.id)}" data-permanent="${escapeHtml(x.permanentStudentId)}">${escapeHtml([x.firstName,x.middleName,x.surname].filter(Boolean).join(' '))} — ${escapeHtml(x.permanentStudentId)}${x.family?.[0]?.telephone ? ` · ${escapeHtml(x.family[0].telephone)}` : ''}</option>`).join(''); select.disabled = !students.length; if (!students.length) summary.textContent = 'No matching student found.'; } catch (error) { summary.textContent = error.message; } }); select.addEventListener('change', () => { const option = select.selectedOptions[0]; if (!option?.value) return; const student = (metadata._students || []).find((x)=>x.id === option.value); form.querySelector('[name=permanentStudentId]').value = option.dataset.permanent || ''; summary.innerHTML = student ? `<strong>${escapeHtml([student.firstName,student.middleName,student.surname].filter(Boolean).join(' '))}</strong> · Permanent ID ${escapeHtml(student.permanentStudentId)} · Class ${escapeHtml(student.classId || 'Not assigned')}<br>Parent/Guardian: ${escapeHtml(student.family?.[0]?.fullName || student.family?.[0]?.name || 'Not recorded')} · ${escapeHtml(student.family?.[0]?.telephone || 'No phone recorded')}` : `Selected student: ${escapeHtml(option.textContent)}`; }); form.addEventListener('submit', async (event) => { event.preventDefault(); const status = form.querySelector('[data-payment-status]'); const body = Object.fromEntries(new FormData(form)); delete body.studentQuery; delete body.amountDue; delete body.previouslyPaid; delete body.outstandingBalance; try { const result = await fetchJson('/api/fees/payments', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }); status.innerHTML = `<strong>RECEIPT GENERATED SUCCESSFULLY</strong> · <a class="text-button" href="/api/fees/receipts/${encodeURIComponent(result.receiptNumber)}" target="_blank">View Receipt ${escapeHtml(result.receiptNumber)}</a> ${receiptActions(result.receiptNumber, { view: false })}`; await loadPayments(); } catch (error) { status.textContent = error.message; } }); }
  async function loadPayments() { const [body, options] = await Promise.all([fetchJson('/api/fees/payments'), fetchJson('/api/fee-setup/options')]); let students = []; try { students = (await fetchJson('/api/students/search?q=')).students || []; } catch {} options._students = students; renderShell(receivePaymentForm(options) + `<article class="card" data-functional-module="payments"><h2>Payment Transactions / Receipt History</h2>${table(paymentColumns.concat([{label:'Actions',render:(row)=>`${receiptActions(row.receiptNumber)}`}]), body.payments || [], 'No payments found.')}</article>`); bindReceivePayment(options); bindReceiptActions(); }
  async function loadReceipts() { const body = await fetchJson('/api/fees/receipts'); const columns = paymentColumns.concat([{label:'Actions',render:(row) => `${receiptActions(row.receiptNumber, { view: true })}`}]); renderShell(`<article class="card" data-functional-module="receipts"><h2>Receipt register</h2>${table(columns, body.receipts || [], 'No receipts found.')}</article>`); bindReceiptActions(); }
  async function loadStructures() { renderShell(state('Loading published fee structures…')); const metadata = await fetchJson('/api/fee-setup/options'); const yearId = query.get('academicYearId') || ''; const requestedTermId = query.get('termId') || ''; const years = metadata.academicYears || []; const terms = metadata.terms || []; const availableTerms = terms.filter((item) => !yearId || !item.academicYearId || item.academicYearId === yearId); if (yearId && !years.some((item) => item.id === yearId)) throw Object.assign(new Error('Invalid academic year context.'), { code:'INVALID_ACADEMIC_CONTEXT' }); if (requestedTermId && !availableTerms.some((item) => item.id === requestedTermId)) throw Object.assign(new Error('Invalid term context for the selected academic year.'), { code:'INVALID_ACADEMIC_CONTEXT' }); const params = new URLSearchParams({status:'PUBLISHED'}); if (yearId) params.set('academicYearId', yearId); if (requestedTermId) params.set('termId', requestedTermId); const body = await fetchJson(`/api/fees/structures?${params}`); if (!Array.isArray(body.structures)) throw Object.assign(new Error('Unexpected fee structure response.'), { code:'FEE_STRUCTURE_RESPONSE_INVALID' }); const yearName = (id) => years.find((item) => item.id === id)?.name || id; const termName = (id) => terms.find((item) => item.id === id)?.name || id; const yearOptions = years.map((item) => `<option value="${escapeHtml(item.id)}" ${item.id === yearId ? 'selected' : ''}>${escapeHtml(item.name)}</option>`).join(''); const termOptions = availableTerms.map((item) => `<option value="${escapeHtml(item.id)}" ${item.id === requestedTermId ? 'selected' : ''}>${escapeHtml(item.name)}</option>`).join(''); const filter = `<form class="finance-toolbar" data-fee-period-filter><label>Academic year<select name="academicYearId"><option value="">All academic years</option>${yearOptions}</select></label><label>Term<select name="termId"><option value="">All terms</option>${termOptions}</select></label><button class="button" type="submit">Apply filters</button></form>`; const columns = [{label:'Academic year',render:(row)=>text(yearName(row.academicYearId))},{label:'Term',render:(row)=>text(termName(row.termId))},{label:'Fee type',render:(row)=>text(row.feeType || row.customFeeTypeName || row.id)},{label:'Amount (GH₵)',numeric:true,render:(row)=>money(Number(row.amountMinor)/100)},{label:'Target',render:(row)=>text(row.scope === 'WHOLE_SCHOOL' ? 'Whole school' : `${row.classId || 'Specific class'}`)},{label:'Publication status',render:(row)=>text(row.status)},{label:'Published',render:(row)=>date(row.publishedAt)}]; renderShell(`<article class="card" data-functional-module="fee-structure"><h2>Published fee structure</h2><p class="finance-filter-note">Published fees are read from the canonical durable fee obligations used by the parent Fee Hub.</p>${filter}<div data-fee-structure-results>${table(columns, body.structures, 'No fee structure published for the selected period.')}</div></article>`); document.querySelector('[data-fee-period-filter]')?.addEventListener('submit', (event) => { event.preventDefault(); const values = new FormData(event.currentTarget); const next = new URLSearchParams(location.search); next.set('route', '/fees/structure'); for (const key of ['academicYearId','termId']) { const value = String(values.get(key) || ''); if (value) next.set(key, value); else next.delete(key); } location.search = next.toString(); }); }
  async function loadAdmission() { const body = await fetchJson('/api/admission-fees'); renderShell(`<article class="card" data-functional-module="admission-fee-structures"><h2>Admission fee structures</h2>${table([{label:'Name',render:(row)=>text(row.name || row.title || row.type)},{label:'Amount',numeric:true,render:(row)=>money(row.amount)},{label:'Status',render:(row)=>text(row.status)}], body.fees || [], 'No admission structures found.')}</article>`); }
  async function loadInvoicesForStudent(studentId, mode) { const body = await fetchJson(`/api/fees/invoices?studentId=${encodeURIComponent(studentId)}`); const invoices = body.invoices || []; const payments = (await fetchJson(`/api/fees/payments?studentId=${encodeURIComponent(studentId)}`)).payments || []; const rows = invoices.map((invoice) => ({ ...invoice, permanentStudentId: invoice.permanentStudentId || studentId })); const content = `<article class="card" data-functional-module="${escapeHtml(mode)}"><h2>${mode === 'arrears' ? 'Outstanding balances' : 'Student fee account'}</h2><p class="finance-filter-note">Permanent Student ID: ${text(studentId)}</p>${mode === 'arrears' ? table(invoiceColumns, rows.filter((row) => Number(row.balance) > 0), 'No outstanding balances found.') : `${table(invoiceColumns, rows, 'No invoices found for this student.')}${table(paymentColumns, payments, 'No payments found for this student.')}`}</article>`; renderShell(searchBar('Permanent Student ID','studentId',studentId) + content); bindSearch((value) => loadInvoicesForStudent(value, mode).catch(showError)); }
  async function loadStudentFees() { const studentId = query.get('studentId'); if (!studentId) { renderShell(searchBar('Load student fee account','studentId') + state('Enter a Permanent Student ID to load the server-backed fee account.','empty')); bindSearch((value) => loadInvoicesForStudent(value, 'student-fees').catch(showError)); return; } await loadInvoicesForStudent(studentId, 'student-fees'); }
  async function loadArrears() { const studentId = query.get('studentId'); if (!studentId) { renderShell(searchBar('Load arrears','studentId') + state('Enter a Permanent Student ID to load server-derived outstanding balances.','empty')); bindSearch((value) => loadInvoicesForStudent(value, 'arrears').catch(showError)); return; } await loadInvoicesForStudent(studentId, 'arrears'); }

  async function loadCashbook(filters = {}) { const queryString = new URLSearchParams(Object.entries(filters).filter(([, value]) => value)).toString(); const body = await fetchJson(`/api/finance/cashbook${queryString ? `?${queryString}` : ''}`); const summary = body.summary || {}; const page = Number(body.page || 1); renderShell(`<article class="card" data-functional-module="cashbook"><h2>Cashbook Register</h2><p class="finance-filter-note">Read-only projection of qualifying Fee Payments, posted General Income, and posted General Expenses. Correct the authoritative source module; Cashbook updates automatically.</p>${renderKpis([{label:'Opening Balance',value:money(summary.openingBalance)},{label:'Total Money In',value:money(summary.totalMoneyIn)},{label:'Total Money Out',value:money(summary.totalMoneyOut)},{label:'Closing Balance',value:money(summary.closingBalance)}])}${cashbookFilters(filters, body)}${table(cashbookColumns, body.entries || [], 'No qualifying Cashbook entries found for the selected filters.')}<div class="finance-actions"><button class="text-button" type="button" data-cashbook-prev ${page <= 1 ? 'disabled' : ''}>Previous</button><span class="finance-filter-note">Page ${page} · ${body.total || 0} entries</span><button class="text-button" type="button" data-cashbook-next ${body.hasNext ? '' : 'disabled'}>Next</button></div></article>`); document.querySelector('[data-cashbook-filter]')?.addEventListener('submit', (event) => { event.preventDefault(); loadCashbook(Object.fromEntries(new FormData(event.currentTarget))).catch(showError); }); document.querySelectorAll('[data-cashbook-detail]').forEach((button) => button.addEventListener('click', () => loadCashbookDetail(button.dataset.cashbookDetail, button.dataset.cashbookId).catch(showError))); const nextPage = (delta) => { const next = Math.max(1, page + delta); const nextFilters = { ...filters, page: next }; loadCashbook(nextFilters).catch(showError); }; document.querySelector('[data-cashbook-prev]')?.addEventListener('click', () => nextPage(-1)); document.querySelector('[data-cashbook-next]')?.addEventListener('click', () => nextPage(1)); }
  function loadDeferred() { renderShell(`<article class="finance-state deferred" data-functional-module="${escapeHtml(config.id)}"><h2>${escapeHtml(config.name)} is not available yet</h2><p>This destination is intentionally deferred until its authoritative financial backend contract is available. No client-side records or sample values are shown.</p></article>`); }
  function showError(error) { renderShell(state(error.message || 'Unable to load financial data.','error')); }
  async function load() {
    if (!config) { title.textContent = 'Finance module not found'; description.textContent = 'The requested finance route is not configured.'; renderShell(state('This finance route is not configured.','error')); return; }
    title.textContent = config.name; description.textContent = config.description; root.dataset.viewId = config.id; document.title = `${config.name} | OsaaH Daylight`;
    renderShell(state('Loading financial data…'));
    try { await ({ report:loadReport, overview:loadOverview, invoices:loadInvoices, payments:loadPayments, receipts:loadReceipts, structures:loadStructures, admission:loadAdmission, studentFees:loadStudentFees, arrears:loadArrears, statements:loadStatements, income:loadIncome, expenses:loadExpenses, cashbook:loadCashbook, budgets:loadBudgets, deferred:loadDeferred }[config.loader])(); } catch (error) { showError(error); }
  }
  load();
})();
</script>
