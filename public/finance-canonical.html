<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page" id="finance-canonical"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">FEE HUB · FINANCE</p><h1 id="title">Finance</h1><p id="description" class="muted">Loading authorized financial data…</p><section id="view" class="report-grid"></section></main><script>
const views={
 '/fees':['Fees','Fee overview','fees-overview'], '/finance':['Finance','Finance overview and verified financial position','finance-overview'], '/fees/invoices':['Invoices & Receipts','Invoice and receipt register','invoices-receipts'], '/finance/reports':['Finance Reports','Financial reporting and reconciliation','finance-reports'], '/fees/structure':['Fee Structure','Published tuition and fee structures','fee-structure'], '/fees/scholarships':['Scholarships','Scholarship awards and concessions','scholarships'], '/fees/admission-structures':['Admission Fee Structures','Admission fee structures','admission-fee-structures'], '/fees/students':['Student Fees','Student fee accounts and balances','student-fees'], '/finance/income':['Income','Recorded income outside invoices','income'], '/fees/payments':['Payments','Payment transactions and collection status','payments'], '/finance/expenses':['Expenses','Recorded and approved expenses','expenses'], '/fees/receipts':['Receipts','Official receipt lookup and history','receipts'], '/finance/cashbook':['Cashbook','Cashbook movements and reconciliation','cashbook'], '/fees/arrears':['Arrears','Outstanding fee balances','arrears'], '/finance/budgets':['Budgets','Budget allocations and utilization','budgets'], '/fees/discounts':['Discounts','Approved discounts and concessions','discounts'], '/fees/statements':['Fee Statements','Student fee statements','fee-statements']
};
const route=new URLSearchParams(location.search).get('route')||'/finance'; const [name,description,id]=views[route]||views['/finance']; document.title=`${name} | OsaaH Daylight`; document.querySelector('#title').textContent=name; document.querySelector('#description').textContent=description; document.querySelector('#finance-canonical').dataset.viewId=id;
const view=document.querySelector('#view'); view.innerHTML=`<article class="card" data-canonical-view="${id}"><strong>${name}</strong><span>${description}</span><small id="data-status">Loading server data…</small></article>`;
async function load(){const status=document.querySelector('#data-status'); try { if(route==='/finance/reports'){const r=await fetch('/api/reports/financial?reportType=FINANCIAL_SUMMARY'); const j=await r.json(); if(!r.ok) throw Error(j.error||'Unable to load report'); status.textContent=`Verified report · ${j.summary?.totalIncome??0} income · ${j.summary?.totalExpenses??0} expenses`; return; } if(route==='/fees/admission-structures'){const r=await fetch('/api/admission-fees'); const j=await r.json(); if(!r.ok) throw Error(j.error||'Unable to load structures'); status.textContent=`${(j.fees||[]).length} admission structures available`; return; } status.textContent='Authorized financial view · server-backed data'; } catch(error){status.textContent=error.message;} } load();
</script></body></html>
