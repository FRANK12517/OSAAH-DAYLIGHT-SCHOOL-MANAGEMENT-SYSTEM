<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrator Management | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">ADMINISTRATIVE</p><h1>Administrator Management</h1><p class="muted">Assign and manage School Administrators. Temporary credentials are shown only once after creation.</p><section class="card"><h2>Assign School Administrator</h2><form id="administrator-form" class="stack-form"><label>Full Name<input name="fullName" required></label><label>Staff ID<input name="staffId" required></label><label>Phone Number<input name="phone" type="tel"></label><label>Email Address<input name="email" type="email"></label><label>Date Assigned<input name="assignedAt" type="date"></label><button class="primary-button" type="submit">Assign Administrator</button><p id="administrator-result" class="muted" role="status"></p></form></section><section class="card"><h2>Administrator History</h2><div class="responsive-table"><table><thead><tr><th>Full Name</th><th>Staff ID</th><th>Username</th><th>Date Assigned</th><th>Status</th><th>Actions</th></tr></thead><tbody id="administrator-rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section></main><script>
const form=document.querySelector('#administrator-form');const result=document.querySelector('#administrator-result');const rows=document.querySelector('#administrator-rows');const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){const response=await fetch('/api/administrators');if(!response.ok){rows.innerHTML='<tr><td colspan="6">Administrator access is required.</td></tr>';return}const data=await response.json();rows.innerHTML=data.administrators.map(item=>`<tr><td>${esc(item.fullName)}</td><td>${esc(item.staffId)}</td><td>${esc(item.username)}</td><td>${esc(item.assignedAt)}</td><td><span class="badge">${esc(item.status)}</span></td><td>${item.status==='ACTIVE'?`<button class="text-button" data-disable="${esc(item.userId)}">Disable</button><button class="text-button" data-revoke="${esc(item.userId)}">Revoke</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6">No administrator records yet.</td></tr>'}
form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button[type=submit]');button.disabled=true;result.textContent='Creating secure credentials…';try{const response=await fetch('/api/administrators',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await response.json();if(!response.ok){result.textContent=data.error??'Unable to assign administrator.';return}result.textContent=`Username: ${data.administrator.username} · Temporary password: ${data.temporaryPassword} · Share securely and require a password change.`;form.reset();await load()}finally{button.disabled=false}});rows.addEventListener('click',async event=>{const action=event.target.dataset.disable?'disable':'revoke';const id=event.target.dataset.disable||event.target.dataset.revoke;if(!id)return;await fetch(`/api/administrators/${encodeURIComponent(id)}/${action}`,{method:'POST'});await load()});load();
</script></body></html>
