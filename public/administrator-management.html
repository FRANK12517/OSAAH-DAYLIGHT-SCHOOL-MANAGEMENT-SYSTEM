<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrator Management | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">ADMINISTRATIVE</p><h1>Administrator Management</h1><p class="muted">Assign and manage School Administrators. Temporary credentials are shown only once after creation.</p><section class="card"><h2>Assign School Administrator</h2><form id="administrator-form" class="stack-form" novalidate><label for="administrator-full-name">Full Name<span aria-hidden="true"> *</span><input id="administrator-full-name" name="fullName" autocomplete="name" required aria-describedby="administrator-result"></label><label for="administrator-staff-id">Staff ID<span aria-hidden="true"> *</span><input id="administrator-staff-id" name="staffId" autocomplete="off" required aria-describedby="administrator-result"></label><label for="administrator-phone">Phone Number<input id="administrator-phone" name="phone" type="tel" autocomplete="tel"></label><label for="administrator-email">Email Address<input id="administrator-email" name="email" type="email" autocomplete="email"></label><label for="administrator-assigned-at">Date Assigned<input id="administrator-assigned-at" name="assignedAt" type="date"></label><button class="primary-button" type="submit">Assign Administrator</button><p id="administrator-result" class="muted" role="status" aria-live="polite"></p></form></section><section class="card"><h2>Administrator History</h2><div class="responsive-table"><table><thead><tr><th>Full Name</th><th>Staff ID</th><th>Username</th><th>Date Assigned</th><th>Status</th><th>Actions</th></tr></thead><tbody id="administrator-rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section></main><script>
const form=document.querySelector('#administrator-form');const result=document.querySelector('#administrator-result');const rows=document.querySelector('#administrator-rows');const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){const response=await fetch('/api/administrators');if(!response.ok){rows.innerHTML='<tr><td colspan="6">Administrator access is required.</td></tr>';return}const data=await response.json();rows.innerHTML=data.administrators.map(item=>`<tr><td>${esc(item.fullName)}</td><td>${esc(item.staffId)}</td><td>${esc(item.username)}</td><td>${esc(item.assignedAt)}</td><td><span class="badge">${esc(item.status)}</span></td><td>${item.status==='ACTIVE'?`<button class="text-button" data-disable="${esc(item.userId)}">Disable</button><button class="text-button" data-revoke="${esc(item.userId)}">Revoke</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6">No administrator records yet.</td></tr>'}
form.addEventListener('submit',async event=>{event.preventDefault();const required=[['fullName','Enter the administrator’s full name.'],['staffId','Enter the administrator’s Staff ID.']];for(const[name,message]of required){const field=form.elements[name];field.setCustomValidity('');if(!String(field.value).trim()){field.setCustomValidity(message);result.textContent=message;field.reportValidity();field.focus();return}}const email=form.elements.email;if(email.value&&!email.validity.valid){result.textContent='Enter a valid email address or leave it blank.';email.reportValidity();email.focus();return}const button=form.querySelector('button[type=submit]');button.disabled=true;result.textContent='Creating secure credentials…';try{const values=Object.fromEntries(new FormData(form));for(const key of ['fullName','staffId','phone','email','assignedAt'])values[key]=String(values[key]??'').trim();const response=await fetch('/api/administrators',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});const data=await response.json();if(!response.ok){result.textContent=data.error??'Unable to assign administrator.';return}result.textContent=`Username: ${data.administrator.username} · Temporary password: ${data.temporaryPassword} · Share securely and require a password change.`;form.reset();await load()}finally{button.disabled=false}});form.addEventListener('input',event=>{if(event.target.matches('[required]'))event.target.setCustomValidity('')});rows.addEventListener('click',async event=>{const action=event.target.dataset.disable?'disable':'revoke';const id=event.target.dataset.disable||event.target.dataset.revoke;if(!id)return;await fetch(`/api/administrators/${encodeURIComponent(id)}/${action}`,{method:'POST'});await load()});load();
</script></body></html>
