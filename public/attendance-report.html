<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Reports | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css"><style>#output .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem;margin:1rem 0}#output .metric{padding:.75rem;border:1px solid #d6b15a;border-radius:.35rem;background:#fffdf4}#output table{width:100%;border-collapse:collapse}#output th,#output td{padding:.55rem;border-bottom:1px solid #ddd;text-align:left}.hidden{display:none}</style></head><body><main class="form-page"><a class="text-button" href="/">← Dashboard</a><p class="eyebrow">ATTENDANCE MANAGEMENT</p><h1>Attendance Reports</h1><p class="muted">Server-backed attendance aggregation from canonical persisted attendance records.</p><form id="filters" class="student-form"><label>Report Period<select name="period" id="period"><option value="DAILY">Daily</option><option value="WEEKLY">Weekly</option><option value="MONTHLY">Monthly</option><option value="TERM">Term</option></select></label><label>Academic Year<select name="academicYear" id="academic-year" required><option value="">Loading academic years…</option></select></label><label>Term<select name="term" id="term" required><option value="">Loading terms…</option></select></label><label>Class<select name="classId" id="class"><option value="">All classes</option><option>Nursery 1</option><option>Nursery 2</option><option>KG1</option><option>KG2</option><option>Primary 1</option><option>Primary 2</option><option>Primary 3</option><option>Primary 4</option><option>Primary 5</option><option>Primary 6</option><option>JHS 1</option><option>JHS 2</option><option>JHS 3</option></select></label><label id="date-filter">Date<input type="date" name="date"></label><label id="week-filter" class="hidden">Week<input type="week" name="week"></label><label id="month-filter" class="hidden">Month<input type="month" name="month"></label><button class="primary-button" type="submit">Generate Report</button></form><section id="output" class="card"><p class="muted">Choose a report period and generate attendance metrics.</p></section></main><script>
const form=document.querySelector('#filters'),period=document.querySelector('#period'),year=document.querySelector('#academic-year'),term=document.querySelector('#term'),output=document.querySelector('#output');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const filters=()=>Object.fromEntries([...new FormData(form)].filter(([,v])=>v));
function toggle(){document.querySelector('#date-filter').classList.toggle('hidden',period.value!=='DAILY');document.querySelector('#week-filter').classList.toggle('hidden',period.value!=='WEEKLY');document.querySelector('#month-filter').classList.toggle('hidden',period.value!=='MONTHLY');}period.addEventListener('change',toggle);toggle();
(async()=>{const r=await fetch('/api/attendance/options'),d=await r.json();if(!r.ok){output.innerHTML='<p class="error">'+esc(d.error||'Options unavailable.')+'</p>';return}year.innerHTML='<option value="">Choose an academic year</option>'+d.academicYears.map(x=>'<option>'+esc(x.name||x.id)+'</option>').join('');term.innerHTML='<option value="">Choose a term</option>'+d.terms.map(x=>'<option>'+esc(x.name||x.id)+'</option>').join('');})();
function metric(label,value){return '<div class="metric"><strong>'+esc(value)+'</strong><span>'+esc(label)+'</span></div>'}function render(r){const enrolled=r.enrolled||{boys:0,girls:0,total:r.totalStudents||0};output.innerHTML='<h2>'+esc(r.period)+' Attendance</h2><p>'+esc(r.academicYear)+' · '+esc(r.term)+' · '+esc(r.classId||'All classes')+(r.range?' · '+esc(r.range.label):'')+'</p><div class="metric-grid">'+metric('Boys Present',r.boysPresent)+metric('Girls Present',r.girlsPresent)+metric('Total Present',r.totalPresent)+metric('Total Absent',r.totalAbsent)+metric('Total Late',r.totalLate)+metric('Total Excused/Leave',r.totalExcused)+metric('Attendance Days',r.attendanceDays)+metric('Attendance Percentage',r.attendancePercentage+'%')+'</div><table><thead><tr><th>Metric</th><th>Boys</th><th>Girls</th><th>Total</th></tr></thead><tbody><tr><td>Enrolled</td><td>'+enrolled.boys+'</td><td>'+enrolled.girls+'</td><td>'+enrolled.total+'</td></tr><tr><td>Present</td><td>'+r.boysPresent+'</td><td>'+r.girlsPresent+'</td><td>'+r.totalPresent+'</td></tr><tr><td>Absent</td><td>'+r.boysAbsent+'</td><td>'+r.girlsAbsent+'</td><td>'+r.totalAbsent+'</td></tr><tr><td>Late</td><td>'+r.boysLate+'</td><td>'+r.girlsLate+'</td><td>'+r.totalLate+'</td></tr><tr><td>Excused/Leave</td><td>'+r.boysExcused+'</td><td>'+r.girlsExcused+'</td><td>'+r.totalExcused+'</td></tr></tbody></table>'+(r.days?'<h3>Weekly breakdown</h3><table><thead><tr><th>Day</th><th>Date</th><th>Total Present</th><th>Total Absent</th><th>Late</th><th>Excused</th><th>Percentage</th></tr></thead><tbody>'+r.days.map(d=>'<tr><td>'+d.day+'</td><td>'+d.date+'</td><td>'+d.totalPresent+'</td><td>'+d.totalAbsent+'</td><td>'+d.totalLate+'</td><td>'+d.totalExcused+'</td><td>'+d.attendancePercentage+'%</td></tr>').join('')+'</tbody></table>':'');}
form.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/attendance/reports?'+new URLSearchParams(filters())),d=await r.json();if(r.ok)render(d);else output.innerHTML='<p class="error">'+esc(d.error||'Unable to load attendance report.')+'</p>';});
</script></body></html>
