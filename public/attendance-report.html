<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Attendance Reports | OsaaH Daylight</title><link rel="stylesheet" href="/styles.css">
  <style>
    .report-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;align-items:end}.report-filters label{display:flex;flex-direction:column;gap:.35rem}.report-actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}.report-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.75rem;margin:1rem 0}.report-summary article{padding:.8rem;border:1px solid #d9e0e7;border-radius:.45rem;background:#fff}.report-summary strong{display:block;font-size:1.2rem}.table-wrap{overflow:auto}.table-wrap table{width:100%;border-collapse:collapse;min-width:920px}.table-wrap th,.table-wrap td{padding:.55rem;border-bottom:1px solid #d9e0e7;text-align:left;white-space:nowrap}.table-wrap th{background:#f3f6f9}.state{color:#526273}.error{color:#8c1d1d}@media print{.report-filters,.report-actions,.text-button{display:none!important}body{background:#fff}.card{border:0;box-shadow:none}}
  </style>
</head>
<body>
  <main class="form-page">
    <a class="text-button" href="/attendance">← Attendance Overview</a>
    <p class="eyebrow">ATTENDANCE MANAGEMENT</p><h1>Attendance Reports</h1>
    <p class="muted">Every view and export is generated from the same authoritative, sample-excluded attendance snapshot.</p>
    <section class="card">
      <form id="filters" class="report-filters">
        <label>Report type<select name="reportType"><option value="STUDENT">Student</option><option value="STAFF">Staff</option><option value="CLASS" selected>Class</option><option value="GENDER">Gender</option><option value="WEEKLY">Weekly</option><option value="MONTHLY">Monthly</option><option value="TERM">Term</option><option value="ACADEMIC_YEAR">Academic year</option></select></label>
        <label>Period<select name="period" id="period"><option value="TERM" selected>Term</option><option value="DAILY">Daily</option><option value="WEEKLY">Weekly</option><option value="MONTHLY">Monthly</option><option value="ACADEMIC_YEAR">Academic year</option><option value="CUSTOM">Custom range</option></select></label>
        <label>Academic year<input name="academicYear" placeholder="2026/2027"></label>
        <label>Term<input name="term" placeholder="1st Term"></label>
        <label>Class<input name="classId" placeholder="Primary 1"></label>
        <label id="date-field">Date<input name="date" type="date"></label>
        <label id="week-field" hidden>ISO week<input name="week" type="week"></label>
        <label id="month-field" hidden>Month<input name="month" type="month"></label>
        <label id="start-field" hidden>Start date<input name="startDate" type="date"></label>
        <label id="end-field" hidden>End date<input name="endDate" type="date"></label>
      </form>
      <div class="report-actions"><button class="primary-button" id="generate" type="button">Generate report</button><button class="text-button" id="pdf" type="button">Export PDF</button><button class="text-button" id="xlsx" type="button">Export XLSX</button><button class="text-button" id="print" type="button">Open print view</button></div>
      <p id="state" class="state" role="status" aria-live="polite">Choose filters and generate an attendance report.</p>
    </section>
    <section id="output" class="card"><p class="state">No report generated.</p></section>
  </main>
<script>
const form=document.querySelector('#filters'),output=document.querySelector('#output'),state=document.querySelector('#state'),period=document.querySelector('#period');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const query=()=>new URLSearchParams([...new FormData(form)].filter(([,v])=>v));
function updateFields(){const value=period.value;document.querySelector('#date-field').hidden=value!=='DAILY';document.querySelector('#week-field').hidden=value!=='WEEKLY';document.querySelector('#month-field').hidden=value!=='MONTHLY';document.querySelector('#start-field').hidden=value!=='CUSTOM';document.querySelector('#end-field').hidden=value!=='CUSTOM'}
period.addEventListener('change',updateFields);updateFields();
function summaryCards(report){const s=report.summary||{},students=s.students||{},staff=s.staff||{};return [['Students enrolled',students.totalEnrolled??'—'],['Student present days',students.presentStudentDays??'—'],['Student absent days',students.absentStudentDays??'—'],['Student attendance rate',students.attendanceRate==null?'—':students.attendanceRate+'%'],['Registered staff',staff.totalRegisteredStaff??'—'],['Staff attendance rate',staff.attendanceRate==null?'—':staff.attendanceRate+'%']].map(([label,value])=>`<article><strong>${esc(value)}</strong><span>${esc(label)}</span></article>`).join('')}
function render(report){const rows=report.rows||[],headers=Object.keys(rows[0]||{message:'No observations'}),data=rows.length?rows:[{message:'No authoritative observations for this scope.'}];output.innerHTML=`<h2>${esc(report.title)}</h2><p class="state">${esc(report.period.label)} · ${esc(report.filters.academicYear||'All academic years')} · ${esc(report.filters.term||'All terms')}</p><div class="report-summary">${summaryCards(report)}</div><p class="state">Source: ${esc(report.source)} · Sample/test data excluded: ${esc(report.sampleDataExcluded)}</p><div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${data.map(row=>`<tr>${headers.map(h=>`<td>${esc(row[h])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
async function generate(){state.classList.remove('error');state.textContent='Loading canonical attendance snapshot…';try{const r=await fetch('/api/attendance/reports/canonical?'+query(),{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Report unavailable.');render(d);state.textContent=`${d.rows?.length||0} rows generated at ${d.generatedAt}.`;window.currentReport=d}catch(e){state.textContent=e.message;state.classList.add('error')}}
async function download(format){state.classList.remove('error');state.textContent=`Preparing ${format} export from the same report snapshot…`;const params=query();params.set('format',format);const r=await fetch('/api/attendance/reports/export?'+params,{credentials:'same-origin'});if(!r.ok){const d=await r.json();state.textContent=d.error||'Export unavailable.';state.classList.add('error');return}const blob=await r.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`attendance-report.${format.toLowerCase()}`;link.click();URL.revokeObjectURL(url);state.textContent=`${format} export downloaded.`}
document.querySelector('#generate').addEventListener('click',generate);document.querySelector('#pdf').addEventListener('click',()=>download('PDF'));document.querySelector('#xlsx').addEventListener('click',()=>download('XLSX'));document.querySelector('#print').addEventListener('click',()=>window.open('/api/attendance/reports/print?'+query(),'_blank','noopener'));form.addEventListener('submit',e=>{e.preventDefault();generate()});
</script>
</body>
</html>
