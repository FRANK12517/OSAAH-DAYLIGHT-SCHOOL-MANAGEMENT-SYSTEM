name: Production pre-050 contract inventory

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact release commit to inspect
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-pre-050-contract-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Read-only pre-050 production contract inventory
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OUTPUT_DIR: part5fe1-artifacts
      GITHUB_SHA: ${{ inputs.release_ref }}
    steps:
      - name: Check out requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Confirm protected database secret is available
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "Protected DATABASE_URL is unavailable."
            exit 1
          fi
          echo "Protected DATABASE_URL is available."
      - name: Run fixed-query read-only contract inventory
        run: |
          mkdir -p part5fe1-artifacts
          node scripts/production-pre-050-contract-inventory.mjs | tee part5fe1-artifacts/part5fe1-contract-result.json
      - name: Upload sanitized contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: part5fe1-production-contract-${{ inputs.release_ref }}
          path: part5fe1-artifacts/
          if-no-files-found: error
