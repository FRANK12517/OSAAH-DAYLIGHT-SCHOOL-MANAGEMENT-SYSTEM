name: Production global student ID uniqueness migration 085
"on":
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact reviewed release commit SHA containing Migration 085
        required: true
        type: string
      execution_token:
        description: DRY_RUN_ONLY is read-only; apply requires explicit authorization
        required: true
        default: DRY_RUN_ONLY
        type: string
      backup_confirmation:
        description: Enter BACKUP_CONFIRMED after verifying the current recoverable TiDB Cloud backup
        required: false
        type: string
      backup_cluster:
        description: Confirmed TiDB Cloud backup cluster name
        required: false
        type: string
      backup_status:
        description: Confirmed backup status
        required: false
        type: string
      backup_restore_available:
        description: Confirm that restore is available for this backup
        required: false
        type: string
      backup_completed_at:
        description: Confirmed backup completion time in UTC
        required: false
        type: string
      backup_expires_at:
        description: Confirmed backup expiration time in UTC
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: production-global-student-id-unique-migration-085
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      OSAAH_DATABASE_ADAPTER: tidb
      TIDB_SSL_REJECT_UNAUTHORIZED: 'true'
      EXECUTION_TOKEN: ${{ inputs.execution_token }}
      BACKUP_CONFIRMATION: ${{ inputs.backup_confirmation }}
    steps:
      - name: Validate exact release and execution inputs
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          BACKUP_CLUSTER: ${{ inputs.backup_cluster }}
          BACKUP_STATUS: ${{ inputs.backup_status }}
          BACKUP_RESTORE_AVAILABLE: ${{ inputs.backup_restore_available }}
          BACKUP_COMPLETED_AT: ${{ inputs.backup_completed_at }}
          BACKUP_EXPIRES_AT: ${{ inputs.backup_expires_at }}
        run: |
          [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_ref must be a full lowercase 40-character SHA.'; exit 1; }
          test "$EXECUTION_TOKEN" = 'DRY_RUN_ONLY' || test "$EXECUTION_TOKEN" = 'INITIALIZE_MIGRATION_METADATA_ONLY' || test "$EXECUTION_TOKEN" = 'APPLY_GLOBAL_STUDENT_ID_UNIQUE_085' || { echo 'Invalid Migration 085 execution token.'; exit 1; }
          if [ "$EXECUTION_TOKEN" = 'INITIALIZE_MIGRATION_METADATA_ONLY' ] || [ "$EXECUTION_TOKEN" = 'APPLY_GLOBAL_STUDENT_ID_UNIQUE_085' ]; then
            test "$BACKUP_CONFIRMATION" = 'BACKUP_CONFIRMED' || { echo 'A current recoverable backup confirmation is required for production writes.'; exit 1; }
            test "$BACKUP_CLUSTER" = 'osaahdaylightschool' || { echo 'Backup cluster does not match the canonical database.'; exit 1; }
            test "$BACKUP_STATUS" = 'Succeeded' || { echo 'The confirmed backup must have Succeeded.'; exit 1; }
            test "$BACKUP_RESTORE_AVAILABLE" = 'true' || { echo 'The confirmed backup must be restorable.'; exit 1; }
            completed_at="$(date -u -d "$BACKUP_COMPLETED_AT" +%s)" || { echo 'Invalid backup completion time.'; exit 1; }
            expires_at="$(date -u -d "$BACKUP_EXPIRES_AT" +%s)" || { echo 'Invalid backup expiry time.'; exit 1; }
            now="$(date -u +%s)"
            test "$completed_at" -le "$now" && test "$now" -lt "$expires_at" || { echo 'The confirmed backup is not within its retention window.'; exit 1; }
          fi
      - name: Check out reviewed release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
      - name: Check out release verification tool
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .migration-085-verifier
          persist-credentials: false
      - name: Verify release commit is on protected main
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: node .migration-085-verifier/scripts/verify-migration-085-release.mjs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Migration 085 safety tests
        env:
          DATABASE_URL: ''
          OSAAH_DATABASE_ADAPTER_MODULE: ''
        run: node --test test/production-global-student-id-unique-migration-085.test.js test/migration-runner.test.js
      - name: Confirm protected TiDB secret is available
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: test -n "${DATABASE_URL:-}" || { echo 'Protected DATABASE_URL is unavailable.'; exit 1; }
      - name: Initialize only existing platform migration metadata
        if: ${{ inputs.execution_token == 'INITIALIZE_MIGRATION_METADATA_ONLY' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_CONFIRMATION: ${{ inputs.backup_confirmation }}
          BACKUP_CLUSTER: ${{ inputs.backup_cluster }}
          BACKUP_STATUS: ${{ inputs.backup_status }}
          BACKUP_RESTORE_AVAILABLE: ${{ inputs.backup_restore_available }}
          BACKUP_COMPLETED_AT: ${{ inputs.backup_completed_at }}
          BACKUP_EXPIRES_AT: ${{ inputs.backup_expires_at }}
        run: node .migration-085-verifier/scripts/production-migration-metadata-initialize.mjs
      - name: Run read-only duplicate and index preflight
        if: ${{ inputs.execution_token == 'DRY_RUN_ONLY' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/production-global-student-id-unique-migrate-085.mjs dry-run
      - name: Apply only Migration 085 after duplicate preflight
        if: ${{ inputs.execution_token == 'APPLY_GLOBAL_STUDENT_ID_UNIQUE_085' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/production-global-student-id-unique-migrate-085.mjs apply
