name: One-time Proprietor credential reset

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact reviewed release containing the reset script
        required: true
        type: string
      confirmation:
        description: Type RESET_EXISTING_PROPRIETOR_ONLY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: one-time-proprietor-credential-reset
  cancel-in-progress: false

jobs:
  reset:
    name: Protected existing Proprietor credential reset
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PROPRIETOR_QA_PASSWORD: ${{ secrets.PROPRIETOR_QA_PASSWORD }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out reviewed reset script
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify protected inputs
        shell: bash
        run: |
          test -n "${DATABASE_URL:-}"
          test -n "${PROPRIETOR_QA_PASSWORD:-}"
          test "$CONFIRMATION" = "RESET_EXISTING_PROPRIETOR_ONLY"
          echo "Protected inputs are available; password value is not printed."
      - name: Execute one-time reset
        run: node scripts/one-time-proprietor-credential-reset.mjs
