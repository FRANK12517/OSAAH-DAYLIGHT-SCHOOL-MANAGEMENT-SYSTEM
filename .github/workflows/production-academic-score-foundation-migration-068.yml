name: Production academic score foundation migration 068
"on":
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact reviewed release commit SHA containing Migration 068 and its prerequisite safeguards
        required: true
        type: string
      execution_token:
        description: Use DRY_RUN_ONLY for read-only preflight or APPLY_ACADEMIC_SCORE_FOUNDATION_068 for separately approved apply
        required: true
        default: DRY_RUN_ONLY
        type: string
      backup_confirmation:
        description: For apply only, enter BACKUP_CONFIRMED after verifying a recent recoverable backup
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: production-academic-score-foundation-migration-068
  cancel-in-progress: false
jobs:
  migrate:
    name: Preflight or apply authoritative academic score foundation
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      EXECUTION_TOKEN: ${{ inputs.execution_token }}
      BACKUP_CONFIRMATION: ${{ inputs.backup_confirmation }}
    steps:
      - name: Validate exact release ref and approval inputs
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_ref must be a full lowercase 40-character SHA.'; exit 1; }
          test "$EXECUTION_TOKEN" = 'DRY_RUN_ONLY' || test "$EXECUTION_TOKEN" = 'APPLY_ACADEMIC_SCORE_FOUNDATION_068' || { echo 'Invalid Migration 068 execution token.'; exit 1; }
          if [ "$EXECUTION_TOKEN" = 'APPLY_ACADEMIC_SCORE_FOUNDATION_068' ]; then test "$BACKUP_CONFIRMATION" = 'BACKUP_CONFIRMED' || { echo 'A recent recoverable backup confirmation is required for apply.'; exit 1; }; fi
      - name: Check out reviewed release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
      - name: Verify release is based on protected main
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          test "$(git rev-parse HEAD^{commit})" = "$RELEASE_REF"
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main "$RELEASE_REF"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run protected migration contracts
        run: node --test test/academic-migration-safety.test.js test/academic-result-lifecycle-contract.test.js test/academic-score-foundation-contract.test.js test/migration-runner.test.js
      - name: Confirm protected database secret is available
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: test -n "${DATABASE_URL:-}" || { echo 'Protected DATABASE_URL is unavailable.'; exit 1; }
      - name: Run read-only foundation preflight
        if: ${{ inputs.execution_token == 'DRY_RUN_ONLY' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/production-academic-score-foundation-migrate.mjs dry-run
      - name: Apply only the separately authorized Migration 068
        if: ${{ inputs.execution_token == 'APPLY_ACADEMIC_SCORE_FOUNDATION_068' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/production-academic-score-foundation-migrate.mjs apply
