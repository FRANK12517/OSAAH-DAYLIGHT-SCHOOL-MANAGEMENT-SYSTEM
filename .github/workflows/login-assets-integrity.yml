name: Login asset integrity

on:
  pull_request:
    paths:
      - 'public/index.html'
      - 'public/assets/**'
      - 'config/login-assets.integrity.json'
      - 'scripts/verify-login-assets.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/login-assets-integrity.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'public/index.html'
      - 'public/assets/**'
      - 'config/login-assets.integrity.json'
      - 'scripts/verify-login-assets.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/login-assets-integrity.yml'

permissions:
  contents: read

jobs:
  verify-login-assets:
    name: Verify protected login assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify logo and gallery integrity
        run: npm run assets:verify
