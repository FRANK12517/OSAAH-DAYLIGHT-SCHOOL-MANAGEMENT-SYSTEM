name: Production sample fixture migration

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact reviewed release commit SHA containing migration 061
        required: true
        type: string
      execution_token:
        description: Type APPLY_SAMPLE_FIXTURES_061 to authorize migration 061
        required: true
        default: DRY_RUN_ONLY
        type: string

permissions:
  contents: read

concurrency:
  group: production-sample-fixture-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Preflight, apply, and verify migration 061
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out reviewed release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Confirm protected database secret and execution token
        run: |
          test -n "${DATABASE_URL:-}"
          test "${{ inputs.execution_token }}" = 'DRY_RUN_ONLY' || test "${{ inputs.execution_token }}" = 'APPLY_SAMPLE_FIXTURES_061'
      - name: Read-only Migration 061 preflight
        run: node scripts/production-sample-fixture-migrate.mjs dry-run
      - name: Apply only Migration 061
        if: ${{ inputs.execution_token == 'APPLY_SAMPLE_FIXTURES_061' }}
        run: node scripts/production-sample-fixture-migrate.mjs apply
      - name: Verify Migration 061 ledger and schema
        run: |
          node scripts/production-sample-fixture-migrate.mjs dry-run
          npm run migration:validate
      - name: Run focused fixture tests
        run: node --test test/sample-fixture-repository.test.js
