name: Production subject updated_at migration 073
"on":
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact reviewed release SHA containing migration 073 and its safeguards
        required: true
        type: string
      execution_token:
        description: Use DRY_RUN_ONLY for a read-only preflight or APPLY_SUBJECT_UPDATED_AT_073 for the separately approved apply
        required: true
        default: DRY_RUN_ONLY
        type: string
      backup_confirmation:
        description: For apply only, enter BACKUP_CONFIRMED after verifying a recent recoverable backup
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: production-subject-updated-at-migration-073
  cancel-in-progress: false
jobs:
  migrate:
    name: Preflight or apply subject updated_at migration 073
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      EXECUTION_TOKEN: ${{ inputs.execution_token }}
      BACKUP_CONFIRMATION: ${{ inputs.backup_confirmation }}
    steps:
      - name: Validate exact release and execution inputs
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_ref must be a full lowercase 40-character SHA.'; exit 1; }
          test "$EXECUTION_TOKEN" = 'DRY_RUN_ONLY' || test "$EXECUTION_TOKEN" = 'APPLY_SUBJECT_UPDATED_AT_073' || { echo 'Invalid Migration 073 execution token.'; exit 1; }
          if [ "$EXECUTION_TOKEN" = 'APPLY_SUBJECT_UPDATED_AT_073' ]; then
            test "$BACKUP_CONFIRMATION" = 'BACKUP_CONFIRMED' || { echo 'A recent recoverable backup confirmation is required for apply.'; exit 1; }
          fi
      - name: Check out reviewed release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
      - name: Verify release is based on protected main
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          test "$(git rev-parse HEAD^{commit})" = "$RELEASE_REF"
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main "$RELEASE_REF"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run focused Migration 073 and subject-sync tests
        env:
          DATABASE_URL: ''
          OSAAH_DATABASE_ADAPTER_MODULE: ''
        run: node --test test/production-subject-updated-at-migration.test.js test/production-subject-configuration-sync.test.js test/migration-runner.test.js
      - name: Confirm protected database secret is available
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: test -n "${DATABASE_URL:-}" || { echo 'Protected DATABASE_URL is unavailable.'; exit 1; }
      - name: Run read-only Migration 073 preflight
        if: ${{ inputs.execution_token == 'DRY_RUN_ONLY' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/production-subject-updated-at-migrate-073.mjs dry-run
      - name: Apply only the separately authorized Migration 073
        if: ${{ inputs.execution_token == 'APPLY_SUBJECT_UPDATED_AT_073' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/production-subject-updated-at-migrate-073.mjs apply
